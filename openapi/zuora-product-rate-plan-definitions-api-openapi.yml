components:
  parameters:
    GLOBAL_HEADER_Idempotency_Key:
      name: Idempotency-Key
      in: header
      required: false
      description: "Specify a unique idempotency key if you want to perform an idempotent POST or PATCH request. Do not use this header in other request types. \n\nWith this header specified, the Zuora server can identify subsequent retries of the same request using this value, which prevents the same operation from being performed multiple times by accident. \n"
      schema:
        type: string
        maxLength: 255
    GLOBAL_HEADER_Authorization_OAuth_optional:
      name: Authorization
      in: header
      required: false
      description: 'The value is in the `Bearer {token}` format where {token} is a valid OAuth token generated by calling [Create an OAuth token](/api-references/api/operation/createToken).

        '
      schema:
        type: string
    GLOBAL_HEADER_Accept_Encoding:
      name: Accept-Encoding
      in: header
      required: false
      description: "Include the `Accept-Encoding: gzip` header to compress responses as a gzipped file. It can significantly reduce the bandwidth required for a response. \n\nIf specified, Zuora automatically compresses responses that contain over 1000 bytes of data, and the response contains a `Content-Encoding` header with the compression algorithm so that your client can decompress it.\n"
      schema:
        type: string
    GLOBAL_HEADER_Content_Encoding:
      name: Content-Encoding
      in: header
      required: false
      description: 'Include the `Content-Encoding: gzip` header to compress a request. With this header specified, you should upload a gzipped file for the request payload instead of sending the JSON payload.

        '
      schema:
        type: string
    GLOBAL_HEADER_Zuora_Track_Id:
      name: Zuora-Track-Id
      in: header
      required: false
      description: 'A custom identifier for tracing the API call. If you set a value for this header, Zuora returns the same value in the response headers. This header enables you to associate your system process identifiers with Zuora API calls, to assist with troubleshooting in the event of an issue.


        The value of this field must use the US-ASCII character set and must not include any of the following characters: colon (`:`), semicolon (`;`), double quote (`"`), and quote (`''`).

        '
      schema:
        type: string
        maxLength: 64
    GLOBAL_HEADER_Zuora_Entity_Ids_Single:
      name: Zuora-Entity-Ids
      in: header
      required: false
      description: 'An entity ID. If you have [Zuora Multi-entity](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Multi-entity) enabled and the OAuth token is valid for more than one entity, you must use this header to specify which entity to perform the operation in. If the OAuth token is only valid for a single entity, or you do not have Zuora Multi-entity enabled, you do not need to set this header.

        '
      schema:
        type: string
  schemas:
    GETProductRatePlanDefinitionsResponse:
      properties:
        productRatePlanDefinitions:
          description: 'The list of the product rate plan definitions that are retrieved.

            '
          items:
            properties:
              id:
                description: 'The unique ID of the product rate plan definition.

                  '
                type: string
              productRatePlanChargeId:
                description: 'The unique ID of the product charge in this rate plan definition.

                  '
                type: string
              productRatePlanChargeName:
                description: 'Th name of the product charge in this rate plan definition.

                  '
                type: string
              productRatePlanChargeNumber:
                description: 'The unique number (natural key) of the product charge in this rate plan definition.

                  '
                type: string
              productRatePlanId:
                description: 'The unique ID of the product rate plan that uses this rate plan definition.

                  '
                type: string
              productRatePlanName:
                description: 'Th name of the product rate plan that uses this rate plan definition.

                  '
                type: string
              productRatePlanNumber:
                description: 'The unique number (natural key) of the product rate plan that uses this rate plan definition.

                  '
                type: string
            title: productRatePlanDefinitions
            type: object
          type: array
        success:
          description: 'Indicates whether the request succeeded.

            '
          type: boolean
      type: object
    POSTRatePlanDefinitionRequest:
      example:
        productRatePlanChargeId: 2c9890e489f227bd0189f22f3482001f
        productRatePlanChargeNumber: PRPC-00000001
        productRatePlanId: 2c9890678b1ca909018b1caea5c30000
        productRatePlanNumber: PRP-00000008
      properties:
        productRatePlanChargeId:
          description: 'The unique ID of the product rate plan charge to be used in the product rate plan.

            '
          type: string
        productRatePlanChargeNumber:
          description: 'The unique number (natural key) of the product rate plan charge to be used in the product rate plan.

            '
          type: string
        productRatePlanId:
          description: 'The unique ID of the product rate plan that uses this rate plan definition.

            '
          type: string
        productRatePlanNumber:
          description: 'The unique number (natural key) of the product rate plan that uses this rate plan definition.

            '
          type: string
      type: object
    GETProductRatePlanDefinitionResponse:
      properties:
        id:
          description: 'The unique ID of the product rate plan definition.

            '
          type: string
        productRatePlanChargeId:
          description: 'The unique ID of the product charge in this rate plan definition.

            '
          type: string
        productRatePlanChargeName:
          description: 'Th name of the product charge in this rate plan definition.

            '
          type: string
        productRatePlanChargeNumber:
          description: 'The unique number (natural key) of the product charge in this rate plan definition.

            '
          type: string
        productRatePlanId:
          description: 'The unique ID of the product rate plan that uses this rate plan definition.

            '
          type: string
        productRatePlanName:
          description: 'Th name of the product rate plan that uses this rate plan definition.

            '
          type: string
        productRatePlanNumber:
          description: 'The unique number (natural key) of the product rate plan that uses this rate plan definition.

            '
          type: string
        success:
          description: 'Indicates whether the request succeeded.

            '
          type: boolean
      type: object
    CommonResponseType:
      properties:
        processId:
          description: 'The Id of the process that handle the operation.

            '
          type: string
        reasons:
          items:
            properties:
              code:
                description: 'The error code of response.

                  '
                type: string
              message:
                description: 'The detail information of the error response

                  '
                type: string
            type: object
          type: array
        success:
          description: 'Indicates whether the call succeeded.

            '
          type: boolean
      type: object
    POSTRatePlanDefinitionResponse:
      properties:
        id:
          description: 'The unique ID of the product charge definition.

            '
          type: string
        success:
          description: 'Indicates whether the request succeeded.

            '
          type: boolean
      type: object
