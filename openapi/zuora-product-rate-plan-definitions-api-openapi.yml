openapi: 3.2.0
info:
  version: '2023-12-15'
  title: Reference Product Rate Plan Definitions API
  description: '# Introduction


    Welcome to the REST API reference for the Zuora Billing, Payments, and Central Platform!'
  contact:
    email: docs@zuora.com
servers:
- url: https://rest.zuora.com/
tags:
- name: Product Rate Plan Definitions
  description: 'Use product rate plan definitions to reuse charges in different product rate plans.


    The Product Rate Plan Definition object is in the **Early Adopter** phase. We are actively soliciting feedback from a small set of early adopters before releasing it as generally available. If you are interested, please reach out to your CSM.'
paths:
  /v1/product-rateplan-definitions:
    post:
      summary: Create a product rate plan definition
      operationId: POST_CreateProductRatePlanDefinition
      description: 'Creates a product rate plan definition to use a charge in a product rate plan.


        In the request, you must specify either the unique ID or number of both the charge and the product rate plan to add the specified charge to a specific rate plan.


        **Note**: This operation requires the Attribute-based Pricing feature to be enabled, which is in the **Early Adopter** phase.'
      tags:
      - Product Rate Plan Definitions
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Idempotency_Key'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth_optional'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      responses:
        '200':
          headers:
            Content-Encoding:
              description: "This header is returned if you specify the `Accept-Encoding: gzip` request header and the response contains over 1000 bytes of data.\n\nNote that only the following MIME types support gzipped responses:\n  - `application/json`\n  - `application/xml`\n  - `text/html`\n  - `text/csv`\n  - `text/plain`\n"
              schema:
                type: string
            RateLimit-Limit:
              description: 'The request limit quota for the time window closest to exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: string
            RateLimit-Remaining:
              description: 'The number of requests remaining in the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            RateLimit-Reset:
              description: 'The number of seconds until the quota resets for the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            Zuora-Request-Id:
              description: 'The Zuora internal identifier of the API call. You cannot control the value of this header.

                '
              schema:
                type: string
                maxLength: 36
                minLength: 36
            Zuora-Track-Id:
              description: 'A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.

                '
              schema:
                type: string
                maxLength: 64
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POSTRatePlanDefinitionResponse'
              example:
                id: 2c9890f78aba5c16018ababa00120019
                success: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POSTRatePlanDefinitionRequest'
        required: true
    get:
      summary: List product rate plan definitions
      operationId: GET_RetrieveProductRatePlanDefinitions
      description: 'Retrieves basic information about the product rate plan definitions for a product rate plan.


        **Note**: This operation requires the Attribute-based Pricing feature to be enabled, which is in the **Early Adopter** phase.'
      tags:
      - Product Rate Plan Definitions
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth_optional'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - name: charge
        in: query
        description: 'The unique number or ID of the charge for which the product rate plan definitions are to be retrieved.

          '
        required: false
        schema:
          type: string
      - name: rateplan
        in: query
        description: 'The unique number or ID of the product rate plan for which the product rate plan definitions are to be retrieved.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          headers:
            Content-Encoding:
              description: "This header is returned if you specify the `Accept-Encoding: gzip` request header and the response contains over 1000 bytes of data.\n\nNote that only the following MIME types support gzipped responses:\n  - `application/json`\n  - `application/xml`\n  - `text/html`\n  - `text/csv`\n  - `text/plain`\n"
              schema:
                type: string
            RateLimit-Limit:
              description: 'The request limit quota for the time window closest to exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: string
            RateLimit-Remaining:
              description: 'The number of requests remaining in the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            RateLimit-Reset:
              description: 'The number of seconds until the quota resets for the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            Zuora-Request-Id:
              description: 'The Zuora internal identifier of the API call. You cannot control the value of this header.

                '
              schema:
                type: string
                maxLength: 36
                minLength: 36
            Zuora-Track-Id:
              description: 'A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.

                '
              schema:
                type: string
                maxLength: 64
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GETProductRatePlanDefinitionsResponse'
              example:
                productRatePlanDefinitions:
                - id: 2c9890f78b212d76018b218993c9005c
                  productRatePlanChargeId: 2c9890f78aba5c16018ababa00120019
                  productRatePlanChargeNumber: PRPC-NEW-00000175
                  productRatePlanChargeName: New Component
                  productRatePlanId: 2c9890678b1ca909018b1caea5c30000
                  productRatePlanNumber: PRP-NEW-00000353
                  productRatePlanName: New Rate Plan2
                - id: 2c9890f78b212d76018b21742683005a
                  productRatePlanChargeId: 2c9890f78b212d76018b2174263c004a
                  productRatePlanChargeNumber: PRPC-NEW-00000246
                  productRatePlanChargeName: API_Usage_Tiered-multi
                  productRatePlanId: 2c9890678b1ca909018b1caea5c30000
                  productRatePlanNumber: PRP-NEW-00000353
                  productRatePlanName: New Rate Plan2
                success: true
