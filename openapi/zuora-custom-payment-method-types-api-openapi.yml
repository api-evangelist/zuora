      summary: Create a draft custom payment method type
      operationId: POST_CreateDraftOpenPaymentMethodType
      description: 'Creates a draft version of a custom payment method type. Revision number 1 is assigned to this version. You can update your draft version through the [Update a custom payment method type](/api-references/api/operation/PUT_UpdateOpenPaymentMethodType/) operation. You must publish your draft version through the [Publish a custom payment method type](/api-references/api/operation/PUT_PublishOpenPaymentMethodType/) operation before your custom payment method type goes live.

