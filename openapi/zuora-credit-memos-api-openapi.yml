openapi: 3.2.0
info:
  version: '2023-12-15'
  title: Reference Credit Memos API
  description: '# Introduction


    Welcome to the REST API reference for the Zuora Billing, Payments, and Central Platform!'
  contact:
    email: docs@zuora.com
servers:
- url: https://rest.zuora.com/
tags:
- name: Credit Memos
  description: 'Credit memos reduce invoice and account balances. By applying one or more credit memos to invoices with positive balances, you can reduce the invoice balances in the same way that applying a payment to an invoice.


    For more information about credit memos, see Credit and debit memos.'
paths:
  /v1/creditmemos:
    post:
      description: '**Note:** This operation is only available if you have Invoice Settlement enabled. The Invoice Settlement feature is generally available as of Zuora Billing Release 296 (March 2021). This feature includes Unapplied Payments, Credit and Debit Memo, and Invoice Item Settlement. If you want to enable Invoice Settlement, see Invoice Settlement Enablement and Checklist Guide for more information.


        Creates an ad-hoc credit memo from a product rate plan charge. Zuora supports the creation of credit memos from any type of product rate plan charge. The charges can also have any amount and any charge model, except for discout charge models.


        When credit memos are created from product rate plan charges, the specified amount with decimal places is now validated based on the decimal places supported by each currency.


        You can create a credit memo only if you have the user permission. See Billing Roles for more information.'
      summary: Create a credit memo from a charge
      operationId: POST_CreditMemoFromPrpc
      tags:
      - Credit Memos
