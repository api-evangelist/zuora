            type: string
          zipCode:
            description: 'The zip code for the address of the account holder.

              '
            type: string
        type: object
      accountMaskNumber:
        description: "The masked account number such as ****1234.\n\nWhen creating the following tokenized payment methods, if the `tokens` field is provided, this `accountMaskNumber` field is required.\n  - SEPA payment methods on Adyen\n  - BACS payment methods on Stripe\n\nFor more information about how to create the preceding tokenized payment methods, see the following articles in Zuora Knowledge Center:\n  - <a href=\"https://knowledgecenter.zuora.com/Zuora_Payments/Payment_gateway_integrations/Supported_payment_gateways/Adyen_Integration_v2.0/D_Tokenize_SEPA_payment_methods_on_Adyen_Integration_v2.0\" target=\"_blank\">Tokenize SEPA payment methods on Adyen Integration v2.0</a>\n  - <a href=\"https://knowledgecenter.zuora.com/Zuora_Payments/Payment_gateway_integrations/Supported_payment_gateways/Stripe_Payment_Gateway/A_Overview_of_Stripe_payment_gateway_integration\" target=\"_blank\">Overview of Stripe payment gateway integration</a>\n"
        type: string
      accountNumber:
        description: "The number of the customer's bank account. This field is required for the following bank transfer payment methods:\n  - Direct Entry AU (`Becs`)\n  - Direct Debit NZ (`Becsnz`)\n  - Direct Debit UK (`Bacs`). For creating tokenized BACS payment methods on Stripe v2, this field is optional. If the `tokens` field is specified, `accountNumber` is not required but  `accountMaskNumber` is required.\n  - Denmark Direct Debit (`Betalingsservice`)\n  - Sweden Direct Debit (`Autogiro`)\n  - Canadian Pre-Authorized Debit (`PAD`)\n"
        type: string
      bankCode:
        description: "The sort code or number that identifies the bank. This is also known as the sort code. This field is required for the following bank transfer payment methods:\n  - Direct Debit UK (`Bacs`)\n  - Denmark Direct Debit (`Betalingsservice`)\n  - Direct Debit NZ (`Becsnz`)\n  - Canadian Pre-Authorized Debit (`PAD`)\n"
        type: string
      branchCode:
        description: "The branch code of the bank used for direct debit. This field is required for the following bank transfer payment methods:\n  - Sweden Direct Debit (`Autogiro`)\n  - Direct Entry AU (`Becs`)\n  - Direct Debit NZ (`Becsnz`)\n  - Canadian Pre-Authorized Debit (`PAD`)\n"
        type: string
      businessIdentificationCode:
        description: 'The BIC code used for SEPA.

          '
        type: string
      currencyCode:
        description: 'The currency used for payment method authorization.


          If this field is not specified, `currency` specified for the account is used for payment method authorization. If no currency is specified for the account, the default currency of the account is then used.

          '
        type: string
      identityNumber:
        description: "The identity number used for Bank Transfer. This field is required for the following bank transfer payment methods:\n  - Denmark Direct Debit (`Betalingsservice`)\n  - Sweden Direct Debit (`Autogiro`)\n"
        type: string
      tokenize:
        default: false
        description: "When creating a SEPA payment method on Adyen Integration v2.0, use this field to specify whether to tokenize the payment method with IBAN. If `tokenize` is `true`, `IBAN` is required.\n\nIf the `tokens` field is provided, this `tokenize` field is not required. \n\nFor more information about how to create tokenized SEPA payment methods on Adyen, see <a href=\"https://knowledgecenter.zuora.com/Zuora_Payments/Payment_gateway_integrations/Supported_payment_gateways/Adyen_Integration_v2.0/D_Tokenize_SEPA_payment_methods_on_Adyen_Integration_v2.0\" target=\"_blank\">Tokenize SEPA payment methods on Adyen Integration v2.0</a>.\n"
        type: boolean
      tokens:
        description: "To create the following tokenized payment methods, pass in the existing token information:\n  - Tokenized SEPA payment methods on Adyen Integration v2.0\n  - Tokenized BACS payment methods on Stripe v2\n\nFor more information about how to create the preceding tokenized payment methods, see the following articles in Zuora Knowledge Center:\n  - <a href=\"https://knowledgecenter.zuora.com/Zuora_Payments/Payment_gateway_integrations/Supported_payment_gateways/Adyen_Integration_v2.0/D_Tokenize_SEPA_payment_methods_on_Adyen_Integration_v2.0\" target=\"_blank\">Tokenize SEPA payment methods on Adyen Integration v2.0</a>\n  - <a href=\"https://knowledgecenter.zuora.com/Zuora_Payments/Payment_gateway_integrations/Supported_payment_gateways/Stripe_Payment_Gateway/A_Overview_of_Stripe_payment_gateway_integration\" target=\"_blank\">Overview of Stripe payment gateway integration</a>\n"
        properties:
          gatewayType:
            description: "Required. \n\nThe type of the payment gateway to generate the tokens. This field is case-sensitive.\n"
            enum:
            - Adyen
            - Stripe
            type: string
          secondTokenId:
            description: "Pass in the second token of the payment method. The value of this field varies depending on gateways. For more information, see the following articles in Zuora Knowledge Center:\n  - <a href=\"https://knowledgecenter.zuora.com/Zuora_Payments/Payment_gateway_integrations/Supported_payment_gateways/Adyen_Integration_v2.0/D_Tokenize_SEPA_payment_methods_on_Adyen_Integration_v2.0\" target=\"_blank\">Tokenize SEPA payment methods on Adyen Integration v2.0</a>\n  - <a href=\"https://knowledgecenter.zuora.com/Zuora_Payments/Payment_gateway_integrations/Supported_payment_gateways/Stripe_Payment_Gateway/A_Overview_of_Stripe_payment_gateway_integration\" target=\"_blank\">Overview of Stripe payment gateway integration</a>\n"
            type: string
          thirdTokenId:
            description: 'Pass in the third token of the payment method.

              '
            type: string
          tokenId:
            description: "Required. \n\nPass in the first token of the payment method. The value of this field varies depending on gateways. For more information, see the following articles in Zuora Knowledge Center:\n  - <a href=\"https://knowledgecenter.zuora.com/Zuora_Payments/Payment_gateway_integrations/Supported_payment_gateways/Adyen_Integration_v2.0/D_Tokenize_SEPA_payment_methods_on_Adyen_Integration_v2.0\" target=\"_blank\">Tokenize SEPA payment methods on Adyen Integration v2.0</a>\n  - <a href=\"https://knowledgecenter.zuora.com/Zuora_Payments/Payment_gateway_integrations/Supported_payment_gateways/Stripe_Payment_Gateway/A_Overview_of_Stripe_payment_gateway_integration\" target=\"_blank\">Overview of Stripe payment gateway integration</a>\n"
            type: string
        type: object
    type: object
