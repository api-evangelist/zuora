definitions:
  POSTBillingPreviewCreditMemoItem:
    properties:
      amount:
        description: 'The amount of the credit memo item. For tax-inclusive credit memo items, the amount indicates the credit memo item amount including tax. For tax-exclusive credit memo items, the amount indicates the credit memo item amount excluding tax

          '
        format: double
        type: number
      amountWithoutTax:
        description: 'The credit memo item amount excluding tax.

          '
        format: double
        type: number
      appliedToItemId:
        description: 'The unique ID of the credit memo item that the discount charge is applied to.

          '
        type: string
      chargeDate:
        description: 'The date when the credit memo item is created.

          '
        format: date-time
        type: string
      chargeNumber:
        description: 'Number of the charge.

          '
        type: string
      chargeType:
        description: "The type of charge. \n\nPossible values are `OneTime`, `Recurring`, and `Usage`.\n"
        type: string
      comment:
        description: 'Comment of the credit memo item.

          '
        type: string
      id:
        description: 'Credit memo item id.

          '
