      type: object
    MigrationUpdateCustomObjectDefinitionsResponse:
      additionalProperties: false
      properties:
        actions:
          description: The actions of updating custom object definitions, to be performed as parts of the migration.  Currently only one action per migration is supported.
          items:
            $ref: '#/components/schemas/CustomObjectDefinitionUpdateActionResponse'
          maxItems: 1
          minItems: 1
          type: array
      type: object
    UpdateCustomObjectCusotmField:
      description: A reference to a field.
      properties:
        auditable:
          description: 'Indicates whether Audit Trail will record changes of this custom field. You can change auditable fields to non-auditable, and vice versa. One custom object can have a maximum of five auditable fields.

            '
          type: boolean
        definition:
          $ref: '#/components/schemas/CustomObjectCustomFieldDefinitionUpdate'
          description: The custom field definition to be added or updated
          type: object
        filterable:
          description: 'Indicates whether the field is filterable or not. Applicable to `addField` and `updateField` actions.


            You can change a filterable field to non-filterable and vice versa. You can also add a filterable field. One custom object can have a maximum of 10 filterable fields.


            Note that changing filterable fields triggers reindexing. It will take 12-24 hours before all your data are reindexed and available to query.

            '
          type: boolean
        name:
          description: The name of the custom field to be updated
          type: string
        required:
          description: 'Indicates whether the field is required or optional.


            You can update a required field to optional. On the other hand, you can only update an optional field to required on the custom object with no records.


            You can only add a required field to the custom object with no records.

            '
          type: boolean
        targetName:
          description: Required if the `type` of the action is `renameField`
          type: string
        unique:
          description: 'Indicates whether to specify a unique constraint to the field. You can remove the unique constraint on the field. However, you can only add a unique constraint to a filterable field if the custom object contains no record. One custom object can have a maximum of five fields with unique constraints.

            '
          type: boolean
      type: object
    CustomObjectCustomFieldsDefinition:
      additionalProperties:
        $ref: '#/components/schemas/CustomObjectCustomFieldDefinition'
      description: The custom field definition in the custom object definition
      title: customObjectCustomFieldDefinition
      type: object
    CustomObjectDefinitions:
      additionalProperties:
        $ref: '#/components/schemas/CustomObjectDefinition'
      description: The custom object definitions. This object maps types to custom object definitions.
      title: customObjectDefinitions
      type: object
    PostCustomObjectDefinitionsRequest:
      example:
        definitions:
          Delivery:
            description: Delivery schedule for shipping products based on customer's subscription.
            filterable:
            - Quantity__c
            - ProductName__c
            - Cancelled__c
            - ShippingStatus__c
            label: Delivery
            object: Delivery
            properties:
              CancellationTime__c:
                description: The time at which customer cancelled this particular shipment.
                format: date-time
                label: Cancellation Time
                type: string
              Cancelled__c:
                default: false
                description: Indicator is true when the customer has cancelled this particular shipment.
                label: Shipment Cancelled
                type: boolean
              ContactEmail__c:
                description: The customer's email address.
                label: Customer Email
                maxLength: 128
                type: string
              ContactId__c:
                description: The customer contact who will receive the shipment.
                format: uuid
                label: Ship To Customer
                type: string
              ProductName__c:
                description: The name of the product that is being shipped to customer.
                label: Product Name
                type: string
              Quantity__c:
                description: The quantity of product that is being shipped to customer.
                label: Quantity
                maximum: 20
                minimum: 1
                type: integer
              ShippingDate__c:
                description: The date the product will be sent to shipping vendor for delivery.
                format: date
                label: Shipping Date
                type: string
              ShippingStatus__c:
                default: Pending
                description: The status of the shipment - e.g. Pending, Preparing shipment, Waiting for tracking information, or Shipped.
                enum:
                - Pending
                - Preparing shipment
                - Waiting for tracking information
                - Shipped
                label: Shipping Status
                type: string
              SubscriptionId__c:
                description: The subscription that is associated with the shipment record.
                format: uuid
                label: Subscription
                type: string
              TotalWeight__c:
                description: The total weight of the product and packaging that is being shipped to customer.
                label: Total Weight (lbs.)
                minimum: 0
                type: number
            relationships:
            - cardinality: manyToOne
              fields:
                SubscriptionId__c: Id
              namespace: com_zuora
              object: subscription
              recordConstraints:
                create:
                  enforceValidMapping: false
            - cardinality: manyToOne
              fields:
                ContactId__c: Id
              namespace: com_zuora
              object: contact
              recordConstraints:
                create:
                  enforceValidMapping: false
            required:
            - SubscriptionId__c
            - ContactId__c
            - ProductName__c
            - Quantity__c
            - ShippingDate__c
          birth_place_custom_object:
            filterable:
            - city__c
            label: Birth Place Custom Object
            object: birth_place_custom_object
            properties:
              ContactId__c:
                format: uuid
                label: Contact
                type: string
              city__c:
                label: city label
                type: string
              country__c:
                label: country label
                type: string
              state__c:
                label: state label
                type: string
            relationships:
            - cardinality: manyToOne
              fields:
                ContactId__c: Id
              namespace: com_zuora
              object: contact
              recordConstraints:
                create:
                  enforceValidMapping: false
            required:
            - city__c
            - state__c
            - country__c
            type: object
      properties:
        definitions:
          $ref: '#/components/schemas/PostCustomObjectDefinitionsRequestDefinitions'
      type: object
    CustomObjectCustomFieldDefinitionUpdate:
      description: The custom field definition in the custom object
      properties:
        default:
          description: Applicable if the `type` of the action is  `updateField`
          type: string
        description:
          description: Applicable if the `type` of the action is  `updateField`
          type: string
        displayName:
          description: 'Indicates whether to use this field as the display name of the custom object when being linked to another custom object.


            This field applies only to the Text custom field type:


            - The `type` field is `string`.

            - The `enum` field is not specified.

            '
          type: boolean
        format:
          description: The data format of the custom field
          type: string
        label:
          description: The UI label of the custom field
          type: string
        maxLength:
          description: "The maximum length of string that can be stored in the custom field.\n\nThis field applies only to the following custom field types:\n\n- Text:\n  - The `type` field is `string`.\n  - The `format` field is not specified or is `url`.\n  - The `enum` field is not specified.\n- Picklist:\n  - The `type` field is `string`.\n  - The `enum` field is specified.\n  - The `multiselect` field is not specified or is `false`.\n- Multiselect:\n  - The `type` field is `string`.\n  - The `enum` field is specified.\n  - The `multiselect` field is `true`.\n\nIf the custom field is filterable, the value of `maxLength` must be 512 or less.\n"
          type: integer
        multiselect:
          description: 'Indicates whether this is a multiselect custom field.


            This field applies only to the creation of Picklist or Multiselect custom fields:


            - The action `type` field is `addField`.

            - The definition `type` field is `string`.

            - The `maxLength` field is specified.

            - The `enum` field is specified.

            '
          type: boolean
        origin:
          description: Specifies that this is a custom field
          enum:
          - custom
          type: string
        type:
          description: The data type of the custom field
          type: string
      title: customObjectCustomFieldDefinition
      type: object
    PostCustomObjectDefinitionFieldDefinitionRequest:
      properties:
        displayName:
          description: 'Indicates whether to use this field as the display name of the custom object when being linked to another custom object.


            This field applies only to the Text custom field type:


            - The `type` field is `string`.

            - The `enum` field is not specified.

            '
          type: boolean
        format:
          description: The data format of the custom field
          type: string
        label:
          description: The UI label of the custom field
          type: string
        maxLength:
          description: "The maximum length of string that can be stored in the custom field.\n\nThis field applies only to the following custom field types:\n\n- Text:\n  - The `type` field is `string`.\n  - The `format` field is not specified or is `url`.\n  - The `enum` field is not specified.\n- Picklist:\n  - The `type` field is `string`.\n  - The `enum` field is specified.\n  - The `multiselect` field is not specified or is `false`.\n- Multiselect:\n  - The `type` field is `string`.\n  - The `enum` field is specified.\n  - The `multiselect` field is `true`.\n\nIf the custom field is filterable, the value of `maxLength` must be 512 or less.\n"
          type: integer
        multiselect:
          description: 'Indicates whether this is a multiselect custom field.


            This field applies only to the Picklist or Multiselect custom field types:


            - The `type` field is `string`.

            - The `maxLength` field is specified.

            - The `enum` field is specified.

            '
          type: boolean
        type:
          description: The data type of the custom field
          type: string
      required:
      - type
      - label
      title: customObjectCustomFieldDefinition
      type: object
