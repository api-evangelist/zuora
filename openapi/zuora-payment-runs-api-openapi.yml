definitions:
  GETPaymentRunDataElementResponse:
    allOf:
    - properties:
        accountId:
          description: 'The customer account ID specified in the `data` field when creating the payment run.

            '
          type: string
        accountNumber:
          description: 'The customer account number specified in the `data` field when creating the payment run.

            '
          type: string
        amount:
          description: 'The amount specified in the `data` field when creating the payment run. `null` is returned if it was not specified.

            '
          type: number
        amountCollected:
          description: 'The amount that is collected.

            '
          type: number
        amountToCollect:
          description: 'The amount to be collected.

            '
          type: number
        comment:
          description: 'The comment specified in the `data` field when creating the payment run. `null` is returned if it was not specified.

            '
          type: string
        currency:
          description: 'This field is only available if support for standalone payments is enabled.


            The currency of the standalone payment. The currency of the standalone payment can be different from the payment currency defined in the customer account settings.

            '
          type: string
        documentId:
          description: 'The billing document ID specified in the `data` field when creating the payment run. `null` is returned if it was not specified.

            '
          type: string
        documentNumber:
          description: 'The billing document number specified in the `data` field when creating the payment run. `null` is returned if it was not specified.

            '
          type: string
        documentType:
          description: 'The billing document type specified in the `data` field when creating the payment run. `null` is returned if it was not specified.

            '
          enum:
          - Invoice
          - DebitMemo
          type: string
        errorCode:
          description: 'The error code of the response.

            '
          type: string
        errorMessage:
          description: 'The detailed information of the error response.

            '
          type: string
        paymentGatewayId:
          description: 'The payment gateway ID specified in the `data` field when creating the payment run. `null` is returned if it was not specified.

            '
          type: string
        paymentMethodId:
          description: 'The payment method ID specified in the `data` field when creating the payment run. `null` is returned if it was not specified.

            '
          type: string
        result:
          description: 'Indicates whether the data is processed successfully or not.

            '
          enum:
          - Processed
          - Error
          type: string
        standalone:
          description: 'This field is only available if the support for standalone payment is enabled.


            The value `true` indicates this is a standalone payment that is created and processed in Zuora through Zuora gateway integration but will be settled outside of Zuora. No settlement data will be created. The standalone payment cannot be applied, unapplied, or transferred.

            '
          type: boolean
        transactions:
          description: 'Container for transactions that apply to the current request. Each element contains an array of the settlement/payment applied to the record.

            '
          items:
            $ref: '#/definitions/GETPaymentRunDataTransactionElementResponse'
          type: array
      title: payment run data
      type: object
    - $ref: '#/definitions/PaymentObjectCustomFields'
  CommonResponseType:
    properties:
      processId:
        description: 'The Id of the process that handle the operation.

          '
        type: string
      reasons:
        items:
          properties:
            code:
              description: 'The error code of response.

                '
              type: string
            message:
              description: 'The detail information of the error response

                '
              type: string
          type: object
        type: array
      success:
        description: 'Indicates whether the call succeeded.

          '
        type: boolean
    type: object
  GETPaymentRunDataArrayResponse:
    properties:
      data:
        description: 'Container for payment run data. Each element in the array is a record processed by the payment run.

          '
        items:
          $ref: '#/definitions/GETPaymentRunDataElementResponse'
        type: array
      success:
        description: 'Returns `true` if the request was processed successfully.

          '
        type: boolean
    type: object
  GETPaymentRunSummaryResponse:
    properties:
      numberOfCreditBalanceAdjustments:
        description: '**Note:** This field is only available if you have the Credit Balance feature enabled.


          The number of credit balance adjustments that are successfully processed in the payment run.

          '
        type: integer
      numberOfCreditMemos:
        description: '**Note:** This field is only available if you have the Invoice Settlement feature enabled.


          The total number of credit memos that are successfully processed in the payment run.

          '
        type: integer
      numberOfDebitMemos:
        description: '**Note:** This field is only available if you have the Invoice Settlement feature enabled.


          The total number of debit memos that are picked up for processing in the payment run.

          '
        type: integer
      numberOfErrorInputData:
        description: 'The number of input data that are processed with errors.

          '
        type: integer
      numberOfErrors:
        description: 'The number of payments with the status of `Error` and `Processing`.

          '
        type: integer
      numberOfInputData:
        description: 'The total number of input data.

          '
        type: integer
      numberOfInvoices:
        description: '**Note:** This field is only available if you have the Invoice Settlement feature enabled.


          The total number of invoices that are picked up for processing in the payment run.

          '
        type: integer
      numberOfPayments:
        description: 'The number of payments that are successfully processed in the payment run.

          '
        type: integer
      numberOfProcessedInputData:
        description: 'The number of input data that are successfully processed.

          '
        type: integer
      numberOfReceivables:
        description: 'The total number of receivables that are picked up for processing in the payment run.


          The value of this field is the sum of the value of the `numberOfInvoices` field and that of the `numberOfDebitMemos` field.

          '
        type: integer
      numberOfUnappliedPayments:
        description: '**Note:** This field is only available if you have the Invoice Settlement feature enabled.


          The number of unapplied payments that are successfully processed in the payment run.

          '
        type: integer
      numberOfUnprocessedDebitMemos:
        description: '**Note:** This field is only available if you have the Invoice Settlement feature enabled.


          The number of debit memos with remaining positive balances after the payment run is completed.

          '
        type: integer
      numberOfUnprocessedInvoices:
        description: '**Note:** This field is only available if you have the Invoice Settlement feature enabled.


          The number of invoices with remaining positive balances after the payment run is completed.

          '
        type: integer
      numberOfUnprocessedReceivables:
        description: 'The number of receivables with remaining positive balances after the payment run is completed.

          '
        type: integer
      success:
        description: 'Returns `true` if the request was processed successfully.

          '
        type: boolean
      totalValues:
        description: 'Container for total values.

          '
        items:
          $ref: '#/definitions/GETPaymentRunSummaryTotalValues'
        type: array
    type: object
  PUTPaymentRunRequest:
    example:
      autoApplyCreditMemo: 'true'
      autoApplyUnappliedPayment: 'true'
      consolidatedPayment: 'true'
      processPaymentWithClosedPM: 'true'
      targetDate: '2017-10-12'
    properties:
      accountId:
        description: 'The ID of the customer account associated with the payment run.


          This field conflicts with each of the `batch`, `billCycleDay`, `currency`, `paymentGatewayId`, and `billingRunId` fields. If there are such conflicts, an error occurs and an error message is returned.

          '
        format: uuid
        type: string
      applyCreditBalance:
        description: '**Note:** This field is only available if you have the Credit Balance feature enabled and the Invoice Settlement feature disabled.


          Whether to apply credit balances in the payment run. This field is only available when you have Invoice Settlement feature disabled.

          '
        type: boolean
      autoApplyCreditMemo:
        description: '**Note:** This field is only available if you have [Invoice Settlement](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Invoice_Settlement) enabled. The Invoice Settlement feature is generally available as of Zuora Billing Release 296 (March 2021). This feature includes Unapplied Payments, Credit and Debit Memo, and Invoice Item Settlement. If you want to enable Invoice Settlement, see [Invoice Settlement Enablement and Checklist Guide](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Invoice_Settlement/Invoice_Settlement_Migration_Checklist_and_Guide) for more information.


          Whether to automatically apply a posted credit memo to one or more receivables in the payment run.

          '
        type: boolean
      autoApplyUnappliedPayment:
        description: '**Note:** This field is only available if you have [Invoice Settlement](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Invoice_Settlement) enabled. The Invoice Settlement feature is generally available as of Zuora Billing Release 296 (March 2021). This feature includes Unapplied Payments, Credit and Debit Memo, and Invoice Item Settlement. If you want to enable Invoice Settlement, see [Invoice Settlement Enablement and Checklist Guide](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Invoice_Settlement/Invoice_Settlement_Migration_Checklist_and_Guide) for more information.


          Whether to automatically apply unapplied payments to  one or more receivables in the payment run.

          '
        type: boolean
      batch:
        description: "The alias name given to a batch. The batch name is a string of 50 characters or less.\n\nThis field conflicts with the `accountId` field. If they are both specified in the request body, an error occurs and an error message is returned. \n\n**Note**: By default, you have 50 configurable account batches. To increase the limit to 200 batches, you must have the <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Performance_Booster_Elite\" target=\"_blank\">Performance Booster Elite</a> package.\n"
        type: string
      billCycleDay:
        description: 'The billing cycle day (BCD), the day of the month when a bill run generates invoices for the account. The value must be equal to or less then 31, and 31 is mean the EOM.


          This field conflicts with the `accountId` field. If they are both specified in the request body, an error occurs and an error message is returned.

          '
        type: string
      billingRunId:
        description: 'The ID of a bill run.


          This field conflicts with the `accountId` field. If they are both specified in the request body, an error occurs and an error message is returned.

          '
        format: uuid
        type: string
      collectPayment:
        description: "Whether to process electronic payments during the execution of payment runs. \n\nIf the Payment user permission \"Process Electronic Payment\" is disabled, this field will be ignored.\n"
        type: boolean
      consolidatedPayment:
        description: "**Note:** The **Process Electronic Payment** permission also needs to be allowed for a Manage Payment Runs role to work. See [Payments Roles](https://knowledgecenter.zuora.com/CF_Users_and_Administrators/A_Administrator_Settings/User_Roles/e_Payments_Roles) for more information. \n\nWhether to process a single payment for all receivables that are due on an account.\n"
        type: boolean
      currency:
        description: 'A currency defined in the web-based UI administrative settings.


          This field conflicts with the `accountId` field. If they are both specified in the request body, an error occurs and an error message is returned.

          '
        type: string
      organizationLabels:
        description: "The organizations that the run is created for. \n\nFor each item in the array, either the `organizationId` or the `organizationName` field is required.\n\nThis field is only required when you have already turned on Multi-Org feature.\n"
        items:
          properties:
            organizationId:
              description: 'The organization ID.

                '
              type: string
            organizationName:
              description: 'The organization name.

                '
              type: string
          type: object
        type: array
      paymentGatewayId:
        description: 'The ID of the gateway instance that processes the payment.


          This field conflicts with the `accountId` field. If they are both specified in the request body, an error occurs and an error message is returned.

          '
        format: uuid
        type: string
      processPaymentWithClosedPM:
        description: "**Note:** The **Process Electronic Payment** permission also needs to be allowed for a Manage Payment Runs role to work. See [Payments Roles](https://knowledgecenter.zuora.com/CF_Users_and_Administrators/A_Administrator_Settings/User_Roles/e_Payments_Roles) for more information. \n\nWhether to process payments even if the default payment method is closed.\n"
        type: boolean
      runDate:
        description: 'The date and time when the scheduled payment run is to be executed, in `yyyy-mm-dd hh:mm:ss` format. The backend will ignore mintues and seconds in the field value. For example, if you specify `2017-03-01 11:30:37` for this value, this payment run will be run at 2017-03-01 11:00:00.

          '
        format: date-time
        type: string
      targetDate:
        description: 'The target date used to determine which receivables to be paid in the payment run. The payments are collected for all receivables with the due date no later than the target date.

          '
        format: date
        type: string
    type: object
  GETPaymentRunSummaryTotalValues:
    properties:
      totalValueOfCreditBalance:
        description: '**Note:** This field is only available if you have the Credit Balance feature enabled.


          The total amount of credit balance after the payment run is completed.

          '
        type: string
      totalValueOfCreditMemos:
        description: '**Note:** This field is only available if you have the Invoice Settlement feature enabled.


          The total amount of credit memos that are successfully processed in the payment run.

          '
        type: string
      totalValueOfDebitMemos:
        description: '**Note:** This field is only available if you have the Invoice Settlement feature enabled.


          The total amount of debit memos that are picked up for processing in the payment run.

          '
        type: string
      totalValueOfErrors:
        description: 'The total amount of receivables associated with the payments with the status of `Error` and `Processing`.

          '
        type: string
      totalValueOfInvoices:
        description: '**Note:** This field is only available if you have the Invoice Settlement feature enabled.


          The total amount of invoices that are picked up for processing in the payment run.

          '
        type: string
      totalValueOfPayments:
        description: 'The total amount of payments that are successfully processed in the payment run.

          '
        type: string
      totalValueOfReceivables:
        description: 'The total amount of receivables associated with the payment run.


          The value of this field is the sum of the value of the `totalValueOfInvoices` field and that of the `totalValueOfDebitMemos` field.

          '
        type: string
      totalValueOfUnappliedPayments:
        description: '**Note:** This field is only available if you have the Invoice Settlement feature enabled.


          The total amount of unapplied payments that are successfully processed in the payment run.

          '
        type: integer
      totalValueOfUnprocessedDebitMemos:
        description: '**Note:** This field is only available if you have the Invoice Settlement feature enabled.


          The total amount of debit memos with remaining positive balances after the payment run is completed.

          '
        type: string
      totalValueOfUnprocessedInvoices:
        description: '**Note:** This field is only available if you have the Invoice Settlement feature enabled.


          The total amount of invoices with remaining positive balances after the payment run is completed.

          '
        type: string
      totalValueOfUnprocessedReceivables:
        description: 'The total amount of receivables with remaining positive balances after the payment run is completed.

          '
        type: string
    title: totalValues
    type: object
  POSTPaymentRunDataElementRequest:
    allOf:
    - properties:
        accountId:
          description: 'A valid account ID associated with the payment run.


            If `consolidatedPayment` is set to `true`, this field is used in processing a single payment for invoices/debit memos due on an account.

            '
          type: string
        accountNumber:
          description: 'The number of the customer account associated with the payment run, such as `A00000001`.


            You can specify either `accountNumber` or `accountId` for a customer account, but not both of them.


            If `consolidatedPayment` is set to `true`, this field is used in processing a single payment for invoices, debit memos, and standalone payments due on an account.

            '
          type: string
        amount:
          description: 'The amount to be collected for the specified invoice/debit memo. `amount` must be a positive numeric value no more than the balance of the specified invoice/debit memo.


            This field is only available when `documentId` is specified. If `amount` is not specified, whole balance of the invoice/debit memo is collected.

            '
          type: number
        comment:
          description: 'Additional comments.

            '
          type: string
        currency:
          description: 'Note: This field is only available if support for standalone payments is enabled.


            The currency of the standalone payment. Specify this field only if the `standalone` field is `true`. The currency of the standalone payment can be different from the payment currency defined in the customer account settings.

            '
          type: string
        dataItems:
          description: "The array of data for each Invoice if you want to collect payment for particular items through one payment method. The grouped items are sent as one data record.\n\nHere is another example for a data item:\n  ```\n  {\n    \"accountId\": \"60c81b5bc51649e8a7d1b48303194790\",\n    \"documentId\": \"2c9081a03c63c94c013c6894af5602dd\",\n    \"documentType\": \"Invoice\",\n    \"dataItems\": [\n      {\n          \"documentItemId\": \"8a92ab0e8ab14c53018ac746961c10d1\",\n          \"amount\": 40\n      },\n      {\n          \"taxItemId\": \"8a92ab0e8ab14c53018ac746961c10d2\",\n          \"amount\": 40\n      }\n  ],\n    \"amount\": 80,\n    \"paymentMethodId\": \"2c9081a03c6d7b51013c6d7e4ada0a1c\",\n    \"paymentGatewayId\": \"d2abe8342e1811ea80e774b9452e17ea\",\n    \"comment\": \"Payment Comments\",\n    \"customField1__c\": \"cf_value1\",\n    \"customField2__c\": \"cf_value2\"\n  },\n  ```\n"
          properties:
            amount:
              description: 'The total amount to be collected for the specified invoice/debit memo item. The sum of the item amount should be equal to document amount.

                '
              type: number
            documentItemId:
              description: 'The ID of a billing document of the invoice item or debit memo item.

                '
              type: string
            taxItemId:
              description: 'The tax ID of the invoice item or debit memo item.

                '
              type: string
          title: dataItems
          type: object
        documentId:
          description: 'The ID of a billing document associated with the payment run. `documentId` must be valid and match with `documentType`.


            You must either specify both `documentId` and `documentType`, or specify neither of them.


            If neither of `documentType` and `documentId` is specified, all invoices/debit memos with open balance of the account are collected.

            '
          type: string
        documentNumber:
          description: 'The number of a billing document associated with the payment run. `documentNumber` must be valid and match with `documentType`.


            You must either specify both `documentNumber` and `documentType`, or specify neither of them.


            If neither of `documentType` and `documentNumber` is specified, all invoices/debit memos with open balance of the account are collected.

            '
          type: string
        documentType:
          description: 'The type of a billing document associated with the payment run. The value can be `Invoice` or `DebitMemo`, but `DebitMemo` is only supported if the Invoice Settlement feature is enabled.


            You must either specify both `documentType` and `documentId`, or specify neither of them.


            If neither of `documentType` and `documentId` is specified, all invoices/debit memos with open balance of the account are collected.

            '
          enum:
          - Invoice
          - DebitMemo
          type: string
        paymentGatewayId:
          description: 'The ID of the payment gateway for collecting invoices/debit memos. The specified payment gateway must be valid and active. If it is not specified, the default payment gateway of the account is used. If no payment gateway is configured for the account, the default payment gateway of the tenant is used.


            If `consolidatedPayment` is set to `true`, this field is used in processing a single payment for invoices/debit memos due on an account.

            '
          type: string
        paymentMethodId:
          description: 'The ID of the payment method for collecting invoices/debit memos. The specified payment method must be a valid non-system payment method. If it is not specified, the default payment method of the account is used regardless of the `autoPay` value of the account.


            If `processPaymentWithClosedPM` is set to `false`, the payment method cannot be closed.


            If the payment retry rules are enabled, the payment method must meet the rules.


            If `consolidatedPayment` is set to `true`, this field is used in processing a single payment for invoices/debit memos due on an account.

            '
          type: string
        standalone:
          default: false
          description: "Note: This field is only available if support for standalone payments is enabled.\n\nSpecify `true` to indicate that this is a standalone payment that will be created and processed in Zuora through Zuora gateway integration but will be settled outside of Zuora. When `standalone` is set to `true`:\n  - `accountId` or `accountNumber` is required.\n  - `amount` is required. \n  - The amount will not be summed up into the account balance and key metrics regardless of the payment currency.\n  - No settlement data will be created.\n  - Either the applied amount or the unapplied amount of the payment is zero.\n  - The standalone payment cannot be applied, unapplied, or transferred.\n"
          type: boolean
      type: object
    - $ref: '#/definitions/PaymentObjectCustomFields'
  GETPaymentRunDataTransactionElementResponse:
    properties:
      amount:
        description: 'The total amount of the newly generated payment.


          **Note:** This field is only available if `type` is `Payment`.

          '
        type: number
      appliedAmount:
        description: 'The amount allocated to this data record.

          '
        type: number
      errorCode:
        description: 'The error code of the response.


          **Note:** This field is only available if `type` is `Payment`.

          '
        type: string
      errorMessage:
        description: 'The detailed information of the error response.


          **Note:** This field is only available if `type` is `Payment`.

          '
        type: string
      id:
        description: 'The ID of the current transaction.

          '
        type: string
      status:
        description: 'The status of the newly generated payment.


          **Note:** This field is only available if `type` is `Payment`.

          '
        enum:
        - Processed
        - Processing
        - Error
        type: string
      type:
        description: 'The type of the current transaction.

          '
        enum:
        - Payment
        - CreditMemo
        - UnappliedPayment
        - CreditBalanceAdjustment
        type: string
    title: payment run transaction
    type: object
  PaymentObjectCustomFields:
    additionalProperties:
      description: 'Custom fields of the Payment object. The name of each custom field has the form <code>*customField*__c</code>. Custom field names are case sensitive. See [Manage Custom Fields](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Manage_Custom_Fields) for more information.

        '
    description: 'Container for custom fields of a Payment object.

      '
    title: paymentFieldsCustom
    type: object
  GETPaymentRunCollectionType:
    properties:
      nextPage:
        description: 'The URL for requesting the next page of the response, if it exists; otherwise absent.

          '
        type: string
      paymentRuns:
        description: 'Container for payment runs.

          '
        items:
          $ref: '#/definitions/GETPaymentRunType'
        type: array
      success:
        description: 'Returns `true` if the request was processed successfully.

          '
        type: boolean
    type: object
  POSTPaymentRunRequest:
    example:
      accountId: 402890245f097f39015f0e9fcdd60558
      autoApplyCreditMemo: 'true'
      autoApplyUnappliedPayment: 'true'
      consolidatedPayment: 'true'
      processPaymentWithClosedPM: 'true'
      targetDate: '2017-10-10'
    properties:
      accountId:
        description: 'The ID of the customer account associated with the payment run.


          This field conflicts with each of the `batch`, `billCycleDay`, `currency`, `paymentGatewayId`, and `billingRunId` fields. If there are such conflicts, an error occurs and an error message is returned.

          '
        format: uuid
        type: string
      applyCreditBalance:
        description: 'If `applyCreditBalance` is true, the credit memo or unapplied payment on the order account will be automatically applied to the invoices generated by this order. The credit memo generated by this order will not be automatically applied to any invoices.

          '
        type: boolean
      autoApplyCreditMemo:
        description: '**Note:** This field is only available if you have [Invoice Settlement](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Invoice_Settlement) enabled. The Invoice Settlement feature is generally available as of Zuora Billing Release 296 (March 2021). This feature includes Unapplied Payments, Credit and Debit Memo, and Invoice Item Settlement. If you want to enable Invoice Settlement, see [Invoice Settlement Enablement and Checklist Guide](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Invoice_Settlement/Invoice_Settlement_Migration_Checklist_and_Guide) for more information.


          Whether to automatically apply a posted credit memo to one or more receivables in the payment run.

          '
        type: boolean
      autoApplyUnappliedPayment:
        description: '**Note:** This field is only available if you have [Invoice Settlement](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Invoice_Settlement) enabled. The Invoice Settlement feature is generally available as of Zuora Billing Release 296 (March 2021). This feature includes Unapplied Payments, Credit and Debit Memo, and Invoice Item Settlement. If you want to enable Invoice Settlement, see [Invoice Settlement Enablement and Checklist Guide](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Invoice_Settlement/Invoice_Settlement_Migration_Checklist_and_Guide) for more information.


          Whether to automatically apply unapplied payments to  one or more receivables in the payment run.

          '
        type: boolean
      batch:
        description: "The alias name given to a batch. The batch name is a string of 50 characters or less.\n\nThis field conflicts with the `accountId` field. If they are both specified in the request body, an error occurs and an error message is returned. \n\n**Note**: By default, you have 50 configurable account batches. To increase the limit to 200 batches, you must have the <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Performance_Booster_Elite\" target=\"_blank\">Performance Booster Elite</a> package.\n"
        type: string
      billCycleDay:
        description: 'The billing cycle day (BCD), the day of the month when a bill run generates invoices for the account. The value must be equal to or less then 31, and 31 is mean the EOM.


          This field conflicts with the `accountId` field. If they are both specified in the request body, an error occurs and an error message is returned.

          '
        type: string
      billingRunId:
        description: 'The ID of a bill run.


          This field conflicts with the `accountId` field. If they are both specified in the request body, an error occurs and an error message is returned.

          '
        format: uuid
        type: string
      collectPayment:
        description: "Whether to process electronic payments during the execution of payment runs. \n\nIf the Payment user permission \"Process Electronic Payment\" is disabled, this field will be ignored.\n"
        type: boolean
      consolidatedPayment:
        description: "**Note:** The **Process Electronic Payment** permission also needs to be allowed for a Manage Payment Runs role to work. See [Payments Roles](https://knowledgecenter.zuora.com/CF_Users_and_Administrators/A_Administrator_Settings/User_Roles/e_Payments_Roles) for more information. \n\nWhether to process a single payment for all receivables that are due on an account.\n"
        type: boolean
      currency:
        description: 'A currency defined in the web-based UI administrative settings.


          This field conflicts with the `accountId` field. If they are both specified in the request body, an error occurs and an error message is returned.

          '
        type: string
      data:
        description: "\nThe array of data for specifying records of accounts and invoices/debit memos that will be collected and processed by a payment run.\n\nWhen you specify the data array, ensure that at least one record is passed in. If an empty array is specified, `accountId`, `batch`, `billCycleDay`, `currency`, `paymentGatewayId`, and `billingRunId` fields will be used to define the billing documents to be collected.\n\nA maximum of 50K records are allowed to be passed into the `data` array.\n\nHere is an example:\n```\n  {\n    \"accountId\": \"60c81b5bc51649e8a7d1b48303194790\",\n    \"documentId\": \"2c9081a03c63c94c013c6894af5602dd\",\n    \"documentType\": \"Invoice\",\n    \"amount\": 80,\n    \"paymentMethodId\": \"2c9081a03c6d7b51013c6d7e4ada0a1c\",\n    \"paymentGatewayId\": \"d2abe8342e1811ea80e774b9452e17ea\",\n    \"comment\": \"Payment Comments\",\n    \"customField1__c\": \"cf_value1\",\n    \"customField2__c\": \"cf_value2\"\n  }\n```\n\nHere is another example for a standalone payment:\n```\n  {\n    \"accountId\": \"account2\",\n    \"amount\": 100,\n    \"currency\": \"GBP\",\n    \"standalone\": true\n  }\n```\n"
        items:
          $ref: '#/definitions/POSTPaymentRunDataElementRequest'
        title: payment run data
        type: array
      organizationLabels:
        description: "The organizations that the run is created for. \n\nFor each item in the array, either the `organizationId` or the `organizationName` field is required.\n\nThis field is only required when you have already turned on Multi-Org feature.\n"
        items:
          properties:
            organizationId:
              description: 'The organization ID.

                '
              type: string
            organizationName:
              description: 'The organization name.

                '
              type: string
          type: object
        type: array
      paymentGatewayId:
        description: 'The ID of the gateway instance that processes the payment.


          This field conflicts with the `accountId` field. If they are both specified in the request body, an error occurs and an error message is returned.

          '
        format: uuid
        type: string
      processPaymentWithClosedPM:
        description: "**Note:** The **Process Electronic Payment** permission also needs to be allowed for a Manage Payment Runs role to work. See [Payments Roles](https://knowledgecenter.zuora.com/CF_Users_and_Administrators/A_Administrator_Settings/User_Roles/e_Payments_Roles) for more information. \n\nWhether to process payments even if the default payment method is closed.\n"
        type: boolean
      runDate:
        description: "The date and time when the scheduled payment run is to be executed, in `yyyy-mm-dd hh:mm:ss` format. The backend will ignore mintues and seconds in the field value. For example, if you specify `2017-03-01 11:30:37` for this value, this payment run will be run at 2017-03-01 11:00:00.\n\nYou must specify either the `runDate` field or the `targetDate` field in the request body. If you specify the `runDate` field, the scheduced payment run is to be executed on the run date. If you specify the `targetDate` field, the payment run is executed immediately after it is created. \n"
        format: date-time
        type: string
      targetDate:
        description: "The target date used to determine which receivables to be paid in the payment run. The payments are collected for all receivables with the due date no later than the target date.\n\nYou must specify either the `runDate` field or the `targetDate` field in the request body. If you specify the `runDate` field, the scheduced payment run is to be executed on the run date. If you specify the `targetDate` field, the payment run is executed immediately after it is created. \n"
        format: date
        type: string
    type: object
  GETPaymentRunType:
    properties:
      accountId:
        description: 'The ID of the customer account associated with the payment run.

          '
        type: string
      applyCreditBalance:
        description: '**Note:** This field is only available if you have the Credit Balance feature enabled and the Invoice Settlement feature disabled.


          Whether to apply credit balances in the payment run. This field is only available when you have Invoice Settlement feature disabled.

          '
        type: boolean
      autoApplyCreditMemo:
        description: '**Note:** This field is only available if you have [Invoice Settlement](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Invoice_Settlement) enabled. The Invoice Settlement feature is generally available as of Zuora Billing Release 296 (March 2021). This feature includes Unapplied Payments, Credit and Debit Memo, and Invoice Item Settlement. If you want to enable Invoice Settlement, see [Invoice Settlement Enablement and Checklist Guide](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Invoice_Settlement/Invoice_Settlement_Migration_Checklist_and_Guide) for more information.


          Whether to automatically apply a posted credit memo to one or more receivables in the payment run.

          '
        type: boolean
      autoApplyUnappliedPayment:
        description: '**Note:** This field is only available if you have [Invoice Settlement](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Invoice_Settlement) enabled. The Invoice Settlement feature is generally available as of Zuora Billing Release 296 (March 2021). This feature includes Unapplied Payments, Credit and Debit Memo, and Invoice Item Settlement. If you want to enable Invoice Settlement, see [Invoice Settlement Enablement and Checklist Guide](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Invoice_Settlement/Invoice_Settlement_Migration_Checklist_and_Guide) for more information.


          Whether to automatically apply unapplied payments to  one or more receivables in the payment run.

          '
        type: boolean
      batch:
        description: 'The alias name given to a batch.

          '
        example: Batch1
        type: string
      billCycleDay:
        description: "The billing cycle day (BCD), the day of the month when a bill run generates invoices for the account. \n"
        example: 1
        type: string
      billingRunId:
        description: 'The ID of the bill run.

          '
        format: uuid
        type: string
      collectPayment:
        description: "Whether to process electronic payments during the execution of payment runs. \n"
        type: boolean
      completedOn:
        description: 'The date and time when the payment run is completed, in `yyyy-mm-dd hh:mm:ss` format. For example, 2017-03-01 11:39:58.

          '
        format: date-time
        type: string
      consolidatedPayment:
        description: "**Note:** The **Process Electronic Payment** permission also needs to be allowed for a Manage Payment Runs role to work. See [Payments Roles](https://knowledgecenter.zuora.com/CF_Users_and_Administrators/A_Administrator_Settings/User_Roles/e_Payments_Roles) for more information. \n\nWhether to process a single payment for all receivables that are due on an account.\n"
        type: boolean
      createdById:
        description: 'The ID of the Zuora user who created the payment run.

          '
        type: string
      createdDate:
        description: 'The date and time when the payment run was created, in `yyyy-mm-dd hh:mm:ss` format. For example, 2017-03-01 15:31:10.

          '
        format: date-time
        type: string
      currency:
        description: 'A currency defined in the web-based UI administrative settings.

          '
        example: USD
        type: string
      executedOn:
        description: 'The date and time when the payment run is executed, in `yyyy-mm-dd hh:mm:ss` format. For example, 2017-03-01 11:30:37.

          '
        format: date-time
        type: string
      id:
        description: 'The ID of the payment run.

          '
        type: string
      number:
        description: 'The identification number of the payment run.

          '
        type: string
      organizationLabels:
        description: "The organization(s) that the object belongs to. \n\nNote: This field is available only when the Multi-Org feature is enabled.\n"
        items:
          properties:
            organizationId:
              description: 'The organization ID.

                '
              type: string
            organizationName:
              description: 'The organization name.

                '
              type: string
          type: object
        type: array
      paymentGatewayId:
        description: 'The ID of the gateway instance that processes the payment.

          '
        format: uuid
        type: string
      processPaymentWithClosedPM:
        description: "**Note:** The **Process Electronic Payment** permission also needs to be allowed for a Manage Payment Runs role to work. See [Payments Roles](https://knowledgecenter.zuora.com/CF_Users_and_Administrators/A_Administrator_Settings/User_Roles/e_Payments_Roles) for more information. \n\nWhether to process payments even if the default payment method is closed.\n"
        type: boolean
      runDate:
        description: 'The date and time when the scheduled payment run is to be executed for collecting payments.

          '
        format: date-time
        type: string
      status:
        description: 'The status of the created payment run.

          '
        enum:
        - Pending
        - Processing
        - Completed
        - Error
        - Canceled
        type: string
      success:
        description: 'Returns `true` if the request was processed successfully.

          '
        type: boolean
      targetDate:
        description: "The target date used to determine which receivables to be collected in the payment run. \n"
        format: date
        type: string
      updatedById:
        description: 'The ID of the Zuora user who last updated the payment run.

          '
        type: string
      updatedDate:
        description: 'The date and time when the payment run was last updated, in `yyyy-mm-dd hh:mm:ss` format. For example, 2017-03-02 15:36:10.

          '
        format: date-time
        type: string
    title: paymentRuns
    type: object
parameters:
  GLOBAL_HEADER_Accept_Encoding:
    name: Accept-Encoding
    in: header
    required: false
    type: string
    description: "Include the `Accept-Encoding: gzip` header to compress responses as a gzipped file. It can significantly reduce the bandwidth required for a response. \n\nIf specified, Zuora automatically compresses responses that contain over 1000 bytes of data, and the response contains a `Content-Encoding` header with the compression algorithm so that your client can decompress it.\n"
  GLOBAL_HEADER_Zuora_Org_Ids:
    name: Zuora-Org-Ids
    in: header
    required: false
    type: string
    description: "Comma separated IDs. If you have <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Multi-Org\" target=\"_blank\">Zuora Multi-Org</a> enabled, \nyou can use this header to specify which orgs to perform the operation in. If you do not have Zuora Multi-Org enabled, you should not set this header.\n\nThe IDs must be a sub-set of the user's accessible orgs. If you specify an org that the user does not have access to, the operation fails.\n\nIf the header is not set, the operation is performed in scope of the user's accessible orgs.\n"
  GLOBAL_HEADER_Idempotency_Key:
    name: Idempotency-Key
    in: header
    required: false
    type: string
    maxLength: 255
    description: "Specify a unique idempotency key if you want to perform an idempotent POST or PATCH request. Do not use this header in other request types. \n\nWith this header specified, the Zuora server can identify subsequent retries of the same request using this value, which prevents the same operation from being performed multiple times by accident. \n"
  GLOBAL_HEADER_Content_Encoding:
    name: Content-Encoding
    in: header
    required: false
    type: string
    description: 'Include the `Content-Encoding: gzip` header to compress a request. With this header specified, you should upload a gzipped file for the request payload instead of sending the JSON payload.

      '
  GLOBAL_HEADER_Zuora_Entity_Ids_Single:
    name: Zuora-Entity-Ids
    in: header
    required: false
    type: string
    description: 'An entity ID. If you have [Zuora Multi-entity](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Multi-entity) enabled and the OAuth token is valid for more than one entity, you must use this header to specify which entity to perform the operation in. If the OAuth token is only valid for a single entity, or you do not have Zuora Multi-entity enabled, you do not need to set this header.

      '
  GLOBAL_HEADER_Zuora_Track_Id:
    name: Zuora-Track-Id
    in: header
    required: false
    type: string
    maxLength: 64
    description: 'A custom identifier for tracing the API call. If you set a value for this header, Zuora returns the same value in the response headers. This header enables you to associate your system process identifiers with Zuora API calls, to assist with troubleshooting in the event of an issue.


      The value of this field must use the US-ASCII character set and must not include any of the following characters: colon (`:`), semicolon (`;`), double quote (`"`), and quote (`''`).

      '
  GLOBAL_REQUEST_pageSize:
    name: pageSize
    in: query
    required: false
    type: integer
    maximum: 40
    default: 20
    description: 'The number of records returned per page in the response.

      '
  GLOBAL_HEADER_Authorization_OAuth_optional:
    name: Authorization
    in: header
    required: false
    type: string
    description: 'The value is in the `Bearer {token}` format where {token} is a valid OAuth token generated by calling [Create an OAuth token](/api-references/api/operation/createToken).

      '
  GLOBAL_REQUEST_page:
    name: page
    in: query
    required: false
    type: integer
    minimum: 1
    default: 1
    description: 'The index number of the page that you want to retrieve. This parameter is dependent on `pageSize`. You must set `pageSize` before specifying `page`. For example, if you set `pageSize` to `20` and `page` to `2`, the 21st to 40th records are returned in the response.

      '
