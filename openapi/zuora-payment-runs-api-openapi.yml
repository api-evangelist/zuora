                updatedDate: '2017-12-28 13:00:00'
                updatedById: 2c92c0f956bc8fcb0156f8eee04b4d54
              nextPage: /payment-runs?page=2
              success: true
          schema:
            $ref: '#/definitions/GETPaymentRunCollectionType'
