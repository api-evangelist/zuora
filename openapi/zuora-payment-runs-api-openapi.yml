                updatedDate: '2017-09-22 12:37:22'
                updatedById: 402881e522cf4f9b0122cf5d82860002
                success: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PUTPaymentRunRequest'
        required: true
    get:
      summary: Retrieve a payment run
      operationId: GET_PaymentRun
