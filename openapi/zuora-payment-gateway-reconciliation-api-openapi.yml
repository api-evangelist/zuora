openapi: 3.2.0
info:
  version: '2023-12-15'
  title: Reference Payment Gateway Reconciliation API
  description: '# Introduction


    Welcome to the REST API reference for the Zuora Billing, Payments, and Central Platform!'
  contact:
    email: docs@zuora.com
servers:
- url: https://rest.zuora.com/
tags:
- name: Payment Gateway Reconciliation
  description: Gateway reconciliation is the process of verifying that the electronic payment and refund transactions processed in Zuora match the transactions reported by the gateway.
paths:
  /v1/gateway-settlement/payments/{payment-key}/settle:
    post:
      summary: Settle a payment
      operationId: POST_SettlePayment
      description: 'If the Asynchronous Payment Statuses feature is not enabled, this API operation sets the Gateway State field of the payment to `Settled` and returns the Payment object as response.


        If the Asynchronous Payment Statuses feature is enabled, for ACH and Bank Transfer payments, this API operation sets the Payment Status field to `Processed` and the Gateway State field to `Settled`.'
      tags:
      - Payment Gateway Reconciliation
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Idempotency_Key'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth_optional'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Org_Ids'
      - name: payment-key
        in: path
        required: true
        description: The payment number starting with "P-" or the unique payment ID.
        schema:
          type: string
      responses:
        '200':
          headers:
            Content-Encoding:
              description: "This header is returned if you specify the `Accept-Encoding: gzip` request header and the response contains over 1000 bytes of data.\n\nNote that only the following MIME types support gzipped responses:\n  - `application/json`\n  - `application/xml`\n  - `text/html`\n  - `text/csv`\n  - `text/plain`\n"
              schema:
                type: string
            RateLimit-Limit:
              description: 'The request limit quota for the time window closest to exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: string
            RateLimit-Remaining:
              description: 'The number of requests remaining in the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            RateLimit-Reset:
              description: 'The number of seconds until the quota resets for the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            Zuora-Request-Id:
              description: 'The Zuora internal identifier of the API call. You cannot control the value of this header.

                '
              schema:
                type: string
                maxLength: 36
                minLength: 36
            Zuora-Track-Id:
              description: 'A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.

                '
              schema:
                type: string
                maxLength: 64
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POSTSettlePaymentResponse'
              example:
                id: 2c90c8e26a6a5271016a8e78ba502e4b
                number: P-00000017
                status: Processed
                type: Electronic
                accountId: 2c90c8e26a6a5271016a6fda7f922c10
                amount: 332
                appliedAmount: 0
                unappliedAmount: 0
                refundAmount: 0
                creditBalanceAmount: 0
                currency: USD
                effectiveDate: '2019-05-06'
                comment: ''
                paymentMethodId: 2c90c8e26a6a5271016a6fdf9b5f2caa
                paymentMethodSnapshotId: 2c90c8e26a6a5271016a8e78ba4a2e4a
                authTransactionId: null
                bankIdentificationNumber: '411111'
                gatewayId: 2c90c8e26a6a5271016a74321ba82ce0
                gatewayOrderId: null
                gatewayResponse: Approved
                gatewayResponseCode: '100'
                gatewayState: Settled
                markedForSubmissionOn: null
                referenceId: '5571684390686343603009'
                secondPaymentReferenceId: '549536'
                softDescriptor: null
                softDescriptorPhone: null
                submittedOn: '2019-05-06 11:47:19'
                settledOn: '2019-04-06 23:00:00'
                cancelledOn: null
                createdDate: '2019-05-06 11:47:17'
                createdById: 402881e522cf4f9b0122cf5d82860002
                updatedDate: '2019-05-06 12:11:05'
                updatedById: 402881e522cf4f9b0122cf5d82860002
                financeInformation: null
                gatewayReconciliationStatus: succeeded
                gatewayReconciliationReason: paid
                payoutId: PAYOUT123
                success: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POSTSettlePaymentRequest'
        required: true
  /v1/gateway-settlement/payments/{payment-key}/reject:
    post:
      summary: Reject a payment
      operationId: POST_RejectPayment
      description: 'If the Asynchronous Payment Statuses feature is not enabled, this API operation sets the Gateway State field of the payment to `FailedToSettle`, creates a refund for the payment amount, and returns the Refund object as response.


        If the Asynchronous Payment Statuses feature is enabled, for ACH and Bank Transfer payments, this API operation sets the Payment Status field to `Error` and the Gateway State field to `FailedToSettle`, and unapply the payment if it is already applied.'
      tags:
      - Payment Gateway Reconciliation
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Idempotency_Key'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth_optional'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Org_Ids'
      - name: payment-key
        in: path
        required: true
        description: The payment number starting with "P-" or the unique payment ID.
        schema:
          type: string
      responses:
        '200':
          headers:
            Content-Encoding:
              description: "This header is returned if you specify the `Accept-Encoding: gzip` request header and the response contains over 1000 bytes of data.\n\nNote that only the following MIME types support gzipped responses:\n  - `application/json`\n  - `application/xml`\n  - `text/html`\n  - `text/csv`\n  - `text/plain`\n"
              schema:
                type: string
            RateLimit-Limit:
              description: 'The request limit quota for the time window closest to exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: string
            RateLimit-Remaining:
              description: 'The number of requests remaining in the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            RateLimit-Reset:
              description: 'The number of seconds until the quota resets for the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            Zuora-Request-Id:
              description: 'The Zuora internal identifier of the API call. You cannot control the value of this header.

                '
              schema:
                type: string
                maxLength: 36
                minLength: 36
            Zuora-Track-Id:
              description: 'A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.

                '
              schema:
                type: string
                maxLength: 64
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POSTRejectPaymentResponse'
              example:
                id: 2c90c8e26a6a5271016a8e8232892e60
                number: R-00000001
                status: Processed
                type: External
                methodType: CreditCard
                accountId: 2c90c8e26a6a5271016a6fda7f922c10
                amount: 121
                refundDate: '2019-05-06'
                comment: null
                paymentMethodId: 2c90c8e26a6a5271016a749380452cfc
                paymentMethodSnapshotId: null
                paymentId: 2c90c8e26a6a5271016a8e80de242e56
                creditMemoId: null
                reasonCode: Payment Rejection
                gatewayId: null
                gatewayResponse: Insufficient funds latest msg 1
                gatewayResponseCode: '0231'
                gatewayState: FailedToSettle
                markedForSubmissionOn: null
                referenceId: '825522036728874689'
                secondRefundReferenceId: '825522036690700110'
                softDescriptor: null
                softDescriptorPhone: null
                submittedOn: null
                settledOn: '2019-05-07 20:56:32'
                cancelledOn: null
                createdDate: '2019-05-06 11:57:38'
                createdById: 402881e522cf4f9b0122cf5d82860002
                updatedDate: '2019-05-06 11:57:38'
                updatedById: 402881e522cf4f9b0122cf5d82860002
                refundTransactionTime: null
                financeInformation: null
                gatewayReconciliationStatus: null
                gatewayReconciliationReason: null
                payoutId: null
                success: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POSTRejectPaymentRequest'
        required: true
  /v1/gateway-settlement/payments/{payment-key}/chargeback:
    post:
      summary: Reverse a payment
      operationId: POST_ReversePayment
      description: 'If the Asynchronous Payment Statuses feature is not enabled, this API operation sets the Gateway State field of the payment to `Settled`, creates a refund for the amount specified in the request, and returns the Refund object as response.


        If the Asynchronous Payment Statuses feature is enabled, for ACH and Bank Transfer payments that are reversed before they are settled, this API operation sets the Payment Status field to `Processed`, sets the Gateway State field of the payment to `Settled`, creates an external refund for the amount specified in the request, and returns the Refund object as response.'
      tags:
      - Payment Gateway Reconciliation
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Idempotency_Key'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth_optional'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Org_Ids'
      - name: payment-key
        in: path
        required: true
        description: The payment number starting with "P-" or the unique payment ID.
        schema:
          type: string
      responses:
        '200':
          headers:
            Content-Encoding:
              description: "This header is returned if you specify the `Accept-Encoding: gzip` request header and the response contains over 1000 bytes of data.\n\nNote that only the following MIME types support gzipped responses:\n  - `application/json`\n  - `application/xml`\n  - `text/html`\n  - `text/csv`\n  - `text/plain`\n"
              schema:
                type: string
            RateLimit-Limit:
              description: 'The request limit quota for the time window closest to exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: string
            RateLimit-Remaining:
              description: 'The number of requests remaining in the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            RateLimit-Reset:
              description: 'The number of seconds until the quota resets for the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            Zuora-Request-Id:
              description: 'The Zuora internal identifier of the API call. You cannot control the value of this header.

                '
              schema:
                type: string
                maxLength: 36
                minLength: 36
            Zuora-Track-Id:
              description: 'A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.

                '
              schema:
                type: string
                maxLength: 64
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POSTReversePaymentResponse'
              example:
                id: 2c90c8e26a6a5271016a8e8232892e60
                number: R-00000001
                status: Processed
                type: External
                methodType: CreditCard
                accountId: 2c90c8e26a6a5271016a6fda7f922c10
                amount: 121
                refundDate: '2019-05-06'
                comment: null
                paymentMethodId: 2c90c8e26a6a5271016a749380452cfc
                paymentMethodSnapshotId: null
                paymentId: 2c90c8e26a6a5271016a8e80de242e56
                creditMemoId: null
                reasonCode: Payment Reversal
                gatewayId: null
                gatewayResponse: Insufficient funds latest msg 1
                gatewayResponseCode: '0231'
                gatewayState: Settled
                markedForSubmissionOn: null
                referenceId: '825522036728874689'
