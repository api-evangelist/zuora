tags:
- name: Payment Gateway Reconciliation
  description: "Gateway reconciliation is the process of verifying that the electronic payment and refund transactions processed in Zuora match the transactions reported by the gateway. \nFor example, if Zuora processed 200 transactions through a gateway, you should see the same number of transactions on the gateway's reconciliation report, sometimes also called the settlement report.\n\nYou can complete the following Gateway Reconciliation tasks through API:\n- [Settle a payment](/api-references/api/operation/POST_SettlePayment/)\n- [Reject a payment](/api-references/api/operation/POST_RejectPayment/)\n- [Reverse a payment](/api-references/api/operation/POST_ReversePayment/)\n- [Reconcile a refund](/api-references/api/operation/POST_ReconcileRefund/)\n"
paths:
  /v1/gateway-settlement/payments/{payment-key}/settle:
    post:
      summary: Settle a payment
      operationId: POST_SettlePayment
      description: 'If the <a href="https://knowledgecenter.zuora.com/Zuora_Payments/Payment_Operations/DA_Electronic_Payment_Processing#Asynchronous_payment_flow" target="_blank">Asynchronous Payment Statuses</a> feature is not enabled, this API operation sets the Gateway State field of the payment to `Settled` and returns the Payment object as response.


        If the Asynchronous Payment Statuses feature is enabled, for ACH and Bank Transfer payments, this API operation sets the Payment Status field to `Processed` and the Gateway State field to `Settled`.

        '
      tags:
      - Payment Gateway Reconciliation
      parameters:
      - $ref: '#/parameters/GLOBAL_HEADER_Idempotency_Key'
      - $ref: '#/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/parameters/GLOBAL_HEADER_Content_Encoding'
