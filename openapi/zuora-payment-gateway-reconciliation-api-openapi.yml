            schema:
              $ref: '#/components/schemas/POSTReconcileRefundRequest'
        required: true
components:
  schemas:
    POSTReversePaymentRequest:
      example:
        amount: 100
        gatewayReconciliationReason: insufficient_funds
        gatewayReconciliationStatus: payment_failed
        gatewayResponse: Insufficient funds
        gatewayResponseCode: '023'
        payoutId: PAYOUT123
        referenceId: '825522036728874689'
        secondReferenceId: '825522036690700110'
        settledOn: '2019-05-07 20:56:32.981'
      properties:
        amount:
          description: "The amount that needs to be reversed (chargeback). It cannot be greater than the total Payment amount. \n"
          type: number
        gatewayReconciliationReason:
          description: 'The reason of gateway reconciliation.

            '
          type: string
        gatewayReconciliationStatus:
          description: 'The status of gateway reconciliation.

            '
          type: string
        gatewayResponse:
          description: 'The transaction response returned by the gateway for this transaction. If the transaction was declined, this reason is provided in the message.

            '
          type: string
        gatewayResponseCode:
          description: 'Response message Code returned by the gateway about the transaction status.

            '
          type: string
        payoutId:
          description: 'The payout ID from the gateway side.

            '
          type: string
        referenceId:
          description: "Unique Id generated by the gateway for each transaction. Use this ID to find the respective Zuora Payment ID. \n"
          maxLength: 100
          type: string
        secondReferenceId:
          description: 'The second reference Id. Some gateways use two unique transaction IDs.

            '
          maxLength: 100
          type: string
        settledOn:
          description: 'The date and time of the transaction settlement. The format is `yyyy-mm-dd hh:mm:ss`.

            '
          format: date-time
          type: string
      required:
      - amount
      type: object
    POSTReconcileRefundRequest:
      example:
        action: settle
        actionDate: '2020-10-25 11:11:11'
        gatewayReconciliationReason: refund_paid
        gatewayReconciliationStatus: paid
        payoutId: PAYOUT123
      properties:
        action:
          description: "The action of the refund reconciliation.\n  - `settle`: Sets Gateway State to \"Settled\" and returns the refund object as response.\n  - `reject`: Sets Gateway State to \"FailedToSettle\" and handle the event according to the settings configured in the Gateway Reconciliation Configuration in Payments Settings through Zuora UI. See [Configure how to handle refund rejected events](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/M_Payment_Gateways/Gateway_Reconciliation#Configure_how_to_handle_refund_rejected_events) for details.\n"
          enum:
          - settle
          - reject
          type: string
        actionDate:
          description: 'The date and time of the refund reconciliation action, in `yyyy-mm-dd hh:mm:ss` format.

            '
          format: datetime
          type: string
        gatewayReconciliationReason:
          description: 'The reason of gateway reconciliation.

            '
          type: string
        gatewayReconciliationStatus:
          description: 'The status of gateway reconciliation.

            '
          type: string
        payoutId:
          description: 'The payout ID of the refund from the gateway side.

            '
          type: string
      type: object
    POSTSettlePaymentRequest:
      example:
        gatewayReconciliationReason: paid
        gatewayReconciliationStatus: succeeded
        payoutId: PAYOUT123
        settledOn: '2019-05-07 20:56:32.981'
      properties:
        gatewayReconciliationReason:
          description: 'The reason of gateway reconciliation.

            '
          type: string
        gatewayReconciliationStatus:
          description: 'The status of gateway reconciliation.

            '
          type: string
        payoutId:
          description: 'The payout ID from the gateway side.

            '
          type: string
        settledOn:
          description: 'The date and time of the transaction settlement. The format is `yyyy-mm-dd hh:mm:ss`.

            '
          format: date-time
          type: string
      type: object
    POSTSettlePaymentResponse:
      properties:
        accountId:
          description: 'The ID of the customer account that the payment is for.

            '
          type: string
        amount:
          description: 'The total amount of the payment.

            '
          format: double
          type: number
        appliedAmount:
          description: 'The applied amount of the payment.

            '
          format: double
          type: number
        authTransactionId:
          description: 'The authorization transaction ID from the payment gateway.

            '
          type: string
        bankIdentificationNumber:
          description: 'The first six or eight digits of the credit card or debit card used for the payment, when applicable.

            '
          type: string
        cancelledOn:
          description: 'The date and time when the payment was cancelled, in `yyyy-mm-dd hh:mm:ss` format.

            '
          format: date-time
          type: string
        comment:
          description: 'Comments about the payment.

            '
          type: string
        createdById:
          description: 'The ID of the Zuora user who created the refund.

            '
          type: string
        createdDate:
          description: 'The date and time when the chargeback is created, in `yyyy-mm-dd hh:mm:ss` format. For example, 2019-03-01 15:31:10.

            '
          format: date-time
          type: string
        creditBalanceAmount:
          description: 'The amount that the payment transfers to the credit balance. The value is not `0` only for those payments that come from legacy payment operations performed without the Invoice Settlement feature.

            '
          format: double
          type: number
        currency:
          description: 'A currency defined in the web-based UI administrative settings.

            '
          type: string
        effectiveDate:
          description: 'The date and time when the payment takes effect, in `yyyy-mm-dd hh:mm:ss` format.

            '
          format: date-time
          type: string
        financeInformation:
          description: 'Container for the finance information related to the refund.

            '
          properties:
            bankAccountAccountingCode:
              description: 'The accounting code that maps to a bank account in your accounting system.

                '
              maxLength: 100
              minLength: 0
              type: string
            bankAccountAccountingCodeType:
              description: "The type of the accounting code that maps to a bank account in your accounting system.\n  \n"
              type: string
            transferredToAccounting:
              description: "Whether the refund was transferred to an external accounting system. Use this field for integration with accounting systems, such as NetSuite. \n"
              enum:
              - Processing
              - 'Yes'
              - 'No'
              - Error
              - Ignore
              type: string
            unappliedPaymentAccountingCode:
              description: 'The accounting code for the unapplied payment.

                '
              maxLength: 100
              minLength: 0
              type: string
            unappliedPaymentAccountingCodeType:
              description: "The type of the accounting code for the unapplied payment.\n  \n"
              type: string
          type: object
        gatewayId:
          description: 'The ID of the gateway instance that processes the payment.

            '
          type: string
        gatewayOrderId:
          description: 'A merchant-specified natural key value that can be passed to the electronic payment gateway when a payment is created. If not specified, the payment number will be passed in instead.

            '
          type: string
        gatewayReconciliationReason:
          description: 'The reason of gateway reconciliation.

            '
          type: string
        gatewayReconciliationStatus:
          description: 'The status of gateway reconciliation.

            '
          type: string
        gatewayResponse:
          description: 'The message returned from the payment gateway for the payment. This message is gateway-dependent.

            '
          type: string
        gatewayResponseCode:
          description: 'The code returned from the payment gateway for the payment. This code is gateway-dependent.

            '
          type: string
        gatewayState:
          description: 'The status of the payment in the gateway; specifically used for reconciliation.

            '
          enum:
          - Submitted
          - NotSubmitted
          - Settled
          - FailedToSettle
          type: string
        id:
          description: 'The ID of the payment chargeback.

            '
          type: string
        markedForSubmissionOn:
          description: 'The date and time when a charge was marked and waiting for batch submission to the payment process, in `yyyy-mm-dd hh:mm:ss` format.

            '
          format: date-time
          type: string
        number:
          description: 'The unique identification number of the payment. For example, P-00000001.

            '
          type: string
        organizationLabel:
          description: 'The organization that this object belongs to.


            Note: This field is available only when the Multi-Org feature is enabled.

