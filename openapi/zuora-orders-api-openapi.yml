            '
          maxLength: 255
          type: string
        address2:
          description: 'Second line of the contact''s address.

            '
          maxLength: 255
          type: string
        city:
          description: 'City of the contact''s address.

            '
          maxLength: 40
          type: string
        contactDescription:
          description: 'A description for the contact.

            '
          maxLength: 100
