      - orderActions:
        - createSubscription:
            subscribeToRatePlans:
            - productRatePlanId: efbff07e6290dfb80162910024c80dd5
            subscriptionNumber: SM-00003
            terms:
              autoRenew: true
              initialTerm:
                period: 12
                periodType: Month
                startDate: '2017-01-01'
                termType: TERMED
              renewalSetting: RENEW_WITH_SPECIFIC_TERM
              renewalTerms:
              - period: 12
