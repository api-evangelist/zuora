  OrderLineItemRetrieveOrder:
    allOf:
    - properties:
        amendedByOrderOn:
          description: 'The date when the rate plan charge is amended through an order or amendment. This field is to standardize the booking date information to increase audit ability and traceability of data between Zuora Billing and Zuora Revenue. It is mapped as the booking date for a sale order line in Zuora Revenue.

            '
          type: string
        amount:
          description: 'The calculated gross amount for the Order Line Item.

            '
          type: number
        amountWithoutTax:
          description: 'The calculated gross amount for an order line item excluding tax. If the tax mode is tax exclusive, the value of this field equals that of the `amount` field.


            If the tax mode of an order line item is not set, the system treats it as tax exclusive by default. The value of the `amountWithoutTax` field equals that of the `amount` field.


            If you create an order line item from the product catalog, the tax mode and tax code of the product rate plan charge are used for the order line item by default. You can still overwrite this default set-up by setting the tax mode and tax code of the order line item.

            '
          type: number
        id:
          description: 'The sytem generated Id for the Order Line Item.

            '
          format: UUID
          type: string
        itemNumber:
          description: 'The number for the Order Line Item.

            '
          type: string
        originalOrderDate:
          description: 'The date when the rate plan charge is created through an order or amendment. This field is to standardize the booking date information to increase audit ability and traceability of data between Zuora Billing and Zuora Revenue. It is mapped as the booking date for a sale order line in Zuora Revenue.

            '
          format: date
          type: string
        quantityFulfilled:
          description: 'The quantity that has been fulfilled by fulfillments for the order line item. This field will be updated automatically when related fulfillments become ''SentToBilling'' or ''Complete'' state.

            '
          type: number
        quantityPendingFulfillment:
          description: 'The quantity that''s need to be fulfilled by fulfillments for the order line item. This field will be updated automatically when related fulfillments become ''SentToBilling'' or ''Complete'' state.

            '
          type: number
      type: object
    - $ref: '#/definitions/OrderLineItemCommonRetrieveOrder'
  CreateOrderTermsAndConditions:
    description: 'Information about an order action of type `TermsAndConditions`.

      '
    properties:
      autoRenew:
        type: boolean
      billToContactId:
        description: "The ID of the bill-to contact associated with the subscription.\n\n**Note**: \n  - If you have the <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Bill_your_customers/Bill_customers_at_subscription_level/Flexible_Billing_Attributes\" target=\"_blank\">Flexible Billing Attributes</a> feature disabled, this field is unavailable in the request body and the value of this field is `null` in the response body. \n  - If you have the Flexible Billing Attributes feature enabled, and you do not specify this field in the request or you select **Default Contact from Account** for this field during subscription creation, the value of this field is automatically set to `null` in the response body.\n"
        type: string
      clearingExistingBillToContact:
        default: false
        description: 'Whether to clear the existing bill-to contact ID at the subscription level. This field is mutually exclusive with the `billToContactId` field.


          **Note**: If you have the [Flexible Billing Attributes](https://knowledgecenter.zuora.com/Billing/Subscriptions/Flexible_Billing_Attributes) feature disabled, this field is unavailable in the request body and the value of this field is `null` in the response body.

          '
        type: boolean
      clearingExistingInvoiceTemplate:
        default: false
        description: 'Whether to clear the existing invoice template ID at the subscription level. This field is mutually exclusive with the `invoiceTemplateId` field.


          **Note**: If you have the [Flexible Billing Attributes](https://knowledgecenter.zuora.com/Billing/Subscriptions/Flexible_Billing_Attributes) feature disabled, this field is unavailable in the request body and the value of this field is `null` in the response body.

          '
        type: boolean
      clearingExistingPaymentTerm:
        default: false
        description: 'Whether to clear the existing payment term at the subscription level. This field is mutually exclusive with the `paymentTerm` field.


          **Note**: If you have the [Flexible Billing Attributes](https://knowledgecenter.zuora.com/Billing/Subscriptions/Flexible_Billing_Attributes) feature disabled, this field is unavailable in the request body and the value of this field is `null` in the response body.

          '
        type: boolean
      clearingExistingSequenceSet:
        default: false
        description: 'Whether to clear the existing sequence set ID at the subscription level. This field is mutually exclusive with the `sequenceSetId` field.


          **Note**: If you have the [Flexible Billing Attributes](https://knowledgecenter.zuora.com/Billing/Subscriptions/Flexible_Billing_Attributes) feature disabled, this field is unavailable in the request body and the value of this field is `null` in the response body.

          '
        type: boolean
      clearingExistingSoldToContact:
        default: false
        description: 'Whether to clear the existing sold-to contact ID at the subscription level. This field is mutually exclusive with the `soldToContactId` field.


          **Note**: If you have the [Flexible Billing Attributes](https://knowledgecenter.zuora.com/Billing/Subscriptions/Flexible_Billing_Attributes) feature disabled, this field is unavailable in the request body and the value of this field is `null` in the response body.

          '
        type: boolean
      invoiceTemplateId:
        description: "The ID of the invoice template associated with the subscription.\n\n**Note**: \n  - If you have the <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Bill_your_customers/Bill_customers_at_subscription_level/Flexible_Billing_Attributes\" target=\"_blank\">Flexible Billing Attributes</a> feature disabled, this field is unavailable in the request body and the value of this field is `null` in the response body. \n  - If you have the Flexible Billing Attributes feature enabled, and you do not specify this field in the request or you select **Default Template from Account** for this field during subscription creation, the value of this field is automatically set to `null` in the response body.\n"
        type: string
      lastTerm:
        $ref: '#/definitions/LastTerm'
      paymentTerm:
        description: "The name of the payment term associated with the subscription. For example, `Net 30`. The payment term determines the due dates of invoices.\n\n**Note**: \n  - If you have the <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Bill_your_customers/Bill_customers_at_subscription_level/Flexible_Billing_Attributes\" target=\"_blank\">Flexible Billing Attributes</a> feature disabled, this field is unavailable in the request body and the value of this field is `null` in the response body. \n  - If you have the Flexible Billing Attributes feature enabled, and you do not specify this field in the request or you select **Default Term from Account** for this field during subscription creation, the value of this field is automatically set to `null` in the response body.\n"
        type: string
      renewalSetting:
        enum:
        - RENEW_WITH_SPECIFIC_TERM
        - RENEW_TO_EVERGREEN
        type: string
      renewalTerms:
        items:
          $ref: '#/definitions/RenewalTerm'
        type: array
      sequenceSetId:
        description: "The ID of the sequence set associated with the subscription.\n\n**Note**: \n  - If you have the <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Bill_your_customers/Bill_customers_at_subscription_level/Flexible_Billing_Attributes\" target=\"_blank\">Flexible Billing Attributes</a> feature disabled, this field is unavailable in the request body and the value of this field is `null` in the response body. \n  - If you have the Flexible Billing Attributes feature enabled, and you do not specify this field in the request or you select **Default Set from Account** for this field during subscription creation, the value of this field is automatically set to `null` in the response body.\n"
        type: string
      soldToContactId:
        description: "The ID of the sold-to contact associated with the subscription.\n\n**Note**: \n  - If you have the <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Bill_your_customers/Bill_customers_at_subscription_level/Flexible_Billing_Attributes\" target=\"_blank\">Flexible Billing Attributes</a> feature disabled, this field is unavailable in the request body and the value of this field is `null` in the response body. \n  - If you have the Flexible Billing Attributes feature enabled, and you do not specify this field in the request or you select **Default Contact from Account** for this field during subscription creation, the value of this field is automatically set to `null` in the response body.\n"
        type: string
    title: termsAndConditions
    type: object
  PreviewOrderChargeOverride:
    description: 'Charge associated with a rate plan.

      '
    properties:
      accountReceivableAccountingCode:
        description: 'The accountReceivableAccountingCode of a standalone charge.


          **Note:** This field is available when the <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Manage_subscription_transactions/Orders/Standalone_Orders/AA_Overview_of_Standalone_Orders" target="_blank">Standalone Orders</a>, <a href="https://knowledgecenter.zuora.com/Zuora_Payments/Zuora_Finance" target="_blank">Zuora Finance</a>, and <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Bill_your_customers/Adjust_invoice_amounts/Invoice_Settlement/Get_started_with_Invoice_Settlement/AA_Overview_of_Invoice_Settlement" target="_blank">Invoice Settlement</a> features are enabled.

