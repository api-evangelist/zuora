- name: Orders
  description: "Orders are contractual agreements between merchants and customers. \n\nFor more information about Orders, see <a href=\"https://knowledgecenter.zuora.com/Billing/Subscriptions/Orders\" target=\"_blank\">Orders</a>.\n"
paths:
  /v1/orders/preview:
    post:
      summary: Preview an order
      operationId: POST_PreviewOrder
      description: "**Notes**:\n  - This operation is only available if you have the [Orders](https://knowledgecenter.zuora.com/BC_Subscription_Management/Orders/AA_Overview_of_Orders#Orders) feature enabled. If you are an existing Zuora <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Subscriptions/Subscriptions/Subscribe_and_Amend\" target=\"_blank\">Subscribe and Amend</a> customer, we recommend you enable <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Subscriptions/Subscriptions/Orders_Harmonization/A_Overview_of_Orders_Harmonization\" target=\"_blank\">Orders Harmonization</a> to access the <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Subscriptions/Subscriptions/Orders/AA_Overview_of_Orders/A_Overview_of_Orders\" target=\"_blank\">Orders</a> feature. With Orders, you can access both existing functions for subscription and billing management and the <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Subscriptions/Subscriptions/Orders_Harmonization/P_FAQ_about_Orders_Harmonization#New+features+through+Orders\" target=\"_blank\">new features</a> on Zuora Billing.\n  - The [Order Line Items](https://knowledgecenter.zuora.com/Billing/Subscriptions/Orders/Order_Line_Items/AA_Overview_of_Order_Line_Items) feature is now generally available to all Zuora customers. You need to enable the [Orders](https://knowledgecenter.zuora.com/BC_Subscription_Management/Orders/AA_Overview_of_Orders#Orders) feature to access the [Order Line Items](https://knowledgecenter.zuora.com/Billing/Subscriptions/Orders/Order_Line_Items/AA_Overview_of_Order_Line_Items) feature. As of Zuora Billing Release 313 (November 2021), new customers who onboard on [Orders](https://knowledgecenter.zuora.com/Billing/Subscriptions/Orders/AA_Overview_of_Orders) will have the [Order Line Items](https://knowledgecenter.zuora.com/Billing/Subscriptions/Orders/Order_Line_Items) feature enabled by default. \n  - You cannot preview offers through this operation.\n  - You cannot preview enhanced discounts.      \n\nRetrieves the preview of the charge metrics and invoice items of a specified order. Preview for subscriptions and order line items are both supported. This operation is only an order preview and no order is created.  \n\nYou can also use this operation to preview billing for a standalone order. For more information, see <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Manage_subscription_transactions/Orders/Standalone_Orders/Preview_billing_for_a_standalone_order\" target=\"_blank\">Preview billing for a standalone order</a>. The <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Manage_subscription_transactions/Orders/Standalone_Orders/AA_Overview_of_Standalone_Orders\" target=\"_blank\">Standalone Orders</a> feature is in the **Early Adopter** phase. We are actively soliciting feedback from a small set of early adopters before releasing it as generally available. If you want to join this early adopter program, submit a request at [Zuora Global Support](https://support.zuora.com).\n\n#### Billing preview behavior regarding draft invoices\nBy default, the billing preview behavior regarding draft invoices is as below:\n* When you preview billing for your order and the order contains subscriptions only, the draft invoices are excluded.\n* When you preview billing for your order and the order contains order line items only, the draft invoices are included.\n* When you preview billing for an order that contains both subscriptions  order line items, the draft invoices are included for both subscriptions and order line items.\n\nHowever, if you want to always exclude the draft invoices in billing preview, submit a request at [Zuora Global Support](https://support.zuora.com).\n\n#### Limits on Orders API\nThe limit of orders allowed on a subscription is 1000.\n\nThe limit of order line items allowed in an order is 100.\n\nZuora has the following limits on the Orders synchronous API to prevent performance degradation: \n* Up to 50 subscriptions are allowed in a single [Create an order](/api-references/api/operation/POST_Order) or [Preview an order](/api-references/api/operation/POST_PreviewOrder) operation call.\n* Up to 50 order actions are allowed in a single [Create an order](/api-references/api/operation/POST_Order) or [Preview an order](/api-references/api/operation/POST_PreviewOrder) operation call.\n* Up to 50 order actions are allowed on a single subscription in a [Create an order](/api-references/api/operation/POST_Order) or [Preview an order](/api-references/api/operation/POST_PreviewOrder) operation call.\n\nIf you have an Order that exceeds any limits of the above, Zuora recommends you use the following asynchronous API operations:\n* [Create an order asynchronously](/api-references/api/operation/POST_CreateOrderAsynchronously)\n* [Preview an order asynchronously](/api-references/api/operation/POST_PreviewOrderAsynchronously)\n* [Retrieve the status and response of a job](/v1-api-reference/api/orders/get_jobstatusandresponse) for checking the status of the asynchronous API operations\n\nZuora has the following limits on the Orders asynchronous API operations to prevent performance degradation:\n* Up to 300 subscriptions are allowed in a single [Create an order asynchronously](/api-references/api/operation/POST_CreateOrderAsynchronously) or [Preview an order asynchronously](/api-references/api/operation/POST_PreviewOrderAsynchronously) operation call.\n* Up to 300 order actions are allowed in a single [Create an order asynchronously](/api-references/api/operation/POST_CreateOrderAsynchronously) or [Preview an order asynchronously](/api-references/api/operation/POST_PreviewOrderAsynchronously) operation call.\n* Up to 300 order actions are allowed on a single subscription in a [Create an order asynchronously](/api-references/api/operation/POST_CreateOrderAsynchronously) or [Preview an order asynchronously](/api-references/api/operation/POST_PreviewOrderAsynchronously) operation call.\n"
