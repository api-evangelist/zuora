          '
        type: string
      contractAssetAccountingCode:
        description: 'The contractAssetAccountingCode of a standalone charge.


          **Note:** This field is available when the <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Manage_subscription_transactions/Orders/Standalone_Orders/AA_Overview_of_Standalone_Orders" target="_blank">Standalone Orders</a> feature and the <a href="https://knowledgecenter.zuora.com/Zuora_Revenue/Zuora_Billing_-_Revenue_Integration" target="_blank">Billing - Revenue Integration</a> or <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Enable_Order_to_Revenue/Order_to_Revenue_introduction/AA_Overview_of_Order_to_Revenue" target="_blank">Order to Revenue</a> feature are enabled.

          '
        type: string
      contractLiabilityAccountingCode:
        description: 'The contractLiabilityAccountingCode of a standalone charge.


          **Note:** This field is available when the <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Manage_subscription_transactions/Orders/Standalone_Orders/AA_Overview_of_Standalone_Orders" target="_blank">Standalone Orders</a> feature and the <a href="https://knowledgecenter.zuora.com/Zuora_Revenue/Zuora_Billing_-_Revenue_Integration" target="_blank">Billing - Revenue Integration</a> or <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Enable_Order_to_Revenue/Order_to_Revenue_introduction/AA_Overview_of_Order_to_Revenue" target="_blank">Order to Revenue</a> feature are enabled.

          '
        type: string
      contractRecognizedRevenueAccountingCode:
        description: 'The contractRecognizedRevenueAccountingCode of a standalone charge.


          **Note:** This field is available when the <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Manage_subscription_transactions/Orders/Standalone_Orders/AA_Overview_of_Standalone_Orders" target="_blank">Standalone Orders</a> feature and the <a href="https://knowledgecenter.zuora.com/Zuora_Revenue/Zuora_Billing_-_Revenue_Integration" target="_blank">Billing - Revenue Integration</a> or <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Enable_Order_to_Revenue/Order_to_Revenue_introduction/AA_Overview_of_Order_to_Revenue" target="_blank">Order to Revenue</a> feature are enabled.

          '
        type: string
      customFields:
        $ref: '#/definitions/RatePlanChargeObjectCustomFields'
      deferredRevenueAccountingCode:
        description: 'The deferredRevenueAccountingCode of a standalone charge.


          **Note:** This field is available when the <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Manage_subscription_transactions/Orders/Standalone_Orders/AA_Overview_of_Standalone_Orders" target="_blank">Standalone Orders</a> and <a href="https://knowledgecenter.zuora.com/Zuora_Payments/Zuora_Finance" target="_blank">Zuora Finance</a> features are enabled.

          '
        type: string
      description:
        description: 'Description of the charge.

          '
        maxLength: 500
        type: string
      drawdownRate:
        description: '**Note**: This field is only available if you have the [Prepaid with Drawdown](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/J_Billing_Operations/Prepaid_with_Drawdown) feature enabled.


          The [conversion rate](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/J_Billing_Operations/Prepaid_with_Drawdown/Create_drawdown_charge#UOM_Conversion) between Usage UOM and Drawdown UOM for a [drawdown charge](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/J_Billing_Operations/Prepaid_with_Drawdown/Create_drawdown_charge). Must be a positive number (>0).

          '
        type: number
      endDate:
        $ref: '#/definitions/EndConditions'
      excludeItemBillingFromRevenueAccounting:
        default: false
        description: "The flag to exclude rate plan charge related invoice items, invoice item adjustments, credit memo items, and debit memo items from revenue accounting.\n\nIf both the following features in <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Bill_your_customers/Bill_for_usage_or_prepaid_products/Advanced_Consumption_Billing\" target=\"_blank\">Advanced Consumption Billing</a> are enabled in your tenant, you must ensure the `excludeItemBillingFromRevenueAccounting` field is set consistently for a prepayment charge and the corresponding drawdown charge. In addition, if the `excludeItemBookingFromRevenueAccounting` field in a Create Subscription or Add Product order action is set to `false`, you must also set the `excludeItemBillingFromRevenueAccounting` field in this order action to `false`.\n  * Prepaid with Drawdown\n  * Unbilled Usage\n\n**Note**: This field is only available if you have the <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Enable_Order_to_Revenue\" target=\"_blank\">Order to Revenue</a> or [Zuora Billing - Revenue Integration](https://knowledgecenter.zuora.com/Zuora_Revenue/Zuora_Billing_-_Revenue_Integration) feature enabled.\n"
        type: boolean
      excludeItemBookingFromRevenueAccounting:
        default: false
        description: "The flag to exclude rate plan charges from revenue accounting.\n\nIf both the following features in <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Bill_your_customers/Bill_for_usage_or_prepaid_products/Advanced_Consumption_Billing\" target=\"_blank\">Advanced Consumption Billing</a> are enabled in your tenant, you must ensure the `excludeItemBookingFromRevenueAccounting` field is set consistently for a prepayment charge and the corresponding drawdown charge.\n  * Prepaid with Drawdown\n  * Unbilled Usage\n\n**Note**: This field is only available if you have the <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Enable_Order_to_Revenue\" target=\"_blank\">Order to Revenue</a> or [Zuora Billing - Revenue Integration](https://knowledgecenter.zuora.com/Zuora_Revenue/Zuora_Billing_-_Revenue_Integration) feature enabled.\n"
        type: boolean
      isAllocationEligible:
        description: 'This field is used to identify if the charge segment is allocation eligible in revenue recognition.


          **Note**: This feature is in the **Early Adopter** phase. If you want to use the feature, submit a request at <a href="https://support.zuora.com/" target="_blank">Zuora Global Support</a>, and we will evaluate whether the feature is suitable for your use cases.

          '
        type: boolean
      isRollover:
        description: '**Note**: This field is only available if you have the [Prepaid with Drawdown](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/J_Billing_Operations/Prepaid_with_Drawdown) feature enabled.


          The value is either "True" or "False". It determines whether the rollover fields are needed.

          '
        type: boolean
      isUnbilled:
        description: 'This field is used to dictate how to perform the accounting during revenue recognition.


          **Note**: This feature is in the **Early Adopter** phase. If you want to use the feature, submit a request at <a href="https://support.zuora.com/" target="_blank">Zuora Global Support</a>, and we will evaluate whether the feature is suitable for your use cases.

          '
        type: boolean
      name:
        description: 'The name of a standalone charge.


          **Note:** This field is available when the <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Manage_subscription_transactions/Orders/Standalone_Orders/AA_Overview_of_Standalone_Orders" target="_blank">Standalone Orders</a> feature is enabled.

