openapi: 3.2.0
info:
  version: '2023-12-15'
  title: Reference Invoice Schedules API
  description: '# Introduction


    Welcome to the REST API reference for the Zuora Billing, Payments, and Central Platform!'
  contact:
    email: docs@zuora.com
servers:
- url: https://rest.zuora.com/
tags:
- name: Invoice Schedules
  description: 'Use invoice schedules to trigger invoice generation processes.


    For more information about invoice schedules, see Billing Schedule overview.'
paths:
  /v1/invoice-schedules:
    post:
      tags:
      - Invoice Schedules
      summary: Create an invoice schedule
      description: 'Creates an invoice schedule.


        ### Limitations


        This API operation has the following limitations:

        * You can create at most 50 invoice schedule items in one request.

        * You can associate at most 10 orders with an invoice schedule in one request.

        * You can associate at most 300 subscriptions with an invoice schedule in one request, including those contained in orders and separate subscriptions.'
      operationId: POST_CreateInvoiceSchedule
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Idempotency_Key'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth_optional'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Org_Ids'
      responses:
        '200':
          description: ''
          headers:
            Content-Encoding:
              description: "This header is returned if you specify the `Accept-Encoding: gzip` request header and the response contains over 1000 bytes of data.\n\nNote that only the following MIME types support gzipped responses:\n  - `application/json`\n  - `application/xml`\n  - `text/html`\n  - `text/csv`\n  - `text/plain`\n"
              schema:
                type: string
            RateLimit-Limit:
              description: 'The request limit quota for the time window closest to exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: string
            RateLimit-Remaining:
              description: 'The number of requests remaining in the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            RateLimit-Reset:
              description: 'The number of seconds until the quota resets for the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            Zuora-Request-Id:
              description: 'The Zuora internal identifier of the API call. You cannot control the value of this header.

                '
              schema:
                type: string
                maxLength: 36
                minLength: 36
            Zuora-Track-Id:
              description: 'A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.

                '
              schema:
                type: string
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceScheduleResponses'
              example:
                id: e2441b3e24eb42859194be7da2403b38
                number: IS-00000004
                status: Pending
                nextRunDate: '2022-02-24'
                totalAmount: 70200.0
                actualAmount: 70200.0
                billedAmount: 0.0
                unbilledAmount: 70200.0
                notes: 2022 Billing Schedule
                currency: USD
                scheduleItems:
                - id: 8a8881aa82118bec018211daf9f01680
                  amount: 50000.0
                  actualAmount: 50000.0
                  status: Pending
                  runDate: '2022-02-24'
                  targetDateForAdditionalSubscriptions: '2022-02-24'
                  percentage: null
                - id: 8a8881aa82118bec018211daf9f11681
                  amount: 14000.0
                  status: Pending
                  actualAmount: 14000.0
                  runDate: '2022-10-17'
                  targetDateForAdditionalSubscriptions: '2022-10-17'
                  percentage: null
                - id: 8a8881aa82118bec018211daf9f11682
                  amount: 6200.0
                  actualAmount: 6200.0
