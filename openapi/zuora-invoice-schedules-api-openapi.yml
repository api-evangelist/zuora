  /v1/invoice-schedules/{scheduleKey}/pause:
    put:
      tags:
      - Invoice Schedules
      summary: Pause an invoice schedule
      description: 'Pauses an invoice schedule immediately.


        After one invoice schedule is paused, it cannot be automatically executed by Zuora Scheduler or by the Execute an invoice schedule API operation.


        If you want to run a paused invoice schedule, you can create a bill run with the target date greater than the next run date of the invoice schedule.'
      operationId: PUT_PauseInvoiceSchedule
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth_optional'
