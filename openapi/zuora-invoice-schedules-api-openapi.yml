          description: 'A list of the numbers of specific subscriptions associated with the invoice schedule.

            '
          items:
            $ref: '#/definitions/InvoiceScheduleSpecificSubscriptions'
          type: array
        status:
          description: 'The status of the invoice schedule.

            '
          enum:
          - Pending
          - PartiallyProcessed
          - Paused
          - FullyProcessed
          type: string
        totalAmount:
          description: "The total amount that needs to be billed during the processing of the invoice schedule. \n\nThe value of this field keeps unchanged once invoice schedule items are created.\n"
          format: number
          type: string
        unbilledAmount:
          description: 'The amount that is waiting to be billed during the processing of the invoice schedule.

            '
          format: number
          type: string
      type: object
    - $ref: '#/definitions/InvoiceScheduleCustomFields'
    - {}
  BillRunFilters:
    allOf:
    - properties:
        accountId:
          description: 'The target account of the bill run.

            '
          type: string
        filterType:
          description: 'The type of the filter to determine whether to create a bill run at the account level or subscription level.

            '
          enum:
          - Account
          - Subscription
          - InvoiceSchedule
          type: string
        subscriptionId:
          description: "The unique ID of the target subscription belonged to the target account. \n\nThis field is required if you set the `filterType` field to `Subscription`.\n"
          type: string
      type: object
    - {}
    title: billRunFilters
  POSTCreateInvoiceScheduleRequest:
    allOf:
    - properties:
        accountKey:
          description: 'The ID or number of the account associated with the invoice schedule.

            '
          type: string
        additionalSubscriptionsToBill:
          description: "A list of the numbers of the subscriptions that need to be billed together with the invoice schedule. \n\nOne invoice schedule can have at most 600 additional subscriptions.\n"
          items:
            type: string
          type: array
        invoiceSeparately:
          description: 'Whether the invoice items created from the invoice schedule appears on a separate invoice when Zuora generates invoices.

            '
          type: boolean
        notes:
          description: 'Comments on the invoice schedule.

            '
          maxLength: 255
          type: string
        orders:
          description: 'A list of the IDs or numbers of the orders associated with the invoice schedule. One invoice schedule can be associated with at most 10 orders.

            '
          items:
            type: string
          type: array
        scheduleItems:
          description: 'Container for invoice schedule items. One invoice schedule can have at most 50 invoice schedule items.

            '
          items:
            $ref: '#/definitions/POSTScheduleItemType'
          type: array
        specificSubscriptions:
          description: "A list of the numbers of specific subscriptions associated with the invoice schedule.\n\n- If the subscriptions specified in this field belong to the orders specified in the `orders` field, only the specific subscriptions instead of the orders are associated with the invoice schedule. \n- If only the `orders` field is specified, all the subscriptions from the order are associated with the invoice schedule.\n\nExample:\n```\n{\n  \"orders\": [\n    \"O-00000001\", \"O-00000002\"\n  ],\n  \"specificSubscriptions\": [\n    {\n      \"orderKey\": \"O-00000001\",\n      \"subscriptionKey\": \"S-00000001\"\n    }\n  ]\n}\n```\n- For the order with number O-00000001, only subscription S-00000001 contained in the order is associated with the invoice schedule.\n- For the order with number O-00000002, all subscriptions contained in the order are associated with the invoice schedule.\n"
          items:
            $ref: '#/definitions/InvoiceScheduleSpecificSubscriptions'
          type: array
      type: object
    - $ref: '#/definitions/InvoiceScheduleCustomFields'
    - {}
    example:
      accountKey: A00000007
      additionalSubscriptionsToBill:
      - S-00000001
      - S-00000002
      invoiceSeparately: false
      notes: 2022 Billing Schedule
      orders:
      - O-00000007
      - O-00000008
      scheduleItems:
      - amount: 50000
        runDate: '2022-02-24'
        targetDateForAdditionalSubscriptions: '2022-02-24'
      - amount: 14000
        runDate: '2022-10-17'
        targetDateForAdditionalSubscriptions: '2022-10-17'
      - amount: 6200
        runDate: '2022-11-14'
        targetDateForAdditionalSubscriptions: '2022-11-14'
      specificSubscriptions:
      - orderKey: O-00000008
        subscriptionKey: S-00000008
  InvoiceScheduleItemCustomFields:
    additionalProperties:
      description: 'Custom fields of the Invoice Schedule Item object. The name of each custom field has the form <code>*customField*__c</code>. Custom field names are case sensitive. See [Manage Custom Fields](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Manage_Custom_Fields) for more information.

        '
    description: 'Container for custom fields of an Invoice Schedule Item object.

      '
    title: invoiceScheduleItemCustomFields
    type: object
  POSTScheduleItemType:
    allOf:
    - properties:
        amount:
          description: "The amount of the invoice to be generated during the processing of the invoice schedule item. \n\nYou can only specify either the `amount` field or `percentage` field in one request. \n  - If you choose to specify the `amount` field in the request, `null` is returned as the value of the `percentage` field in the corresponding response. \n  - If you choose to specify the `percentage` field in the request, the value of the `amount` field returned in the corresponding response is calculated based on the percentage of the total amount.            \n"
          format: number
          type: string
        name:
          description: 'The name of the invoice schedule item.

            '
          maxLength: 100
          type: string
        percentage:
          description: "The percentage of the total amount to be billed during the processing of the invoice schedule item. \n\nYou can only specify either the `amount` field or `percentage` field in one request. \n  - If you choose to specify the `amount` field in the request, `null` is returned as the value of the `percentage` field in the corresponding response. \n  - If you choose to specify the `percentage` field in the request, the value of the `amount` field returned in the corresponding response is calculated based on the percentage of the total amount.\n"
          format: number
          maximum: 100
          type: string
        runDate:
          description: "The date in the tenant’s time zone when the invoice schedule item is planned to be processed to generate an invoice.\n\n\nWhen specifying run dates for invoice schedule items, consider that:\n- An invoice schedule item with a blank run date will not be executed.\n- You can only update the run date for an invoice schedule item in Pending status.\n- If the run date of an invoice schedule item is left empty, the dates of all subsequent invoice schedule items must also be blank.\n- You must specify run dates in chronological order for invoice schedule items.                  \n"
          format: date
          type: string
        targetDateForAdditionalSubscriptions:
          description: "The date in the tenant's time zone used by the invoice schedule to determine which fixed-period regular charges to be billed together with the invoice schedule item. \n\nThe regular charges must come from the subscriptions specified in the `additionalSubscriptionsToBill` field.\n"
          format: date
          type: string
      type: object
    - $ref: '#/definitions/InvoiceScheduleItemCustomFields'
    - {}
    title: scheduleItems
  InvoiceScheduleSpecificSubscriptions:
    properties:
      chargeNumbers:
        description: 'A list of charges in the subscription that are chosen to be included in the invoice schedule.

          '
        type: string
      orderKey:
        description: 'The unique ID or number of the order associated with the invoice schedule.

          '
        type: string
      subscriptionKey:
        description: 'The unique number of the subscription contained in the order associated with the invoice schedule.

          '
        type: string
    title: specificSubscriptions
    type: object
  InvoiceScheduleCustomFields:
    additionalProperties:
      description: 'Custom fields of the Invoice Schedule object. The name of each custom field has the form <code>*customField*__c</code>. Custom field names are case sensitive. See [Manage Custom Fields](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Manage_Custom_Fields) for more information.

        '
    description: 'Container for custom fields of an Invoice Schedule object.

      '
    title: invoiceScheduleCustomFields
    type: object
  POSTExecuteInvoiceScheduleRequest:
    allOf:
    - properties:
        scheduleItemId:
          description: 'The ID of the invoice schedule item to be executed.


            The item must be the earliest pending schedule item. If all the invoice schedule items have been processed and credit is needed to be generated, do not specify this field in the request.

            '
          type: string
      type: object
    - {}
    example:
      scheduleItemId: 8ad09b7d82b5c62f0182c5cd16944f73
  PUTUpdateInvoiceScheduleRequest:
    allOf:
    - properties:
        additionalSubscriptionsToBill:
          description: "A list of the numbers of the subscriptions that need to be billed together with the invoice schedule. \n\nOne invoice schedule can have at most 600 additional subscriptions.\n"
          items:
            type: string
          type: array
        invoiceSeparately:
          description: 'Whether the invoice items created from the invoice schedule appears on a separate invoice when Zuora generates invoices.

            '
          type: boolean
        nextRunDate:
          description: "The run date of the next execution of the invoice schedule. \n\nBy default, the next run date is the same as the run date of next pending invoice schedule item. The date can be overwritten by a different date other than the default value. If the invoice schedule has completed the execution, the next run date is `null`.\n"
          format: date
          type: string
        notes:
          description: 'Comments on the invoice schedule.

            '
          maxLength: 255
          type: string
        orders:
          description: 'A list of the IDs or numbers of the orders associated with the invoice schedule. One invoice schedule can be associated with at most 10 orders.


            The orders specified in this field override all the existing orders associated with the invoice schedule.

            '
          items:
            type: string
          type: array
        scheduleItems:
          description: 'Container for invoice schedule items. The maximum number of schedule items is 50.


            The invoice schedule items specified in this field override all the existing invoice schedule items.

            '
          items:
            $ref: '#/definitions/UpdateScheduleItems'
          type: array
        specificSubscriptions:
          description: "A list of the numbers of specific subscriptions associated with the invoice schedule.\n\n- If the subscriptions specified in this field belong to the orders specified in the `orders` field, only the specific subscriptions instead of the orders are associated with the invoice schedule. \n- If only the `orders` field is specified, all the subscriptions from the order are associated with the invoice schedule.\n  \nThe specific subscriptions specified in this field override all the existing specific subscriptions associated with the invoice schedule.\n\nExample:\n```\n{\n  \"orders\": [\n    \"O-00000001\", \"O-00000002\"\n  ],\n  \"specificSubscriptions\": [\n    {\n      \"orderKey\": \"O-00000001\",\n      \"subscriptionKey\": \"S-00000001\"\n    }\n  ]\n}\n```\n- For the order with number O-00000001, only subscription S-00000001 contained in the order is associated with the invoice schedule.\n- For the order with number O-00000002, all subscriptions contained in the order are associated with the invoice schedule.\n"
          items:
            $ref: '#/definitions/InvoiceScheduleSpecificSubscriptions'
          type: array
      type: object
    - $ref: '#/definitions/InvoiceScheduleCustomFields'
    - {}
    example:
      additionalSubscriptionsToBill:
      - S-00000001
      - S-00000002
      invoiceSeparately: false
      nextRunDate: '2022-02-01'
      notes: 2022 Billing Schedule - V2
      orders:
      - O-00000007
      - O-00000008
      scheduleItems:
      - amount: 54000
        id: 8a8881aa82118bec018211daf9f01680
        runDate: '2022-02-24'
        targetDateForAdditionalSubscriptions: '2022-02-24'
      - amount: 10000
        id: 8a8881aa82118bec018211daf9f11681
        runDate: '2022-10-17'
        targetDateForAdditionalSubscriptions: '2022-10-17'
      - amount: 6200
        id: 8a8881aa82118bec018211daf9f11682
        runDate: '2022-11-14'
        targetDateForAdditionalSubscriptions: '2022-11-14'
      specificSubscriptions:
      - orderKey: O-00000008
        subscriptionKey: S-00000008
parameters:
  GLOBAL_HEADER_Accept_Encoding:
    name: Accept-Encoding
    in: header
    required: false
    type: string
    description: "Include the `Accept-Encoding: gzip` header to compress responses as a gzipped file. It can significantly reduce the bandwidth required for a response. \n\nIf specified, Zuora automatically compresses responses that contain over 1000 bytes of data, and the response contains a `Content-Encoding` header with the compression algorithm so that your client can decompress it.\n"
  GLOBAL_HEADER_Zuora_Org_Ids:
    name: Zuora-Org-Ids
    in: header
    required: false
    type: string
    description: "Comma separated IDs. If you have <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Multi-Org\" target=\"_blank\">Zuora Multi-Org</a> enabled, \nyou can use this header to specify which orgs to perform the operation in. If you do not have Zuora Multi-Org enabled, you should not set this header.\n\nThe IDs must be a sub-set of the user's accessible orgs. If you specify an org that the user does not have access to, the operation fails.\n\nIf the header is not set, the operation is performed in scope of the user's accessible orgs.\n"
  GLOBAL_HEADER_Idempotency_Key:
    name: Idempotency-Key
    in: header
    required: false
    type: string
    maxLength: 255
    description: "Specify a unique idempotency key if you want to perform an idempotent POST or PATCH request. Do not use this header in other request types. \n\nWith this header specified, the Zuora server can identify subsequent retries of the same request using this value, which prevents the same operation from being performed multiple times by accident. \n"
  GLOBAL_HEADER_Content_Encoding:
    name: Content-Encoding
    in: header
    required: false
    type: string
    description: 'Include the `Content-Encoding: gzip` header to compress a request. With this header specified, you should upload a gzipped file for the request payload instead of sending the JSON payload.

      '
  GLOBAL_HEADER_Zuora_Entity_Ids_Single:
    name: Zuora-Entity-Ids
    in: header
    required: false
    type: string
    description: 'An entity ID. If you have [Zuora Multi-entity](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Multi-entity) enabled and the OAuth token is valid for more than one entity, you must use this header to specify which entity to perform the operation in. If the OAuth token is only valid for a single entity, or you do not have Zuora Multi-entity enabled, you do not need to set this header.

      '
  GLOBAL_HEADER_Zuora_Track_Id:
    name: Zuora-Track-Id
    in: header
    required: false
    type: string
    maxLength: 64
    description: 'A custom identifier for tracing the API call. If you set a value for this header, Zuora returns the same value in the response headers. This header enables you to associate your system process identifiers with Zuora API calls, to assist with troubleshooting in the event of an issue.


      The value of this field must use the US-ASCII character set and must not include any of the following characters: colon (`:`), semicolon (`;`), double quote (`"`), and quote (`''`).

      '
  GLOBAL_REQUEST_pageSize:
    name: pageSize
    in: query
    required: false
    type: integer
    maximum: 40
    default: 20
    description: 'The number of records returned per page in the response.

      '
  GLOBAL_HEADER_Authorization_OAuth_optional:
    name: Authorization
    in: header
    required: false
    type: string
    description: 'The value is in the `Bearer {token}` format where {token} is a valid OAuth token generated by calling [Create an OAuth token](/api-references/api/operation/createToken).

      '
  GLOBAL_REQUEST_page:
    name: page
    in: query
    required: false
    type: integer
    minimum: 1
    default: 1
    description: 'The index number of the page that you want to retrieve. This parameter is dependent on `pageSize`. You must set `pageSize` before specifying `page`. For example, if you set `pageSize` to `20` and `page` to `2`, the 21st to 40th records are returned in the response.

      '
