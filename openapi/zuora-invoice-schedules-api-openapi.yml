        targetDate:
          description: 'The target date for this bill run, only valid for ad-hoc bill run.

            '
          format: date
          type: string
        targetDateOffset:
          description: 'The offset compared to bill run execution date, only valid for scheduled bill run.

            '
          type: integer
        updatedById:
          description: 'The ID of the user who updated the bill run.

            '
          type: string
        updatedDate:
          description: 'The date and time when the bill run was updated.

            '
          format: date-time
