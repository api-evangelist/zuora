              schema:
                type: string
                maxLength: 64
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFulfillmentResponseType'
              example:
                success: true
                fulfillment:
                  id: 4028828c82819b74018281a69d3f0d93
                  fulfillmentNumber: F-00000001
                  orderLineItemId: 4028828c82819b74018281a69adf0d4e
                  fulfillmentDate: '2022-01-01'
                  fulfillmentType: Delivery
                  quantity: 1.0
                  state: SentToBilling
                  billTargetDate: '2022-01-01'
                  description: description
                  trackingNumber: T-00091912
                  carrier: carrier
                  fulfillmentSystem: fulfillment system
                  fulfillmentLocation: location
                  externalId: 9dc1a064-b5d1-4d7b-bd0b-ca26a1be8e01
                  customFields:
                    priority__c: Hight
                  fulfillmentItems:
                  - id: 4028828c82819b74018281a69d680d98
                    fulfillmentId: 4028828c82819b74018281a69d3f0d93
                    description: description
                    itemIdentifier: 87309cf0-10c7-4130-8da2-439c96daa1ff
                    customFields:
                      category__c: Old
    put:
      summary: Update a fulfillment
      operationId: PUT_Fulfillment
      description: 'Updates a specified fulfillment. The `state` field of a fulfillment can only be updated when it is in a different state, to trigger the state transition. The other fields of a fulfillment can only be updated when the fulfillment is in the `Executing` state, or when the fulfillment is in the `Booked` state and the user has the "Allow Edit Of Booked Order Line Items" permission.

        The following tutorial demonstrates how to use this operation:

        * Update or cancel a fulfillment'
