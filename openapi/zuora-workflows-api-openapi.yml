      description: 'Updates a specific workflow by its ID, which allows you to [configure the settings of a workflow](https://knowledgecenter.zuora.com/CE_Workflow/Using_Workflow/B_Configure_a_Workflow) via API.


        ### User Access Permission

        You must be assigned the **Workflow Manage Access** permission to run this operation.

        '
      tags:
      - Workflows
      parameters:
      - $ref: '#/parameters/GLOBAL_HEADER_Idempotency_Key'
      - $ref: '#/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - $ref: '#/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - $ref: '#/parameters/GLOBAL_HEADER_Zuora_Org_Ids'
      - $ref: '#/parameters/GLOBAL_HEADER_Authorization_OAuth'
      - name: workflow_id
        in: path
        required: true
        description: 'The unique ID of a workflow definition. For example, 19080.

          '
        type: string
      - name: request
        in: body
        schema:
          type: object
          properties:
            name:
              type: string
              description: 'The name of the workflow definition

                '
            description:
              type: string
              description: 'The description of the workflow defintion

                '
            active_workflow_version_id:
              type: integer
              description: 'The id of a version. This version will then be set to the active version of the workflow definition.

                '
            status:
              type: string
              description: 'Can be `Active` or `Inactive`. Active workfow definitions run like normal. Inactive workflow definitions cannot be run.

                '
      responses:
        '200':
          description: OK
          headers:
