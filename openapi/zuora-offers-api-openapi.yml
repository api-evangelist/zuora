    POSTOfferChargeConfiguration:
      description: 'Container for the configurations of the product rate plan charge.

        '
      properties:
        billCycleDay:
          description: 'The day of the month when a bill run generates invoices for the account.


            The bill cycle day (BCD) determines which day of the month customer is billed. The BCD value in the account can override the BCD in this object.

            '
          maximum: 31
          minimum: 1
          type: number
        billCycleType:
          description: "How to determine the billing day for the charge. \n\n- If you set this field to `SpecificDayofMonth`, you must also specify the `billCycleDay` field. \n- If you set this field to to `SpecificDayofWeek`, you must also specify the `weeklyBillCycleDay` field.\n"
          enum:
          - DefaultFromCustomer
          - SpecificDayofMonth
          - SubscriptionStartDay
          - ChargeTriggerDay
          - SpecificDayofWeek
          - TermStartDay
          - TermEndDay
          type: string
        billingPeriod:
          description: 'The  billing period for this product rate plan charge. The start day of the billing period is also called the bill cycle day (BCD).

            '
          enum:
          - Month
          - Quarter
          - Semi_Annual
          - Annual
          - Eighteen_Months
          - Two_Years
          - Three_Years
          - Five_Years
          - Specific_Months
          - Subscription_Term
          - Week
          - Specific_Weeks
          type: string
        billingPeriodAlignment:
          description: 'How to align charges within the same subscription if multiple charges begin on different dates.


            **Note:** `AlignToTermEnd` is only available for prepayment charges by default. To enable this value for non-prepaid recurring charges, contact <a href="http://support.zuora.com/" target="_blank">Zuora Global Support</a>.

            '
          enum:
          - AlignToCharge
          - AlignToSubscriptionStart
          - AlignToTermStart
          - AlignToTermEnd
          type: string
        billingTiming:
          description: 'The billing timing for this product rate plan charge.


            You can choose to bill in advance or in arrears for recurring charge types. This field is not used in one-time or usage based charge types.

            '
          enum:
          - IN_ADVANCE
          - IN_ARREARS
          type: string
        endDateCondition:
          default: Subscription_End
          description: "When the product rate plan charge ends after the charge trigger date.\n\n- `Subscription_End`: The charge ends on the subscription end date after a specified period based on the trigger date of the charge. This is the default value. \n- `Fixed_Period`: The charge ends after a specified period based on the trigger date of the charge. If you set this field to `Fixed_Period`, you must specify the length of the period and a period type by defining the `upToPeriods` and `upToPeriodsType` fields. \n\n**Note**: If the subscription ends before the charge end date, the charge ends when the subscription ends. However, if the subscription end date is subsequently changed through a Renewal, or Terms and Conditions amendment, the charge will end on the charge end date.\n"
          enum:
          - Subscription_End
          - One_Time
          - Fixed_Period
          - Specific_End_Date
          type: string
        specificBillingPeriod:
          description: "The number of months or weeks for the billing period of this product rate plan charge. \n\nThis field is required if you set the `billingPeriod` field to `Specific_Months` or `Specific_Weeks`.\n"
          type: number
        triggerEvent:
          description: 'When to start billing the customer for the product rate plan charge.


            - `ContractEffective` indicates the date when the subscription''s contract goes into effect and the charge is ready to be billed.


            - `ServiceActivation` indicates the date when the services or products for a subscription have been activated and the customers have access.


            - `CustomerAcceptance` indicates the date when the customer accepts the services or products for a subscription.

            '
          enum:
          - ContractEffective
          - ServiceActivation
          - CustomerAcceptance
          - SpecificDate
          type: string
        upToPeriods:
          description: "The length of the period during which the charge is active. If this period ends before the subscription ends, the charge ends when this period ends.\n\n**Note**:\n- You must use this field together with the `upToPeriodsType` field to specify the time period. This field is applicable only if you set the `EndDateCondition` field to `Fixed_Period`. \n\n- If the subscription end date is subsequently changed through a Renewal, or Terms and Conditions amendment, the charge end date will change accordingly up to the original period end.\n"
          type: number
        upToPeriodsType:
          description: "The period type used to define when the charge ends.\n\n**Note**: \n- You must use this field together with the `upToPeriods` field to specify the time period.\n- This field is applicable only if you set the `endDateCondition` field to `Fixed_Period`. \n       \n"
          enum:
          - Billing_Periods
          - Days
          - Weeks
          - Months
          - Years
          type: string
        weeklyBillCycleDay:
          description: 'The day of the week when a bill run generates invoices for the account.

            '
          enum:
          - Sunday
          - Monday
          - Tuesday
          - Wednesday
          - Thursday
          - Friday
          - Saturday
          type: string
      title: configuration
      type: object
    CommonResponseType:
