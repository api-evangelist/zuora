components:
  parameters:
    GLOBAL_HEADER_Idempotency_Key:
      name: Idempotency-Key
      in: header
      required: false
      description: "Specify a unique idempotency key if you want to perform an idempotent POST or PATCH request. Do not use this header in other request types. \n\nWith this header specified, the Zuora server can identify subsequent retries of the same request using this value, which prevents the same operation from being performed multiple times by accident. \n"
      schema:
        type: string
        maxLength: 255
    GLOBAL_REQUEST_rejectUnknownFields:
      name: rejectUnknownFields
      in: query
      required: false
      description: "Specifies whether the call fails if the request body contains unknown fields.\nWith `rejectUnknownFields` set to `true`, Zuora returns a 400 response if\nthe request body contains unknown fields. The body of the 400 response is:\n\n```json\n{\n    \"message\": \"Error - unrecognised fields\"\n}\n```\n\nBy default, Zuora ignores unknown fields in the request body.\n"
      schema:
        type: boolean
        default: false
    GLOBAL_HEADER_Authorization_OAuth_optional:
      name: Authorization
      in: header
      required: false
      description: 'The value is in the `Bearer {token}` format where {token} is a valid OAuth token generated by calling [Create an OAuth token](/api-references/api/operation/createToken).

        '
      schema:
        type: string
    GLOBAL_HEADER_Accept_Encoding:
      name: Accept-Encoding
      in: header
      required: false
      description: "Include the `Accept-Encoding: gzip` header to compress responses as a gzipped file. It can significantly reduce the bandwidth required for a response. \n\nIf specified, Zuora automatically compresses responses that contain over 1000 bytes of data, and the response contains a `Content-Encoding` header with the compression algorithm so that your client can decompress it.\n"
      schema:
        type: string
    GLOBAL_HEADER_Content_Encoding:
      name: Content-Encoding
      in: header
      required: false
      description: 'Include the `Content-Encoding: gzip` header to compress a request. With this header specified, you should upload a gzipped file for the request payload instead of sending the JSON payload.

        '
      schema:
        type: string
    GLOBAL_HEADER_Zuora_Track_Id:
      name: Zuora-Track-Id
      in: header
      required: false
      description: 'A custom identifier for tracing the API call. If you set a value for this header, Zuora returns the same value in the response headers. This header enables you to associate your system process identifiers with Zuora API calls, to assist with troubleshooting in the event of an issue.


        The value of this field must use the US-ASCII character set and must not include any of the following characters: colon (`:`), semicolon (`;`), double quote (`"`), and quote (`''`).

        '
      schema:
        type: string
        maxLength: 64
    GLOBAL_HEADER_Zuora_Entity_Ids_Single:
      name: Zuora-Entity-Ids
      in: header
      required: false
      description: 'An entity ID. If you have [Zuora Multi-entity](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Multi-entity) enabled and the OAuth token is valid for more than one entity, you must use this header to specify which entity to perform the operation in. If the OAuth token is only valid for a single entity, or you do not have Zuora Multi-entity enabled, you do not need to set this header.

        '
      schema:
        type: string
    GLOBAL_HEADER_Zuora_Org_Ids:
      name: Zuora-Org-Ids
      in: header
      required: false
      description: "Comma separated IDs. If you have <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Multi-Org\" target=\"_blank\">Zuora Multi-Org</a> enabled, \nyou can use this header to specify which orgs to perform the operation in. If you do not have Zuora Multi-Org enabled, you should not set this header.\n\nThe IDs must be a sub-set of the user's accessible orgs. If you specify an org that the user does not have access to, the operation fails.\n\nIf the header is not set, the operation is performed in scope of the user's accessible orgs.\n"
      schema:
        type: string
  schemas:
    ProxyCreateOrModifyResponse:
      properties:
        Id:
          description: ''
          type: string
        Success:
          description: ''
          type: boolean
      type: object
    ProxyCreateTaxationItem:
      allOf:
      - properties:
          AccountingCode:
            description: ' The Chart of Accounts '
            type: string
          ExemptAmount:
            description: ' The calculated tax amount excluded due to the exemption.

              **Character limit**: 16 **Values**: a decimal value '
            format: double
            type: number
          InvoiceItemId:
            description: ' The ID of the specific invoice item that the taxation information applies to.

              **Character limit**: 32 **Values**: a valid invoice item ID '
            type: string
          Jurisdiction:
            description: ' The jurisdiction that applies the tax or VAT. This value is typically a state, province, county, or city.

              **Character limit**: 32 **Values**: a string of 32 characterrs or fewer '
            type: string
          LocationCode:
            description: ' The identifier for the location based on the value of the `TaxCode` field.

              **Character limit**: 32 **Values**: automatically generated '
            type: string
          Name:
            description: ' The name of the tax rate, such as sales tax or GST. This name is displayed on invoices.

              **Character limit**: 128 **Values**: a string of 128 characters or fewer '
            type: string
          TaxAmount:
            description: ' The amount of the tax applied to the charge.

              **Character limit**: 16 **Values**: a decimal value '
            format: double
            type: number
          TaxCode:
            description: ' The tax code identifies which tax rules and tax rates to apply to a specific charge.

              **Character limit**: 32 **Values**: a string of 32 characters or fewer '
            type: string
          TaxCodeDescription:
            description: ' The description for the tax code.

              **Character limit**: 255 **Values**: a string of 255 characters or fewer '
            type: string
          TaxDate:
            description: ' The date that the tax is applied to the charge, in `yyyy-mm-dd` format.

              **Character limit**: 29 '
            format: date
            type: string
          TaxRate:
            description: ' The tax rate applied to the charge.

              **Character limit**: 16 **Values**: a valid decimal value '
            format: double
            type: number
          TaxRateDescription:
            description: ' The description of the tax rate.

              **Character limit**: 255 **Values**: a string of 255 characters or fewer '
            type: string
          TaxRateType:
            description: ' The type of the tax rate applied to the charge.

              **Character limit**: 10 **Values**: `Percentage`, `FlatFee` '
            type: string
        required:
        - InvoiceItemId
        - Jurisdiction
        - Name
        - TaxAmount
        - TaxRate
        - TaxDate
        - TaxRateType
        type: object
      - $ref: '#/components/schemas/TaxationItemObjectCustomFields'
      example:
        AccountingCode: Usage Revenue
        ExemptAmount: 50
        InvoiceItemId: 2c93808457d787030157e0306cd43a88
        Jurisdiction: test
        LocationCode: code - 001
        Name: test
        TaxAmount: 3
        TaxCode: taxcode
        TaxCodeDescription: description
        TaxDate: '2016-10-20'
        TaxMode: TaxExclusive
        TaxRate: 3
        TaxRateDescription: test
        TaxRateType: FlatFee
    ProxyBadRequestResponse:
      properties:
        Errors:
          items:
            properties:
              Code:
                description: ''
                type: string
              Message:
                description: ''
                type: string
            type: object
          type: array
        Success:
          description: ''
          type: boolean
      type: object
    PUTTaxationItemType:
      allOf:
      - properties:
          exemptAmount:
            description: 'The calculated tax amount excluded due to the exemption.

              '
            format: double
            type: number
          financeInformation:
            description: 'Container for the finance information related to the taxation item.

              '
            properties:
              onAccountAccountingCode:
                description: 'The accounting code that maps to an on account in your accounting system.

                  '
                maxLength: 100
                minLength: 0
                type: string
              salesTaxPayableAccountingCode:
                description: 'The accounting code for the sales taxes payable.

                  '
                maxLength: 100
                minLength: 0
                type: string
            type: object
          jurisdiction:
            description: 'The jurisdiction that applies the tax or VAT. This value is typically a state, province, county, or city.

              '
            type: string
