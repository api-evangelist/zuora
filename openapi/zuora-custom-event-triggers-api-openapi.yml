definitions:
  PutEventTriggerRequest:
    example:
      condition: changeType == 'UPDATE' && Invoice.Status == 'Posted' && Invoice.Status_old != 'Posted' && Invoice.Amount > 5000
      description: Trigger an event when an invoice is posted with amount over 5000
      eventType:
        description: An invoice is posted with amount over 5000
    properties:
      active:
        description: The status of the trigger.
        type: boolean
      condition:
        description: The JEXL expression to be evaluated against object changes. See above for more information and an example.
        maxLength: 5000
        minLength: 1
        type: string
      description:
        description: The description of the trigger.
        maxLength: 1000
        type: string
      eventType:
        description: The type of events to be triggered.
        properties:
          description:
            description: The description for the event type.
            maxLength: 1000
            type: string
          displayName:
            description: The display name for the event type.
            maxLength: 500
            minLength: 1
            type: string
        type: object
    type: object
  EventType:
    properties:
      description:
        description: The description of the event type.
        maxLength: 1000
        type: string
      displayName:
        description: The display name for the event type.
        maxLength: 500
        minLength: 1
        type: string
      name:
        description: 'The name of the event. Should be unique, contain no space, and be in the pattern: ^[A-Za-z]{1,}[\\w\\-]*$'
        maxLength: 200
        minLength: 1
        type: string
    required:
    - name
    - displayName
    type: object
  EventTrigger:
    properties:
      active:
        description: The status of the trigger.
        type: boolean
      baseObject:
        description: 'The base object that the trigger rule is defined upon. The format of the value in this field depends on the base object type:

          - Standard object: object name, which should follow the pattern ^[A-Z][\w\-]*$. For example, `Invoice`.

          - Custom object: `default__<custom_object_api_name>`. For example, `default__vehicle`.

          '
        maxLength: 100
        minLength: 1
        type: string
      condition:
        description: The JEXL expression to be evaluated against object changes. See above for more information and an example.
        maxLength: 5000
        minLength: 1
        type: string
      description:
        description: The description of the trigger.
        maxLength: 1000
        type: string
      eventType:
        $ref: '#/definitions/EventType'
      id:
        format: uuid
        type: string
    type: object
  ErrorResponse:
    example:
      reasons:
      - code: ObjectNotFound
        message: Notification definition with id 6e569e1e05f040eda51a927b140c0ac1 does not exist
    properties:
      reasons:
        items:
          properties:
            code:
              description: 'The error code of response.

                '
              type: string
            message:
              description: The detail information of the error response
              type: string
          type: object
        type: array
    type: object
  PostEventTriggerRequest:
    example:
      active: true
      baseObject: Invoice
      condition: changeType == 'UPDATE' && Invoice.Status == 'Posted' && Invoice.Status_old != 'Posted' && Invoice.Amount > 1000
      description: Trigger an event when an invoice is posted with amount over 1000
      eventType:
        description: An invoice is posted with amount over 1000
        displayName: Large Invoice Posted
        name: LargeInvoicePosted
    properties:
      active:
        description: The status of the event trigger.
        type: boolean
      baseObject:
        description: 'The base object that the trigger rule is defined upon. The format of the value in this field depends on the base object type:

          - Standard object: object name, which should follow the pattern ^[A-Z][\w\-]*$. For example, `Invoice`.

          - Custom object: `default__<custom_object_api_name>`. For example, `default__vehicle`.

          '
        maxLength: 100
        minLength: 1
        type: string
      condition:
        description: The JEXL expression to be evaluated against object changes. See above for more information and an example.
        maxLength: 5000
        minLength: 1
        type: string
      description:
        description: The description of the event trigger.
        maxLength: 1000
        type: string
      eventType:
        $ref: '#/definitions/EventType'
    required:
    - baseObject
    - condition
    - eventType
    - active
    type: object
parameters:
  GLOBAL_HEADER_Idempotency_Key:
    name: Idempotency-Key
    in: header
    required: false
    type: string
    maxLength: 255
    description: "Specify a unique idempotency key if you want to perform an idempotent POST or PATCH request. Do not use this header in other request types. \n\nWith this header specified, the Zuora server can identify subsequent retries of the same request using this value, which prevents the same operation from being performed multiple times by accident. \n"
  GLOBAL_HEADER_Content_Encoding:
    name: Content-Encoding
    in: header
    required: false
    type: string
    description: 'Include the `Content-Encoding: gzip` header to compress a request. With this header specified, you should upload a gzipped file for the request payload instead of sending the JSON payload.

      '
  GLOBAL_HEADER_Accept_Encoding:
    name: Accept-Encoding
    in: header
    required: false
    type: string
    description: "Include the `Accept-Encoding: gzip` header to compress responses as a gzipped file. It can significantly reduce the bandwidth required for a response. \n\nIf specified, Zuora automatically compresses responses that contain over 1000 bytes of data, and the response contains a `Content-Encoding` header with the compression algorithm so that your client can decompress it.\n"
  GLOBAL_HEADER_Zuora_Entity_Ids_Single:
    name: Zuora-Entity-Ids
    in: header
    required: false
    type: string
    description: 'An entity ID. If you have [Zuora Multi-entity](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Multi-entity) enabled and the OAuth token is valid for more than one entity, you must use this header to specify which entity to perform the operation in. If the OAuth token is only valid for a single entity, or you do not have Zuora Multi-entity enabled, you do not need to set this header.

      '
  GLOBAL_HEADER_Authorization_OAuth:
    name: Authorization
    in: header
    required: true
    type: string
    description: 'The value is in the `Bearer {token}` format where {token} is a valid OAuth token generated by calling [Create an OAuth token](/api-references/api/operation/createToken).

      '
  GLOBAL_HEADER_Zuora_Org_Ids:
    name: Zuora-Org-Ids
    in: header
    required: false
    type: string
    description: "Comma separated IDs. If you have <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Multi-Org\" target=\"_blank\">Zuora Multi-Org</a> enabled, \nyou can use this header to specify which orgs to perform the operation in. If you do not have Zuora Multi-Org enabled, you should not set this header.\n\nThe IDs must be a sub-set of the user's accessible orgs. If you specify an org that the user does not have access to, the operation fails.\n\nIf the header is not set, the operation is performed in scope of the user's accessible orgs.\n"
  GLOBAL_HEADER_Zuora_Track_Id:
    name: Zuora-Track-Id
    in: header
    required: false
    type: string
    maxLength: 64
    description: 'A custom identifier for tracing the API call. If you set a value for this header, Zuora returns the same value in the response headers. This header enables you to associate your system process identifiers with Zuora API calls, to assist with troubleshooting in the event of an issue.


      The value of this field must use the US-ASCII character set and must not include any of the following characters: colon (`:`), semicolon (`;`), double quote (`"`), and quote (`''`).

      '
