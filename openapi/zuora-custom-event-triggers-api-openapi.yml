openapi: 3.2.0
info:
  version: '2023-12-15'
  title: Reference Custom Event Triggers API
  description: '# Introduction


    Welcome to the REST API reference for the Zuora Billing, Payments, and Central Platform!'
  contact:
    email: docs@zuora.com
servers:
- url: https://rest.zuora.com/
tags:
- name: Custom Event Triggers
  description: 'The Event Trigger service manages the business events and trigger conditions that are defined on Zuora Business Object Model or custom objects. When a Zuora object changes, the trigger conditions defined on the object are evaluated, and if any condition qualifies, a business event will be triggered and turned into a notification.


    **Note**: Event Triggers operations are only applicable to custom events.'
paths:
  /events/event-triggers:
    post:
