      - name: baseObject
        in: query
        description: 'The Zuora object that trigger condition is defined upon. The format of the value in this field depends on the base object type:

          - Standard object: object name, which should follow the pattern ^[A-Z][\w\-]*$. For example, `Invoice`.

          - Custom object: `default__<custom_object_api_name>`. For example, `default__vehicle`.

          '
        required: false
        schema:
          type: string
      - name: eventTypeName
        in: query
        description: 'The event type name. Should be specified in the pattern: ^[A-Za-z]{1,}[\w\-]*$'
        required: false
        schema:
          type: string
