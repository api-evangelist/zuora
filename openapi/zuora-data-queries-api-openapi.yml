              example:
                code: 400
                message: Unable to process JSON
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitDataQueryRequest'
        required: true
    get:
      operationId: GET_DataQueryJobs
      summary: List data query jobs
      description: 'Returns a list of data query jobs that have been created in your Zuora tenant. You can filter the list by status.


        If you are an administrator, you can retrieve all the query jobs in your tenant. Otherwise, you can only retrieve your own query jobs.'
      tags:
      - Data Queries
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Org_Ids'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - name: queryStatus
        in: query
        required: false
        description: 'Filters the list of query jobs by status.

          '
        schema:
          type: string
          enum:
          - accepted
          - in_progress
          - completed
          - failed
          - cancelled
      - name: pageSize
        in: query
        required: false
        description: 'The number of records returned per page in the response.

          '
        schema:
          type: integer
          default: 20
          maximum: 100
      responses:
        '200':
          description: OK
          headers:
            Content-Encoding:
              description: "This header is returned if you specify the `Accept-Encoding: gzip` request header and the response contains over 1000 bytes of data.\n\nNote that only the following MIME types support gzipped responses:\n  - `application/json`\n  - `application/xml`\n  - `text/html`\n  - `text/csv`\n  - `text/plain`\n"
              schema:
                type: string
            RateLimit-Limit:
              description: 'The request limit quota for the time window closest to exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: string
            RateLimit-Remaining:
              description: 'The number of requests remaining in the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            RateLimit-Reset:
              description: 'The number of seconds until the quota resets for the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            Zuora-Request-Id:
              description: 'The Zuora internal identifier of the API call. You cannot control the value of this header.

                '
              schema:
                type: string
                maxLength: 36
                minLength: 36
            Zuora-Track-Id:
              description: 'A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.

                '
              schema:
                type: string
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDataQueryJobsResponse'
              example:
                data:
                - id: bf3b5640-ddd1-4b4f-9a81-906ec2b84a89
                  query: SELECT s.id FROM Subscription s JOIN RatePlan rp ON s.id = rp.subscriptionid WHERE rp.name = 'Premium Monthly'
                  useIndexJoin: false
                  sourceData: LIVE
                  queryStatus: in_progress
                  remainingRetries: 3
                  updatedOn: '2018-08-17T13:14:38.855Z'
                  createdBy: 514f3ea1-6716-4f44-b6e0-9a8f0cf44bd2
                - id: 3a3e85c4-96e7-486b-ae02-827120104301
                  query: SELECT accountnumber, balance FROM Account WHERE Account.balance > 100
                  useIndexJoin: false
                  sourceData: LIVE
                  queryStatus: completed
                  dataFile: https://example.s3.us-west-2.amazonaws.com/3a3e85c4-96e7-486b-ae02-827120104301_24921638725108715.json?X-Amz-Security-Token=...
                  outputRows: 24516
                  processingTime: 9212
                  remainingRetries: 3
                  updatedOn: '2018-08-17T13:14:19.17Z'
                  createdBy: 514f3ea1-6716-4f44-b6e0-9a8f0cf44bd2
  /query/jobs/{job-id}:
    get:
      operationId: GET_DataQueryJob
      summary: Retrieve a data query job
      description: 'Retrieves a data query job. You can use this operation to track the status of the query job and obtain the URL of the query results.


        If you are an administrator, you can retrieve every query job in your tenant.


        If you are a non-admin user and try to retrieve a query job that you are not the owner of, you will get a 403 response indicating that you are forbidden from viewing this job. As a non-admin user, you can only retrieve your own query job.'
      tags:
      - Data Queries
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Org_Ids'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - name: job-id
        in: path
        required: true
        description: 'Internal identifier of the query job.

          '
        schema:
          type: string
          format: uuid
          maxLength: 36
          minLength: 36
      responses:
        '200':
          description: OK
          headers:
            Content-Encoding:
              description: "This header is returned if you specify the `Accept-Encoding: gzip` request header and the response contains over 1000 bytes of data.\n\nNote that only the following MIME types support gzipped responses:\n  - `application/json`\n  - `application/xml`\n  - `text/html`\n  - `text/csv`\n  - `text/plain`\n"
