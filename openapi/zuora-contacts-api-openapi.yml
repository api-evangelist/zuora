components:
  parameters:
    GLOBAL_HEADER_Idempotency_Key:
      name: Idempotency-Key
      in: header
      required: false
      description: "Specify a unique idempotency key if you want to perform an idempotent POST or PATCH request. Do not use this header in other request types. \n\nWith this header specified, the Zuora server can identify subsequent retries of the same request using this value, which prevents the same operation from being performed multiple times by accident. \n"
      schema:
        type: string
        maxLength: 255
    GLOBAL_HEADER_Authorization_OAuth_optional:
      name: Authorization
      in: header
      required: false
      description: 'The value is in the `Bearer {token}` format where {token} is a valid OAuth token generated by calling [Create an OAuth token](/api-references/api/operation/createToken).

        '
      schema:
        type: string
    GLOBAL_HEADER_Zuora_Track_Id:
      name: Zuora-Track-Id
      in: header
      required: false
      description: 'A custom identifier for tracing the API call. If you set a value for this header, Zuora returns the same value in the response headers. This header enables you to associate your system process identifiers with Zuora API calls, to assist with troubleshooting in the event of an issue.


        The value of this field must use the US-ASCII character set and must not include any of the following characters: colon (`:`), semicolon (`;`), double quote (`"`), and quote (`''`).

        '
      schema:
        type: string
        maxLength: 64
    GLOBAL_HEADER_Content_Encoding:
      name: Content-Encoding
      in: header
      required: false
      description: 'Include the `Content-Encoding: gzip` header to compress a request. With this header specified, you should upload a gzipped file for the request payload instead of sending the JSON payload.

        '
      schema:
        type: string
    GLOBAL_HEADER_Accept_Encoding:
      name: Accept-Encoding
      in: header
      required: false
      description: "Include the `Accept-Encoding: gzip` header to compress responses as a gzipped file. It can significantly reduce the bandwidth required for a response. \n\nIf specified, Zuora automatically compresses responses that contain over 1000 bytes of data, and the response contains a `Content-Encoding` header with the compression algorithm so that your client can decompress it.\n"
      schema:
        type: string
    GLOBAL_HEADER_Zuora_Entity_Ids_Single:
      name: Zuora-Entity-Ids
      in: header
      required: false
      description: 'An entity ID. If you have [Zuora Multi-entity](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Multi-entity) enabled and the OAuth token is valid for more than one entity, you must use this header to specify which entity to perform the operation in. If the OAuth token is only valid for a single entity, or you do not have Zuora Multi-entity enabled, you do not need to set this header.

        '
      schema:
        type: string
    GLOBAL_HEADER_Zuora_Org_Ids:
      name: Zuora-Org-Ids
      in: header
      required: false
      description: "Comma separated IDs. If you have <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Multi-Org\" target=\"_blank\">Zuora Multi-Org</a> enabled, \nyou can use this header to specify which orgs to perform the operation in. If you do not have Zuora Multi-Org enabled, you should not set this header.\n\nThe IDs must be a sub-set of the user's accessible orgs. If you specify an org that the user does not have access to, the operation fails.\n\nIf the header is not set, the operation is performed in scope of the user's accessible orgs.\n"
      schema:
        type: string
  schemas:
    PUTContactType:
      allOf:
      - properties:
          address1:
            description: 'The first line of the contact''s address, which is often a street address or business name.

              '
            maxLength: 255
            type: string
          address2:
            description: 'The second line of the contact''s address.

              '
            maxLength: 255
            type: string
          city:
            description: 'The city of the contact''s address.

              '
            maxLength: 40
            type: string
          contactDescription:
            description: 'A description for the contact.

              '
            maxLength: 100
            type: string
          country:
            description: 'The country of the contact''s address.

              '
            maxLength: 64
            type: string
          county:
            description: 'The county. May optionally be used by Zuora Tax to calculate county tax.

              '
            maxLength: 32
            type: string
          fax:
            description: 'The contact''s fax number.

              '
            maxLength: 40
            type: string
          firstName:
            description: 'The contact''s first name.

              '
            maxLength: 100
            type: string
          homePhone:
            description: 'The contact''s home phone number.

              '
            maxLength: 40
            type: string
          lastName:
            description: 'The contact''s last name.

              '
            maxLength: 100
            type: string
          mobilePhone:
            description: 'The mobile phone number of the contact.

              '
            maxLength: 100
            type: string
          nickname:
            description: 'A nickname for the contact.

              '
            maxLength: 100
            type: string
          otherPhone:
            description: 'An additional phone number for the contact.

              '
            maxLength: 40
            type: string
          otherPhoneType:
            description: 'The type of the additional phone number.

              '
            enum:
            - Work
            - Mobile
            - Home
            - Other
            type: string
          personalEmail:
            description: 'The contact''s personal email address.

              '
            maxLength: 74
            type: string
          state:
            description: 'The state or province of the contact''s address.

              '
            maxLength: 40
            type: string
          taxRegion:
            description: 'If using Zuora Tax, a region string as optionally defined in your tax rules. Not required.

              '
            maxLength: 32
            type: string
          workEmail:
            description: 'The contact''s business email address.

              '
            maxLength: 74
            type: string
          workPhone:
            description: 'The contact''s business phone number.

              '
            maxLength: 40
            type: string
          zipCode:
            description: 'The zip code for the contact''s address.

              '
            maxLength: 20
            type: string
        type: object
      - $ref: '#/components/schemas/ContactObjectCustomFields'
      example:
        address1: new Address
        city: Mumbai
        contactDescription: This is the new Description
        mobilePhone: 123213
        zipCode: 123134
    ContactObjectCustomFields:
      additionalProperties:
        description: 'Custom fields of the Contact object. The name of each custom field has the form <code>*customField*__c</code>. Custom field names are case sensitive. See [Manage Custom Fields](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Manage_Custom_Fields) for more information.

          '
      description: 'Container for custom fields of a Contact object.

        '
      title: contactFieldsCustom
      type: object
    ContactResponse:
      allOf:
      - properties:
          accountId:
            description: 'The ID of the account associated with the contact.

              '
            type: string
          accountNumber:
            description: 'The number of the customer account associated with the contact.

              '
            type: string
          address1:
            description: 'The first line of the contact''s address, which is often a street address or business name.

