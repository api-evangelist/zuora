          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
              example:
                accountId: 72756e2061726e642026206465736572742075
                accountNumber: A00000001
                address1: 567, Rose Apartment
                address2: Gate no. 2
                city: Seattle
                country: United States
                county: King County
                fax: '123456'
                firstName: peter
