              schema:
                type: number
            RateLimit-Reset:
              description: 'The number of seconds until the quota resets for the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            Zuora-Request-Id:
              description: 'The Zuora internal identifier of the API call. You cannot control the value of this header.

                '
              schema:
                type: string
                maxLength: 36
                minLength: 36
            Zuora-Track-Id:
              description: 'A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.

                '
              schema:
                type: string
                maxLength: 64
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
              example:
                accountId: 6e767220676e6e61206776652075207570
                accountNumber: A00000001
                address1: 314, Bongora
                address2: near Tech City
                city: GHY
                country: India
                county: null
                fax: '6174'
                firstName: Kuhi
                homePhone: '1234123'
                id: 6b65657020726f6c6c696e672021
                lastName: Das
                mobilePhone: '123213'
                nickname: Dorimi
                otherPhone: '2314213'
                otherPhoneType: Work
                personalEmail: kuhiroll@example.com
                state: Assam
                taxRegion: null
                workEmail: null
                workPhone: null
                zipCode: '123456'
                contactDescription: This is a description for the contact
                success: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POSTContactType'
        required: true
  /v1/contacts/{contactId}:
    get:
      summary: Retrieve a contact
      operationId: GET_Contact
      description: Retrieves detailed information about a specific contact.
      tags:
