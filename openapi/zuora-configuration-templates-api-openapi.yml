definitions:
  MigrationClientResponse:
    description: Response after migration is added.
    properties:
      emailIds:
        description: 'List of Emails with comma separator '
        type: string
      environment:
        description: Environment information
        type: string
      id:
        description: Variable to hold the job ID.
        type: string
      migratedBy:
        description: User responsible for migration.
        example: Jane Cooper
        type: string
      migrationDescription:
        description: Description of the migration.
        example: Migration from/to Sandbox
        type: string
      migrationEnd:
        description: Timestamp when migration ended.
        example: '2020-11-01 18:00:00'
        type: string
      migrationName:
        description: Name of the migration.
        example: Job A
        type: string
      migrationStart:
        description: Timestamp when migration started.
        example: '2020-11-01 18:00:00'
        type: string
      response:
        items:
          $ref: '#/definitions/MigrationComponentContent'
        type: array
      sourceTenantDescription:
        description: Source Tenant Description.
        example: Duno
        type: string
      sourceTenantName:
        description: Source Tenant Name.
        example: Duno
        type: string
      status:
        description: Status of the Migration Job.
        example: IN PROGRESS
        type: string
      type:
        type: string
    required:
    - id
    - migratedBy
    - migrationDescription
    - migrationEnd
    - migrationName
    - migrationStart
    - sourceTenantDescription
    - sourceTenantName
    - status
    title: MigrationClientResponse
    type: object
  CompareSchemaKeyValue:
    description: When a comparison is made between a source and target tenant, it sends a response to the user interface.
    properties:
      difference:
        additionalProperties:
          items:
            type: string
          type: array
        description: Returns the different components list.
        type: object
      response:
        description: Provides the total reponse of the components.
        items:
          $ref: '#/definitions/MigrationComponentContent'
        type: array
      segregationKeys:
        description: Provides separation of components.
        items:
          type: string
        type: array
    title: CompareSchemaKeyValue
    type: object
  ConfigTemplateErrorResponse:
    example:
      reasons:
      - code: ObjectNotFound
        message: Configuration Templates does not exist.
    properties:
      reasons:
        items:
          properties:
            code:
              description: 'The error code of response.

                '
              type: string
            message:
              description: A detailed description of the error response.
              type: string
          type: object
        type: array
    type: object
  JsonNode:
    description: Json node object contains metadata.
    title: JsonNode
    type: object
  ConfigurationTemplateContent:
    description: It contains information about template schemas with segregation keys.
    properties:
      componentType:
        description: Type of Component.
        type: string
      error:
        description: Error Information.
        type: string
      id:
        description: Id of Each component.
        type: string
      key:
        description: Key value of fields inside component.
        type: string
      method:
        description: Http method which is used to retrieve the particular component.
        type: string
      payload:
        $ref: '#/definitions/JsonNode'
      result:
        description: Contains the response of details fetched regarding selected component.
        type: string
      segregationKey:
        description: Gives the difference between components and sub components.
        type: string
      templateId:
        description: Id of the Template.
        type: string
      url:
        description: Metadata is retrieved from this URL.
        type: string
    title: ConfigurationTemplateContent
    type: object
  CreateTemplateRequestContent:
    description: 'CreateTemplateRequestContent object contains information for creating template.

      '
    properties:
      content:
        $ref: '#/definitions/SettingSourceComponentResponse'
      customFields:
        description: Selected custom fields component or not.
        type: boolean
      customObjects:
        description: Selected custom objects component or not.
        type: boolean
      description:
        description: Creates template description.
        type: string
      name:
        description: Name of the Template.
        type: string
      notifications:
        description: Selected Notification component or not.
        type: boolean
      selectedComponents:
        description: ConfigurationTemplateContent object contains the selected meta data information.
        items:
          $ref: '#/definitions/ConfigurationTemplateContent'
        type: array
      settings:
        description: Selected Settings component or not.
        type: boolean
      templateTenant:
        description: ID of the template tenant.
        example: 80b3f8cd-5801-4ed7-bee7-ad1569916c2f
        type: string
      workflows:
        description: Selected Workflow component or not.
        type: boolean
    required:
    - description
    - name
    - templateTenant
    title: CreateTemplateRequestContent
    type: object
  CompareSchemaInfoResponse:
    description: When Tenant's Compare API returns a result, this object is used to send the response to UI.
    properties:
      customFields:
        items:
          $ref: '#/definitions/CompareSchemaKeyValue'
        type: array
      customObjects:
        items:
          $ref: '#/definitions/CompareSchemaKeyValue'
        type: array
      dataAccessControl:
        items:
          $ref: '#/definitions/CompareSchemaKeyValue'
        type: array
      metaData:
        $ref: '#/definitions/JsonNode'
      notifications:
        items:
          $ref: '#/definitions/CompareSchemaKeyValue'
        type: array
      productCatalog:
        items:
          $ref: '#/definitions/CompareSchemaKeyValue'
        type: array
      settings:
        items:
          $ref: '#/definitions/CompareSchemaKeyValue'
        type: array
      workflows:
        items:
          $ref: '#/definitions/CompareSchemaKeyValue'
        type: array
    title: CompareSchemaInfoResponse
    type: object
  SettingSourceComponentResponse:
    description: Provides details about the different components that need to be compared and deployed.
    properties:
      customFields:
        items:
          $ref: '#/definitions/SettingComponentKeyValue'
        type: array
      customObjects:
        items:
          $ref: '#/definitions/SettingComponentKeyValue'
        type: array
      dataAccessControl:
        items:
          $ref: '#/definitions/SettingComponentKeyValue'
        type: array
      notifications:
        items:
          $ref: '#/definitions/SettingComponentKeyValue'
        type: array
      productCatalog:
        items:
          $ref: '#/definitions/SettingComponentKeyValue'
        type: array
      settings:
        items:
          $ref: '#/definitions/SettingComponentKeyValue'
        type: array
      workflows:
        items:
          $ref: '#/definitions/SettingComponentKeyValue'
        type: array
    title: SettingSourceComponentResponse
    type: object
  SettingComponentKeyValue:
    description: Provides details about the individual components that need to be compared and deployed.
    properties:
      errors:
        items:
          type: string
        type: array
      originalPayload:
        $ref: '#/definitions/JsonNode'
      response:
        items:
          $ref: '#/definitions/ConfigurationTemplateContent'
        type: array
      segregationKeys:
        items:
          type: string
        type: array
    title: SettingComponentKeyValue
    type: object
  TemplateDetailResponse:
    description: Contains all template details.
    properties:
      active:
        description: Whether or not the template is active.
        type: boolean
      content:
        $ref: '#/definitions/SettingSourceComponentResponse'
      createdBy:
        description: Information about the user who created it.
        type: string
      createdOn:
        description: When it is created.
        type: string
      description:
        description: Template description which contains the information about the created template.
        type: string
      entityName:
        description: Name of the Entity
        type: string
      environment:
        description: Details of the environment in which the template was created.
        type: string
      errors:
        description: Error information.
        type: string
      id:
        description: Id of the template.
        type: string
      name:
        description: Name of the template.
        type: string
      status:
        description: The status of the template creation, such as whether it is in progress, completed, or failed.
        type: string
      tenantName:
        description: Tenant's name for whom the template is created.
        type: string
    title: TemplateDetailResponse
    type: object
  TemplateResponse:
    description: It contains a collection of all the templates that have been created.
    properties:
      templates:
        description: Contains list of template details.
        items:
          $ref: '#/definitions/TemplateDetailResponse'
        type: array
    title: TemplateResponse
    type: object
  TemplateMigrationClientRequest:
    description: 'Request to add a new Template migration.

      TemplateMigrationClientRequest object contains request details of target tenant, source tenant, and template information needed for migration.

      '
    properties:
      comments:
        type: string
      description:
        description: Description of the migration.
        example: Migration from/to Sandbox
        type: string
      emailIds:
        description: List of Emails with comma separator.
        example: abcd@zuora.com,xyz@zuora.com
        type: string
      entityUuid:
        description: Entity UUID
        example: 11111
        type: string
      metaData:
        $ref: '#/definitions/JsonNode'
        description: Meta data information of the source templates.
        example: ST 4
      name:
        description: Name of the migration.
        example: Job A
        type: string
      request:
        description: List of settings need to be migrated.
        example: ST 4
        items:
          $ref: '#/definitions/MigrationComponentContent'
        type: array
      sendEmail:
        description: Flag determines whether or not to send an email.
        example: true
        type: boolean
    required:
    - description
    - entityUuid
    - name
    - sendEmail
    title: TemplateMigrationClientRequest
    type: object
  MigrationComponentContent:
    description: When a comparison is made between a source and target tenant, it sends a response to the user interface.
    properties:
      attribute:
        type: string
      componentType:
        description: Type of selected components to be migrated.
        type: string
      currentTargetResponse:
        $ref: '#/definitions/JsonNode'
        description: Current Target Response to be migrated.
      description:
        type: string
      disabled:
        type: string
      errorMessage:
        description: Error information.
        type: string
      httpMethods:
        type: string
      id:
        type: string
      key:
        type: string
      migratedOn:
        description: It is the time when migration is triggered.
        format: date-time
        type: string
      migrationId:
        description: Migration ID. It is generated at the time of triggering deployment.
        type: string
      pathPattern:
        description: PathPattern of component.
        type: string
      previousTargetResponse:
        $ref: '#/definitions/JsonNode'
        description: It caches the previous target response, which can be helpful if you want to revert the migration.
      result:
        description: Returns the result details of Components.
        type: string
      segregationKey:
        description: Displays the differences between components.
        type: string
      sourceResponse:
        $ref: '#/definitions/JsonNode'
      status:
        description: Returns the status of each component.
        type: string
      updateStatus:
        description: Updated Status.
        type: string
    title: MigrationComponentContent
    type: object
parameters:
  GLOBAL_HEADER_Accept_Encoding:
    name: Accept-Encoding
    in: header
    required: false
    type: string
    description: "Include the `Accept-Encoding: gzip` header to compress responses as a gzipped file. It can significantly reduce the bandwidth required for a response. \n\nIf specified, Zuora automatically compresses responses that contain over 1000 bytes of data, and the response contains a `Content-Encoding` header with the compression algorithm so that your client can decompress it.\n"
  GLOBAL_HEADER_Zuora_Org_Ids:
    name: Zuora-Org-Ids
    in: header
    required: false
    type: string
    description: "Comma separated IDs. If you have <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Multi-Org\" target=\"_blank\">Zuora Multi-Org</a> enabled, \nyou can use this header to specify which orgs to perform the operation in. If you do not have Zuora Multi-Org enabled, you should not set this header.\n\nThe IDs must be a sub-set of the user's accessible orgs. If you specify an org that the user does not have access to, the operation fails.\n\nIf the header is not set, the operation is performed in scope of the user's accessible orgs.\n"
  GLOBAL_HEADER_Idempotency_Key:
    name: Idempotency-Key
    in: header
    required: false
    type: string
    maxLength: 255
    description: "Specify a unique idempotency key if you want to perform an idempotent POST or PATCH request. Do not use this header in other request types. \n\nWith this header specified, the Zuora server can identify subsequent retries of the same request using this value, which prevents the same operation from being performed multiple times by accident. \n"
  GLOBAL_HEADER_Content_Encoding:
    name: Content-Encoding
    in: header
    required: false
    type: string
    description: 'Include the `Content-Encoding: gzip` header to compress a request. With this header specified, you should upload a gzipped file for the request payload instead of sending the JSON payload.

      '
  GLOBAL_HEADER_Zuora_Entity_Ids_Single:
    name: Zuora-Entity-Ids
    in: header
    required: false
    type: string
    description: 'An entity ID. If you have [Zuora Multi-entity](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Multi-entity) enabled and the OAuth token is valid for more than one entity, you must use this header to specify which entity to perform the operation in. If the OAuth token is only valid for a single entity, or you do not have Zuora Multi-entity enabled, you do not need to set this header.

      '
  GLOBAL_HEADER_Zuora_Track_Id:
    name: Zuora-Track-Id
    in: header
    required: false
    type: string
    maxLength: 64
    description: 'A custom identifier for tracing the API call. If you set a value for this header, Zuora returns the same value in the response headers. This header enables you to associate your system process identifiers with Zuora API calls, to assist with troubleshooting in the event of an issue.


      The value of this field must use the US-ASCII character set and must not include any of the following characters: colon (`:`), semicolon (`;`), double quote (`"`), and quote (`''`).

      '
  GLOBAL_HEADER_Authorization_OAuth:
    name: Authorization
    in: header
    required: true
    type: string
    description: 'The value is in the `Bearer {token}` format where {token} is a valid OAuth token generated by calling [Create an OAuth token](/api-references/api/operation/createToken).

      '
