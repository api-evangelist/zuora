definitions:
  CommonResponseType:
    properties:
      processId:
        description: 'The Id of the process that handle the operation.

          '
        type: string
      reasons:
        items:
          properties:
            code:
              description: 'The error code of response.

                '
              type: string
            message:
              description: 'The detail information of the error response

                '
              type: string
          type: object
        type: array
      success:
        description: 'Indicates whether the call succeeded.

          '
        type: boolean
    type: object
  GETChargeDefinitionPricingTier:
    description: 'An array of charge pricing tiers.

      '
    items:
      properties:
        currency:
          description: 'The code corresponding to the currency for the tier''s price.

            '
          type: string
        discountAmount:
          description: 'The specific amount for a fixed discount. The field is applicable only for charges based on the Discount-Fixed Amount charge model.

            '
          format: double
          type: number
        discountPercentage:
          description: 'The percentage of discount for a percentage discount. The field is applicable only for charges based on the Discount-Percentage charge model.

            '
          format: double
          type: number
        endingUnit:
          description: 'The end number of a range of units for the tier. The field is applicable only for charges based on the Tiered Pricing or Tiered with Overage Pricing charge model.

            '
          format: double
          type: number
        overagePrice:
          description: 'Indicates whether the price is an overage price, which is the price when usage surpasses the last defined tier.

            '
          format: double
          type: number
        price:
          description: 'The price of the tier if the price format is flat fee, or the price of each unit in the tier if the price format is per unit.

            '
          format: double
          type: number
        startingUnit:
          description: 'The starting number of a range of units for the tier. The field is applicable only for charges based on the Tiered Pricing or Tiered with Overage Pricing charge model.

            '
          format: double
          type: number
      type: object
    title: pricingTiers
    type: array
  PUTProductChargeDefinitionBulkRequest:
    example:
      productChargeDefinitions:
      - billingPeriod: Specific_Months
        chargeModel: FlatFee
        defaultQuantity: 10
        listPriceBase: Per_Billing_Period
        prices:
        - currency: USD
          price: 10
        productChargeDefinitionKey: CD-00000037
        specificBillingPeriod: 10
        specificListPriceBase: 101
        taxCode: a valid tax code
        taxMode: TaxExclusive
        taxable: false
        term: 24
        termPeriodType: Month
        termType: TERMED
        uom: Each
    properties:
      productChargeDefinitions:
        description: 'The list of updated product charge definitions.

          '
        items:
          $ref: '#/definitions/PUTBulkProductChargeDefinitionRequest'
          title: productChargeDefinitions
        type: array
    type: object
  POSTChargeDefinitionRequestBulk:
    example:
      productChargeDefinitions:
      - billingPeriod: Specific_Months
        chargeModel: FlatFee
        defaultQuantity: 10
        effectiveEndDate: '2025-01-01 00:00:00'
        effectiveStartDate: '2024-01-01 00:00:00'
        listPriceBase: Per_Billing_Period
        prices:
        - currency: USD
          price: 10
        productRatePlanChargeId: 2c9890e489f227bd0189f22f3482001f
        productRatePlanChargeNumber: PRPC-00000015
        productRatePlanId: 2c9890e489f227bd0189f22c3c730002
        productRatePlanNumber: PRP-NEW-00000242
        specificBillingPeriod: 10
        specificListPriceBase: 101
        taxCode: a valid tax code
        taxMode: TaxExclusive
        taxable: false
        term: 24
        termPeriodType: Month
        termType: TERMED
        uom: Each
    properties:
      productChargeDefinitions:
        description: 'Container for the array of product charge definition.

          '
        items:
          $ref: '#/definitions/POSTChargeDefinitionRequest'
        type: array
    type: object
  GETDeliverySchedule:
    properties:
      frequency:
        description: 'The frequency of the delivery. Only weekly delivery is supported now.

          '
        enum:
        - Weekly
        type: string
      friday:
        description: 'The flag to indicate whether the delivery happens on Friday.

          '
        type: boolean
      monday:
        description: 'The flag to indicate whether the delivery happens on Monday.

          '
        type: boolean
      saturday:
        description: 'The flag to indicate whether the delivery happens on Saturday.

          '
        type: boolean
      sunday:
        description: 'The flag to indicate whether the delivery happens on Sunday.

          '
        type: boolean
      thursday:
        description: 'The flag to indicate whether the delivery happens on Thursday.

          '
        type: boolean
      tuesday:
        description: 'The flag to indicate whether the delivery happens on Tuesday.

          '
        type: boolean
      wendesday:
        description: 'The flag to indicate whether the delivery happens on Wendesday.

          '
        type: boolean
    title: DeliverySchedule
    type: object
  PUTBulkProductChargeDefinitionRequest:
    properties:
      billingPeriod:
        description: 'The override value of the billingPeriod for the product charge definition.

          '
        type: string
      billingTiming:
        description: 'The override value of the billingTiming for the product charge definition.

          '
        enum:
        - IN_ADVANCE
        - IN_ARREARS
        type: string
      chargeModel:
        description: 'Determines how to calculate charges. Charge models must be individually activated in Zuora Billing administration.

          '
        enum:
        - DiscountFixedAmount
        - DiscountPercentage
        - FlatFee
        - PerUnit
        - Tiered
        - Volume
        - Delivery
        type: string
      defaultQuantity:
        description: "The default quantity. \n\nThis field is applicable only for one-time and recurring charges.\n"
        type: number
      excludeItemBillingFromRevenueAccounting:
        description: "Indicates whether to exclude the related invoice items, invoice item adjustments, credit memo items, and debit memo items from revenue accounting.\n\n**Note**: This field is only available if you have the Order to Revenue or Billing - Revenue Integration feature enabled. \n"
        type: boolean
      excludeItemBookingFromRevenueAccounting:
        description: 'Indicates whether to exclude the related rate plan charges and order line items from revenue accounting.


          **Note**: This field is only available if you have the Order to Revenue or Billing - Revenue Integration feature enabled.

          '
        type: boolean
      isAllocationEligible:
        description: 'Indicates whether the charge segment is allocation eligible in revenue recognition. The default value is `false`.


          **Values**: `true`, `false`


          **Note**: This field is available only if you have the Additional Revenue Fields property enabled.

          '
        type: boolean
      isUnbilled:
        description: "Specifies how to perform the accounting during revenue recognition. The default value is `false`.\n\n**Values**: `true`, `false`\n\n**Note**: This field is available only if you have the Additional Revenue Fields property enabled.     \n"
        type: boolean
      listPriceBase:
        description: "The list price base. \n\nThis field is applicable only for recurring charges.\n\n**Note**: The `Per_Year` enum value is available only if you have the <a href=\"https://knowledgecenter.zuora.com/Billing/Subscriptions/Product_Catalog/I_Annual_List_Price\" target=\"_blank\">Annual List Price</a> feature enabled.\n"
        enum:
        - Per_Billing_Period
        - Per_Month
        - Per_Week
        - Per_Year
        type: string
      prices:
        description: 'Container for the new prices to override the existing prices of the product charge definition.

          '
        items:
          $ref: '#/definitions/POSTProductChargeDefinitionPricing'
        type: array
      productCategory:
        description: "This field is used to maintain the product category for integration with Zuora Revenue. \n\n**Note**: This field is available only if you have the Additional Revenue Fields property enabled.    \n"
        type: string
      productChargeDefinitionKey:
        description: 'The unique number or ID of the product charge definition to be updated.

          '
        type: string
      productClass:
        description: "This field is used to maintain the product class for integration with Zuora Revenue. \n\n**Note**: This field is available only if you have the Additional Revenue Fields property enabled.    \n"
        type: string
      productFamily:
        description: "This field is used to maintain the product family for integration with Zuora Revenue. \n\n**Note**: This field is available only if you have the Additional Revenue Fields property enabled.\n"
        type: string
      productLine:
        description: "This field is used to maintain the product line for integration with Zuora Revenue. \n\n**Note**: This field is available only if you have the Additional Revenue Fields property enabled.        \n"
        type: string
      specificBillingPeriod:
        description: 'The override value of the specificBillingPeriod for the product charge definition.

          '
        type: number
      specificListPriceBase:
        description: "The number of months for the list price base of the charge definition. \nThe field is `null` if the `listPriceBase` field is not set to `Per_Specific_Months`.\n"
        format: int32
        maximum: 200
        minimum: 1
        type: integer
      taxCode:
        description: 'Specifies the tax code for taxation rules. This field is equired when the `Taxable` field is set to `True`.


          **Note**: This value affects the tax calculation of the charge.

          '
        maxLength: 64
        type: string
      taxMode:
        description: 'Determines how to define taxation for the charge. This field is equired when the `Taxable` field is set to `True`.


          **Note**: This value affects the tax calculation of the charge.

          '
        enum:
        - TaxExclusive
        - TaxInclusive
        type: string
      taxable:
        description: 'Determines whether the charge definition is taxable. When this field is set to `True`, the `TaxMode` and `TaxCode` fields are required.


          **Character limit**: 5


          **Values**: `True`, `False`


          **Note**: This value affects the tax calculation of the charge.

          '
        type: boolean
      term:
        description: "The number of periods of a termed subscription that is eligible for this charge definition. This field is applicable when the `termType` field is set to `TERMED`, \nand is to be used together with the `termPeriodType` field.\n"
        type: number
      termPeriodType:
        description: 'Specifies the period type for the subscription term that is eligible for this charge definition.

          '
        enum:
        - Month
        - Year
        - Day
        - Week
        type: string
      termType:
        description: 'The type of the subscription that is eligible for this charge definition.

          '
        enum:
        - TERMED
        - EVERGREEN
        type: string
      uom:
        description: 'Describes the unit of measure (UOM) configured in **Settings > Billing**.


          **Values**: `Each`, `License`, `Seat`, or `null`

          '
        type: string
    type: object
  POSTProductChargeDefinitionPricing:
    properties:
      currency:
        description: 'The currency for the price.

          '
        type: string
      discountAmount:
        description: 'The specific amount for a fixed discount. The field is applicable only for charges based on the Discount-Fixed Amount charge model.

          '
        format: double
        type: number
      discountPercentage:
        description: 'The percentage of discount for a percentage discount. The field is applicable only for charges based on the Discount-Percentage charge model.

          '
        format: double
        type: number
      price:
        description: "The price of this item. \n\nThis field is only applicable for charges based on the following charge models:\n  - Flat Fee\n  - Per Unit\n  - Delivery Pricing\n"
        type: number
      tiers:
        description: "Container for the tiers of the price item. \n\nThis field is only applicable for charges based on the following charge models:\n  - Tiered Pricing\n  - Volume Pricing\n\nYou must specify all relevant fields of all tiers, including pricing information for each currency.\nFor each currency, ensure that the tiers appear in ascending order of `StartingUnit`.\n\nFor example:\n\n```\n[\n  {\n    \"startingUnit\": \"1\",\n    \"endingUnit\": \"150\",\n    \"currency\": \"USD\",\n    \"price\": 1.95,\n    \"priceFormat\": \"Per Unit\"\n  },\n  {\n    \"startingUnit\": \"151\",\n    \"endingUnit\": \"300\",\n    \"currency\": \"USD\",\n    \"price\": 1.45,\n    \"priceFormat\": \"Per Unit\"\n  },\n  {\n    \"startingUnit\": \"1\",\n    \"endingUnit\": \"150\",\n    \"currency\": \"EUR\",\n    \"price\": 1.75,\n    \"priceFormat\": \"Per Unit\"\n  },\n  {\n    \"startingUnit\": \"151\",\n    \"endingUnit\": \"300\",\n    \"currency\": \"EUR\",\n    \"price\": 1.30,\n    \"priceFormat\": \"Per Unit\"\n  }\n]\n```    \n"
        items:
          $ref: '#/definitions/POSTChargeDefinitionPricingTier'
        type: array
    title: prices
    type: object
  ProductChargeDefinitionObjectCustomFields:
    additionalProperties:
      description: 'Custom fields of the Product Charge Definition object. The name of each custom field has the form of <code>*customField*__c</code>. Custom field names are case sensitive. See [Manage Custom Fields](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Manage_Custom_Fields) for more information.

        '
    description: 'Container for custom fields of a Product Charge Definition object.

      '
    title: productChargeDefinitionFieldsCustom
    type: object
  PUTProductChargeDefinitionRequest:
    example:
      billingPeriod: Specific_Months
      defaultQuantity: 10
      effectiveEndDate: '2024-07-01 00:00:00'
      effectiveStartDate: '2024-01-01 00:00:00'
      listPriceBase: Per_Billing_Period
      prices:
      - currency: USD
        price: 15
      specificBillingPeriod: 5
