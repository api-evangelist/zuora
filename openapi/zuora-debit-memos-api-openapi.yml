              **Note**: This field is available only if you have the <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Bill_your_customers/E-Invoicing" target="_blank">E-Invoicing</a> feature in **Early Adopter** phase enabled.

              '
            type: string
          einvoiceFileId:
            description: 'The ID of the e-invoice file generated for the debit memo.


              **Note**: This field is available only if you have the <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Bill_your_customers/E-Invoicing" target="_blank">E-Invoicing</a> feature in **Early Adopter** phase enabled.

              '
            type: string
          einvoiceStatus:
            description: "The status of the e-invoice file generation for the debit memo. \n\n- If e-invoice file generation succeeds, both the error code and message are empty, and the `eInvoiceFileId` field stores the ID of the generated e-invoice file.\n- If a failure occurs during e-invoice file generation, an error code and an error message are returned respectively in the `einvoiceErrorCode` and `einvoiceErrorMessage` fields. \n\n**Note**: This field is available only if you have the <a href=\"https://knowledgecenter.zuora.com/Zuora_Billing/Bill_your_customers/E-Invoicing\" target=\"_blank\">E-Invoicing</a> feature in **Early Adopter** phase enabled.\n"
