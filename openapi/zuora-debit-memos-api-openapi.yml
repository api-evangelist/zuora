openapi: 3.2.0
info:
  version: '2023-12-15'
  title: Reference Debit Memos API
  description: '# Introduction


    Welcome to the REST API reference for the Zuora Billing, Payments, and Central Platform!'
  contact:
    email: docs@zuora.com
servers:
- url: https://rest.zuora.com/
tags:
- name: Debit Memos
  description: 'Debit memos increase the amount a customer owes. It is a separate document from the invoice. Debit memos can be used to correct undercharging on an invoice or to levy ad hoc charges outside the context of a subscription. Just like an invoice, debit memo balances can be settled by applying either a payment or a credit memo.


    For more information about debit memos, see Credit and debit memos.'
paths:
  /v1/debitmemos:
    post:
      description: '**Note:** This operation is only available if you have Invoice Settlement enabled. The Invoice Settlement feature is generally available as of Zuora Billing Release 296 (March 2021). This feature includes Unapplied Payments, Credit and Debit Memo, and Invoice Item Settlement. If you want to enable Invoice Settlement, see Invoice Settlement Enablement and Checklist Guide for more information.


        Creates an ad-hoc debit memo from a product rate plan charge. Zuora supports the creation of debit memos from any type of product rate plan charge. The charges can also have any amount and any charge model, except for discout charge models.


        When debit memos are created from product rate plan charges, the specified amount with decimal places is now validated based on the decimal places supported by each currency.


        You can create a debit memo only if you have the user permission. See Billing Roles for more information.'
      summary: Create a debit memo from a charge
      operationId: POST_DebitMemoFromPrpc
