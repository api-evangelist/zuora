        description: '[ZOQL](https://knowledgecenter.zuora.com/DC_Developers/K_Zuora_Object_Query_Language) expression that specifies the object to query, the fields to retrieve, and any filters.


          **Note:** When querying one time charges from ProductRatePlanCharge, you need to specify the `ChargeType` value as `One-Time` rather than `OneTime`.

          '
        type: string
    required:
    - queryString
    type: object
  ProxyActionqueryMoreResponse:
    properties:
      done:
        description: 'Indicates whether the returned records contain all the query results.

