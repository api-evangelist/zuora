                The `requiredAuth` and `requiredOauth2` fields cannot be `true` at the same time.

                '
              type: boolean
            requiredOauth2:
              description: "Indicates whether OAuth 2.0 authentication is enabled for the callout. If this field is `true`, you must specify the OAuth 2.0 provider ID in `oauth2ProviderId`.\n  \nThe `requiredAuth` and `requiredOauth2` fields cannot be `true` at the same time.\n"
              type: boolean
          required:
          - name
          - calloutBaseurl
          - httpMethod
          type: object
        calloutActive:
          default: false
          description: The status of the callout action. The default value is `false`.
          type: boolean
        communicationProfileId:
          description: "The profile that notification definition belongs to. \n\nYou can use the [Query Action](/api-references/api/operation/Action_POSTquery) to get the communication profile Id. See the following request sample:\n\n`{\n    \"queryString\": \"select Id, ProfileName from CommunicationProfile\"\n }`\n\nIf you do not pass the communicationProfileId, notification service will be automatically added to the 'Default Profile'.\n"
          type: string
        description:
          description: The description of the notification definition.
          maxLength: 255
          type: string
        emailActive:
          default: false
          description: The status of the email action. The default value is `false`.
          type: boolean
        emailTemplateId:
          description: The ID of the email template. If `emailActive` is `true`, an email template is required. And EventType of the email template MUST be the same as the eventType.
          format: uuid
          type: string
        eventTypeName:
          description: "The name of the event type. \n"
          minLength: 1
          type: string
        eventTypeNamespace:
          description: "The namespace of the `eventTypeName` field. The `eventTypeName` has the `user.notification` namespace by default. \n          \nFor example, if you want to create a notification definition on the `OrderActionProcessed` event, you must specify `com.zuora.notification` for this field.\n"
          type: string
        filterRule:
          description: ''
          properties:
            condition:
              description: 'The filter rule conditions, written in [JEXL](http://commons.apache.org/proper/commons-jexl/).

                The rule might contain event context merge fields and data source merge fields. Data source merge fields must be from [the base object of the event or from the joined objects of the base object](https://knowledgecenter.zuora.com/DC_Developers/M_Export_ZOQL#Data_Sources_and_Objects). Notifications with invalid merge fields will fail to evaluate, thus will not be invoked. For example, to filter an invoice posted notification to only invoices with an amount over 1000, you would define the following condition:


                ```Invoice.Amount > 1000```


                There are conventions and keywords you need to be aware of. For example:


                * `Invoice.Amount` refers to the `Amount` field of the Zuora object `Invoice`.


                * Unlike Event Triggers, there is no access to variables with the `_old` suffix. Fields with the `_old` suffix are only available on Event Trigger conditions.

                '
              example: Account.Balance >= _VIP_BALANCE_AMOUNT && Account.Status == _ACCOUNT_STATUS
              type: string
            description:
              description: The description of the filter rule.
              maxLength: 255
              type: string
            parameters:
              $ref: '#/components/schemas/FilterRuleParameterDefinitions'
          required:
          - condition
          - parameters
          type: object
        filterRuleParams:
          $ref: '#/components/schemas/FilterRuleParameterValues'
        name:
          description: The name of the notification definition, unique per communication profile.
          maxLength: 255
          type: string
      required:
      - eventTypeName
      - name
      type: object
    POSTCreateOrUpdateEmailTemplateRequest:
      example:
        allowPartialSuccess: true
        emailTemplates:
        - active: true
          bccEmailAddress: user@example.com
          ccEmailAddress: user@example.com
          ccEmailType: SpecificEmails
          description: Email when an account is edited
          emailBody: Dear user,<p>the account <Account.Name> has been edited. </p><p>Example Co. Ltd.</p>
          emailSubject: Account <Account.Number> has been edited
          encodingType: UTF8
          eventTypeName: AccountEdit
          fromEmailType: TenantEmail
          fromName: Example Co. Ltd.
          id: 8500105b9a1045019474652bd81c7ce5
          isHtml: true
          name: Account Edit Email
          replyToEmailType: TenantEmail
          toEmailAddress: DummyEmailAddress@example.com
          toEmailType: SpecificEmails
        - active: true
          bccEmailAddress: ''
          ccEmailAddress: user@example.com
          ccEmailType: SpecificEmails
          description: Updated Description
          emailBody: 'Dear <BillToContact.FirstName> <BillToContact.LastName>,


            A refund of <Refund.Amount> <Account.Currency> was processed against your credit memo on <Refund.Date>.


            Your new account unapplied credit memo amount is <Account.UnappliedCreditMemoAmount> <Account.Currency> and your account balance is <Account.Balance> <Account.Currency>.


            Thank you for your business!'
          emailSubject: Your credit memo refund was successfully processed
          encodingType: UTF8
          eventCategory: 2830
          fromEmailAddress: support@zuora.com
          fromEmailType: SpecificEmail
          fromName: Admin
          isHtml: true
          name: Credit Memo Refund Processed Default Email Template
          replyToEmailAddress: support@zuora.com
          replyToEmailType: SpecificEmail
          toEmailAddress: ''
          toEmailType: BillToContact
      properties:
        allowPartialSuccess:
          description: 'When set to `false`, the call will fail if one or multiple instances fail to import, and a `200` response is returned if all email templates have been successfully updated.

            When set to `true`, a success (`200`) response is returned if one or more instances have imported successfully. All failed instances are also returned in the response.

            '
          type: boolean
        emailTemplates:
          description: 'A container for email templates.

            '
          items:
            $ref: '#/components/schemas/POSTCreateOrUpdateEmailTemplateRequestFormat'
          type: array
      type: object
    POSTPublicEmailTemplateRequest:
      example:
        active: true
        bccEmailAddress: user@example.com
        ccEmailAddress: user@example.com
        ccEmailType: SpecificEmails
        description: Email when an account is edited
        emailBody: Dear user,<p>the account <Account.Name> has been edited. <p>Example Co. Ltd.
        emailSubject: Account <Account.Number> has been edited
        encodingType: UTF8
        eventTypeName: AccountEdit
        fromEmailAddress: null
        fromEmailType: TenantEmail
        fromName: Example Co. Ltd.
        isHtml: true
        name: Account Edit Email
        replyToEmailAddress: null
        replyToEmailType: TenantEmail
        toEmailAddress: null
        toEmailType: BillToContact
      properties:
        active:
          default: true
          description: The status of the email template. The default value is `true`.
          type: boolean
        bccEmailAddress:
          description: The email bcc address.
          format: email
          type: string
        ccEmailAddress:
          description: The email CC address.
          type: string
        ccEmailType:
          default: SpecificEmails
          description: "Email CC type.\n* When the base object for the event is associated with `Account`, `ccEmailType` can be any values in the enum list. \n* When the base object for the event is not associated with `Account`, `ccEmailType` must be `TenantAdmin`, `RunOwner`, or `SpecificEmail`. "
          enum:
          - BillToContact
          - SoldToContact
          - SpecificEmails
          - TenantAdmin
          - BillToAndSoldToContacts
          - RunOwner
          - AllContacts
          - InvoiceOwnerBillToContact
          - InvoiceOwnerSoldToContact
          - InvoiceOwnerBillToAndSoldToContacts
          - InvoiceOwnerAllContacts
          type: string
        description:
          description: The description of the email template.
          maxLength: 255
          type: string
        emailBody:
          description: "The email body. You can add merge fields in the email object using angle brackets. \nYou can also embed HTML tags if `isHtml` is `true`."
          type: string
        emailSubject:
          description: The email subject. Users can add merge fields in the email subject using angle brackets.
          type: string
        encodingType:
          default: UTF8
          description: The endcode type of the email body.
          enum:
          - UTF8
          - Shift_JIS
          - ISO_2022_JP
          - EUC_JP
          - X_SJIS_0213
          type: string
        eventCategory:
          description: "If you specify this field, the email template is created based on a standard event. See [Standard Event Categories](https://knowledgecenter.zuora.com/Central_Platform/Notifications/A_Standard_Events/Standard_Event_Category_Code_for_Notification_Histories_API) for all standard event category codes. \n"
          type: number
        eventTypeName:
          description: 'The name of the custom event or custom scheduled event. If you specify this field, the email template is created based on the corresponding custom event or custom scheduled event.

            '
          type: string
        eventTypeNamespace:
          description: "The namespace of the `eventTypeName` field. The `eventTypeName` has the `user.notification` namespace by default. \n\nNote that if the `eventTypeName` is a standard event type, you must specify the `com.zuora.notification` namespace; otherwise, you will get an error.\n\nFor example, if you want to create an email template on the `OrderActionProcessed` event, you must specify `com.zuora.notification` for this field.         \n"
          type: string
        fromEmailAddress:
          description: If fromEmailType is SpecificEmail, this field is required.
          type: string
        fromEmailType:
          description: The type of the email.
          enum:
          - TenantEmail
          - RunOwner
          - SpecificEmail
          type: string
        fromName:
          description: The name of the email sender.
          type: string
        isHtml:
          default: false
          description: Indicates whether the style of email body is HTML. The default value is `false`.
          type: boolean
        name:
          description: The name of the email template, a unique name in a tenant.
          maxLength: 255
          type: string
        replyToEmailAddress:
          description: If replyToEmailType is SpecificEmail, this field is required.
          type: string
        replyToEmailType:
          description: Type of the replyTo email.
          enum:
          - TenantEmail
          - RunOwner
          - SpecificEmail
          type: string
        toEmailAddress:
          description: If toEmailType is SpecificEmail, this field is required.
          type: string
        toEmailType:
          description: "Email receive type.\n* When the base object for the event is associated with `Account`, `toEmailType` can be any values in the enum list. \n* When the base object for the event is not associated with `Account`, `toEmailType` must be `TenantAdmin`, `RunOwner`, or `SpecificEmail`. "
          enum:
          - BillToContact
          - SoldToContact
          - SpecificEmails
          - TenantAdmin
          - BillToAndSoldToContacts
          - RunOwner
          - AllContacts
          - InvoiceOwnerBillToContact
          - InvoiceOwnerSoldToContact
          - InvoiceOwnerBillToAndSoldToContacts
          - InvoiceOwnerAllContacts
          type: string
      required:
      - name
      - fromEmailType
      - emailSubject
      - emailBody
      - toEmailType
      type: object
