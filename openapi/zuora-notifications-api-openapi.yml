        allowEmptyValue: true
        schema:
          type: integer
          format: int32
          default: 1
      - name: limit
        in: query
        description: The maximum number of results the query should return.
        allowEmptyValue: true
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: profileId
        in: query
        description: Id of the profile.
        allowEmptyValue: true
        schema:
          type: string
          format: uuid
      - name: eventTypeName
        in: query
        description: The name of the event.
        allowEmptyValue: true
        schema:
          type: string
      - name: emailTemplateId
