        required: false
        schema:
          type: string
          format: date-time
      - name: startTime
        in: query
        description: The initial date and time of records to be returned. Defaults to (end time - 1 day). Use format yyyy-MM-ddTHH:mm:ss. The maximum date range (endTime - startTime) is three days.
        required: false
        schema:
          type: string
          format: date-time
