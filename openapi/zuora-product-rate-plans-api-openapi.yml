                    specificListPriceBase: null
                    billingTiming: IN_ADVANCE
                    billingPeriod: Month
                    billingPeriodAlignment: AlignToCharge
                    specificBillingPeriod: null
                    smoothingModel: null
                    numberOfPeriods: null
                    overageCalculationOption: null
