            description: 'The target account or subscriptions for this bill run. You can only specify either this field or the `batches` field.

              '
            items:
              $ref: '#/components/schemas/BillRunFilterRequestType'
            type: array
          billRunType:
            description: "The type of the bill run. If you do not specify any value for this field, the default value is `Regular`.\n\n- You can use this field only if the \"Catch-Up Bill Run\" feature is enabled. \n- You must specify this field to create a catch up bill run.\n\n**Values:** \n- `Regular`\n- `CatchUp`\n"
            type: string
          chargeTypeToExclude:
            description: 'The types of the charges to be excluded from the generation of billing documents. You can specify at most two charge types in the array.

              '
            items:
              enum:
              - OneTime
              - Recurring
              - Usage
