  /v1/bill-runs/{billRunId}/cancel:
    put:
      summary: Cancel a bill run
      operationId: PUT_CancelBillRun
      description: 'Cancels a bill run in Draft status.


        When cancelling a scheduled bill run, keep the following information in mind:

        - If you set `cancelOnce` to `true`, only the current bill run is cancelled. The other future scheduled bill runs will be automatically executed based on the schedule.

        - If you set `cancelOnce` to `false`, all future recurring bill runs are cancelled.'
      tags:
      - Bill Run
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth_optional'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Org_Ids'
      - name: billRunId
        in: path
        required: true
        description: 'The unique ID of a bill run.

          '
        schema:
          type: string
      responses:
        '200':
          headers:
            Content-Encoding:
              description: "This header is returned if you specify the `Accept-Encoding: gzip` request header and the response contains over 1000 bytes of data.\n\nNote that only the following MIME types support gzipped responses:\n  - `application/json`\n  - `application/xml`\n  - `text/html`\n  - `text/csv`\n  - `text/plain`\n"
              schema:
                type: string
            RateLimit-Limit:
              description: 'The request limit quota for the time window closest to exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: string
            RateLimit-Remaining:
              description: 'The number of requests remaining in the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            RateLimit-Reset:
              description: 'The number of seconds until the quota resets for the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            Zuora-Request-Id:
              description: 'The Zuora internal identifier of the API call. You cannot control the value of this header.

                '
              schema:
                type: string
                maxLength: 36
                minLength: 36
            Zuora-Track-Id:
              description: 'A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.

                '
              schema:
                type: string
                maxLength: 64
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelBillRunResponseType'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cancelOnce:
                  type: boolean
                  default: true
                  description: 'Whether to cancel the current bill run or cancel all future recurring bill runs, only valid for a scheduled bill run.

                    '
              example:
                cancelOnce: true
        required: true
  /v1/bill-runs/{billRunKey}/emails:
    post:
      summary: Email billing documents generated from a bill run
      operationId: POST_EmailBillingDocumentsfromBillRun
      description: 'Manually emails all the billing documents that are generated from a specified bill run to your customers.


        Bill runs can generate invoices and credit memos based on your invoice and credit memo generation rule. Credit memos are only available if you have the Invoice Settlement feature enabled.


        Using this API operation, the billing documents are sent to the email addresses specified in the **To Email** field of the email templates. The email template used for each billing document is set in the **Delivery Options** panel of the **Edit notification** dialog from the Zuora UI. See Edit Email Templates for more information about how to edit the **To Email** field in the email template.


        ### Notes

        - Even though no field is required in the Request body, you still need to specify `{}` in the request. Otherwise, an error will be returned.


        - You can only email posted billing documents.


        - You must activate the following notifications before emailing invoices and credit memos:

        - **Manual Email For Invoice | Manual Email For Invoice**

        - **Email Credit Memo | Manually email Credit Memo**


        - To include the invoice PDF in the email, select the **Include Invoice PDF** check box in the **Edit notification** dialog from the Zuora UI. To include the credit memo PDF in the email, select the **Include Credit Memo PDF** check box in the **Edit notification** dialog from the Zuora UI. See Create and Edit Notifications for more information.


        - Zuora sends the email messages based on the email template you set. You can set the email template to use in the **Delivery Options** panel of the **Edit notification** dialog from the Zuora UI. By default, the following templates are used for billing documents:

        - Invoices: **Invoice Posted Default Email Template**

        - Credit memos: **Manual Email for Credit Memo Default Template**


        See Create and Edit Email Templates for more information.'
      tags:
      - Bill Run
      responses:
        '200':
          headers:
            Content-Encoding:
              description: "This header is returned if you specify the `Accept-Encoding: gzip` request header and the response contains over 1000 bytes of data.\n\nNote that only the following MIME types support gzipped responses:\n  - `application/json`\n  - `application/xml`\n  - `text/html`\n  - `text/csv`\n  - `text/plain`\n"
              schema:
                type: string
            RateLimit-Limit:
              description: 'The request limit quota for the time window closest to exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: string
            RateLimit-Remaining:
              description: 'The number of requests remaining in the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            RateLimit-Reset:
              description: 'The number of seconds until the quota resets for the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            Zuora-Request-Id:
              description: 'The Zuora internal identifier of the API call. You cannot control the value of this header.

                '
              schema:
                type: string
                maxLength: 36
                minLength: 36
            Zuora-Track-Id:
              description: 'A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.

                '
              schema:
                type: string
                maxLength: 64
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponseType'
              example:
                success: true
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Idempotency_Key'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth_optional'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Org_Ids'
      - name: billRunKey
        in: path
        required: true
        description: 'The ID or number of the bill run. For example, 2c92c8f95d0c886e015d11287a8f0f8b or BR-00000001.

          '
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POSTEmailBillingDocfromBillRunType'
        required: true
components:
  schemas:
    BillRunFilterRequestType:
      allOf:
      - properties:
          accountId:
            description: "The target account of the bill run. \n\nIf multiple subscriptions are specified, the account ID must be the same.\n"
            type: string
          filterType:
            description: 'To create bill runs at account level or subscription level.

              '
            enum:
            - Account
            - Subscription
            type: string
          subscriptionId:
            description: "The target subscripiton ID of the account. \n\nIf you set the `filterType` field to `Subscription`, you must specify the `subscriptionId` field.\n"
            type: string
        required:
        - accountId
        - filterType
        type: object
      title: billRunFilters
    NextRunResponseType:
      allOf:
      - description: 'Container about information about the next bill run to be executed.

          '
        properties:
          autoEmail:
            description: 'Whether to automatically send emails after Auto-Post is complete.

              '
            type: boolean
          autoPost:
            description: 'Whether to automatically post the bill run after the bill run is created.

              '
            type: boolean
          autoRenewal:
            description: 'Whether to automatically renew auto-renew subscriptions that are up for renewal.

              '
            type: boolean
          batches:
            description: "The batch of accounts for this bill run. \n\n**Values:** `AllBatches` or an array of `Batch`*n* where *n* is one of numbers 1 - 50, for example, `Batch7`.\n"
            items:
              type: string
            type: array
          billCycleDay:
            description: "The day of the bill cycle. This field is only valid if the `batches` field is specified.\n\n**Values:** \n- `AllBillCycleDays` or one of numbers 1 - 31 for an ad-hoc bill run\n- `AllBillCycleDays`, one of numbers 1 - 31, or `AsRunDay` for a scheduled bill run\n"
            type: string
          billRunFilters:
            description: "The target account or subscriptions for this bill run. \n"
            items:
              $ref: '#/components/schemas/BillRunFilterResponseType'
            type: array
          billRunNumber:
            description: 'The number of the bill run.

              '
            type: string
          chargeTypeToExclude:
            description: 'The types of the charges to be excluded from the generation of billing documents.

              '
            items:
              enum:
              - OneTime
              - Recurring
              - Usage
              type: string
            type: array
          createdById:
            description: 'The ID of the user who created the bill run.

              '
            type: string
          createdDate:
            description: 'The date and time when the bill run was created.

              '
            format: date-time
            type: string
          id:
            description: 'The ID of the bill run.

              '
            type: string
          invoiceDate:
            description: 'The invoice date for this bill run, only valid for ad-hoc bill runs.

              '
            format: date
            type: string
          invoiceDateOffset:
            description: 'The offset compared to the bill run execution date, only valid for scheduled bill runs.

              '
            type: integer
          noEmailForZeroAmountInvoice:
            description: "Whether to suppress emails for invoices with zero total amount generated in this bill run after the bill run is complete. \n"
            type: boolean
          schedule:
            $ref: '#/components/schemas/BillRunScheduleResponseType'
          scheduledExecutionTime:
            description: 'The scheduled execution time for the bill run.

              '
            format: date-time
            type: string
          status:
            description: 'The status of the bill run.

              '
            enum:
            - Pending
            - Processing
            - Completed
            - Error
            - Canceled
            - Posted
            - PostInProgress
            - CancelInProgress
            - RemoveInProgress
            - Paused
            type: string
          targetDate:
            description: 'The target date for this bill run, only valid for ad-hoc bill runs.

              '
            format: date
            type: string
          targetDateOffset:
            description: 'The offset compared to the bill run execution date, only valid for scheduled bill runs.

              '
            type: integer
          updatedById:
            description: 'The ID of the user who last updated the bill run.

              '
            type: string
          updatedDate:
            description: 'The date and time when the bill run was last updated.

              '
            format: date-time
            type: string
        type: object
      example:
        autoEmail: false
        autoPost: false
        autoRenewal: false
        batches: null
        billCycleDay: null
        billRunFilters:
        - accountId: 2c9081a03c63c94c013c66688a2c00bf
          filterType: Subscription
          subscriptionId: 402882297e387c51017e38a245c313db
        billRunNumber: BR-00000016
        chargeTypeToExclude:
        - OneTime
        - Usage
        createdById: ff808081298c6e5401298c7274a40005
        createdDate: '2022-01-24 19:58:27'
        id: 2c9890077e8a8490017e8bf3a5171a43
        invoiceDate: '2020-02-01'
        invoiceDateOffset: null
        noEmailForZeroAmountInvoice: false
        schedule: null
        scheduledExecutionTime: null
        status: Pending
        success: true
        targetDate: '2020-02-01'
        targetDateOffset: null
        updatedById: ff808081298c6e5401298c7274a40005
        updatedDate: '2022-01-24 19:58:27'
      title: nextRun
    POSTEmailBillingDocfromBillRunType:
      example:
        resend: 'true'
      properties:
