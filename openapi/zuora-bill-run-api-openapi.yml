openapi: 3.2.0
info:
  version: '2023-12-15'
  title: Reference Bill Run API
  description: '# Introduction


    Welcome to the REST API reference for the Zuora Billing, Payments, and Central Platform!'
  contact:
    email: docs@zuora.com
servers:
- url: https://rest.zuora.com/
tags:
- name: Bill Run
  description: 'Use the Bill Run call to create ad hoc bill runs and Post, Cancel, Query, and Delete bill runs.


    For more information about bill runs, see Bill runs.'
paths:
  /v1/bill-runs:
    post:
      summary: Create a bill run
      operationId: POST_CreateBillRun
      description: 'Creates an ad-hoc bill run or a scheduled bill run.

        - Support to create ad-hoc or scheduled bill runs by batch

        - Support to create ad-hoc or scheduled bill runs for a single account (all subscriptions under this account)

        - Support to create a bill run by subscription (50 or less subscriptions under the same account)


        To use this operation, you must have the Create Bill Runs billing permission.


        **Restrictions and limitations**


        When using this operation to create bill runs, keep the following restrictions and limitations in mind:

        - When creating batch-level bill runs, you must specify `batches` and cannot specify `billRunFilters`.

        - When creating account-level bill runs, you must specify `billRunFilters` and cannot specify `batches`. Only one single account is allowed.

        - When creating subscription-level bill runs, you must specify `billRunFilters` and cannot specify `batches`. All subscriptions must belong to the same account. At most 50 subscriptions are allowed.

        - If more than 500 bill runs created through this operation are in `Pending` status, you cannot use this operation to create any more bill runs.'
      tags:
      - Bill Run
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Idempotency_Key'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth_optional'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Org_Ids'
      responses:
        '200':
          headers:
            Content-Encoding:
              description: "This header is returned if you specify the `Accept-Encoding: gzip` request header and the response contains over 1000 bytes of data.\n\nNote that only the following MIME types support gzipped responses:\n  - `application/json`\n  - `application/xml`\n  - `text/html`\n  - `text/csv`\n  - `text/plain`\n"
              schema:
                type: string
            RateLimit-Limit:
              description: 'The request limit quota for the time window closest to exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: string
            RateLimit-Remaining:
              description: 'The number of requests remaining in the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            RateLimit-Reset:
              description: 'The number of seconds until the quota resets for the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            Zuora-Request-Id:
              description: 'The Zuora internal identifier of the API call. You cannot control the value of this header.

                '
              schema:
                type: string
                maxLength: 36
                minLength: 36
            Zuora-Track-Id:
              description: 'A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.

                '
              schema:
                type: string
                maxLength: 64
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBillRunResponseType'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POSTCreateBillRunRequestType'
        required: true
  /v1/bill-runs/{billRunId}/post:
    put:
      summary: Post a bill run
      operationId: PUT_PostBillRun
      description: 'Posts a bill run asynchronously. To post a bill run, the current bill run must be in `Completed` status.


        When a bill run is being posted, its status is changed to `PostInProgress`. After all invoices for this bill run are posted, its status is changed to `Posted`.'
