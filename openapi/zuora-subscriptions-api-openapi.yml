  /v1/subscriptions/{subscription-key}/renew:
    put:
      summary: Renew a subscription
      operationId: PUT_RenewSubscription
      description: 'Renews a termed subscription using existing renewal terms.

        When you renew a subscription, the current subscription term is extended by creating a new term.

        If any charge in your subscription has the billing period set as `SubscriptionTerm`， a new charge segment is generated for the new term.


        **Note**: If you have the Invoice Settlement feature enabled, it is best practice to set the `zuora-version` parameter to `211.0` or later available versions. Otherwise, an error occurs.'
      tags:
      - Subscriptions
