              '
            type: boolean
          listPriceBase:
            description: 'The list price base for the product rate plan charge.


              Values:


              * `Per_Billing_Period`

              * `Per_Month`

              * `Per_Week`

              * `Per_Year`

              * `Per_Specific_Months`

