            * If the subscription ends before the specific end date, the charge ends when the subscription ends. But if the subscription end date is subsequently changed through a Renewal, or Terms and Conditions amendment, the charge will end on the specific end date.

            '
          format: date
          type: string
        specificListPriceBase:
          description: "The number of months for the list price base of the charge. This field is required if you set the value of the `listPriceBase` field to `Per_Specific_Months`.\n\n**Note**: \n  - This field is available only if you have the <a href=\"https://knowledgecenter.zuora.com/Billing/Subscriptions/Product_Catalog/I_Annual_List_Price\" target=\"_blank\">Annual List Price</a> feature enabled.\n  - The value of this field is `null` if you do not set the value of the `listPriceBase` field to `Per_Specific_Months`.\n"
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        tiers:
          description: 'Container for Volume, Tiered, or Tiered with Overage charge models. Supports the following charge types:


            * One-time

            * Recurring

            * Usage-based

            '
          items:
            $ref: '#/definitions/POSTTierType'
          type: array
        triggerDate:
          description: 'Specifies when to start billing the customer for the charge. Required if the `triggerEvent` field is set to `USD`.

