              * `ONETIMEUSAGE`

              * `RECURRINGUSAGE`

              * `ONETIMERECURRINGUSAGE`

              '
            type: string
          billCycleDay:
            description: 'Sets the bill cycle day (BCD) for the charge. The BCD determines which day of the month the customer is billed.


              Values: `1`-`31`

