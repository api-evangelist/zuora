openapi: 3.2.0
info:
  version: '2023-12-15'
  title: Reference Accounts API
  description: '# Introduction


    Welcome to the REST API reference for the Zuora Billing, Payments, and Central Platform!'
  contact:
    email: docs@zuora.com
servers:
- url: https://rest.zuora.com/
tags:
- name: Accounts
  description: Some operations in this section are similar to each other, but are provided for different use scenarios.
paths:
  /v1/accounts:
    post:
      summary: Create an account
      operationId: POST_Account
      description: 'Creates a customer account with a payment method, a bill-to contact, and an optional sold-to contact. Request and response field descriptions and sample code are provided. Use this operation to optionally create a subscription, invoice for that subscription, and collect payment through the default payment method. The transaction is atomic; if any part fails for any reason, the entire transaction is rolled back.


        This operation is CORS Enabled, so you can use client-side Javascript to invoke the call.


        ### Notes

        1. The account is created in active status.

        2. If the `autoPay` field is set to `true` in the request, you must provide one of the `paymentMethod`, `creditCard`, or `hpmCreditCardPaymentMethodId` field, but not multiple. The one provided becomes the default payment method for this account. If the credit card information is declined or cannot be verified, no account is created.

        3. Customer accounts created with this call are automatically be set to Auto Pay.

        4. If the `invoiceDeliveryPrefsEmail` field is not specified in the request, the account''s email delivery preference is always automatically set to `false`, no matter whether the `workEmail` or `personalEmail` field is specified.


        ### Defaults for customerAcceptanceDate and serviceActivationDate

        Default values for **customerAcceptanceDate** and **serviceActivationDate** are set as follows.


        | | serviceActivationDate(SA) specified | serviceActivationDate (SA) NOT specified |

        | ------------- |:-------------:| -----:|

        | customerAcceptanceDate (CA) specified | SA uses value in the request call; CA uses value in the request call| CA uses value in the request call;SA uses CE as default |

        | customerAcceptanceDate (CA) NOT specified | SA uses value in the request call; CA uses SA as default | SA and CA use CE as default |'
      tags:
      - Accounts
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Idempotency_Key'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth_optional'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Org_Ids'
      - name: zuora-version
        in: header
        required: false
        description: "The minor version of the Zuora REST API. \n\nYou only need to set this parameter if you use the following fields:\n* invoice\n* collect\n* runBilling\n* targetDate\n"
        schema:
          type: string
      responses:
        '200':
          headers:
            Content-Encoding:
              description: "This header is returned if you specify the `Accept-Encoding: gzip` request header and the response contains over 1000 bytes of data.\n\nNote that only the following MIME types support gzipped responses:\n  - `application/json`\n  - `application/xml`\n  - `text/html`\n  - `text/csv`\n  - `text/plain`\n"
              schema:
                type: string
            RateLimit-Limit:
              description: 'The request limit quota for the time window closest to exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: string
            RateLimit-Remaining:
              description: 'The number of requests remaining in the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            RateLimit-Reset:
              description: 'The number of seconds until the quota resets for the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
              schema:
                type: number
            Zuora-Request-Id:
              description: 'The Zuora internal identifier of the API call. You cannot control the value of this header.

                '
              schema:
                type: string
                maxLength: 36
                minLength: 36
            Zuora-Track-Id:
              description: 'A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.

                '
              schema:
                type: string
                maxLength: 64
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POSTAccountResponseType'
              example:
                success: true
                accountId: 402892c74c9193cd014c96bbe7c101f9
                accountNumber: A00000004
                billToContactId: 2c92c8fb68a28d180168a7ccedba1c4c
                soldToContactId: 2c92c8fb68a28d180168a7ccedc61c4e
                paymentMethodId: 402892c74c9193cd014c96bbe7d901fd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POSTAccountType'
        required: true
  /v1/accounts/{account-key}:
    get:
      summary: Retrieve an account
      operationId: GET_Account
      description: 'Retrieves basic information about a customer account.


        This operation is a quick retrieval that doesn''t include the account''s subscriptions, invoices, payments, or usage details. Use Get account summary to get more detailed information about an account.'
