        project:
          description: "The project field contains the unique ID of a data integration project for a particular partner. The dropdown list of this field displays project IDs for the past thirty days.\n\nThis field must be used together with partner field to uniquely identify a data integration target. \n\nThis field is required only if you are using AQuA in stateful mode. Otherwise, if you are using AQuA in stateless mode, partner field can be null.\n"
          type: string
        sourceData:
          description: 'Indicates the source this aggregate query runs against:


            * `LIVE` represents the live transactional databases at Zuora (Data Query Live).


            * `WAREHOUSE` represents Zuora Warehouse, which has better performance and fewer limitations than the live transactional database. For more information, see <a href="https://knowledgecenter.zuora.com/Zuora_Central_Platform/Zuora_Warehouse/A_Zuora_Warehouse_overview" target="_blank">Zuora Warehouse</a>.

            '
          type: string
        status:
          description: 'The status of the AQuA job:

            - submitted: The AQuA job was submitted to the query executor for processing.

            - executing: The AQuA job is being processed.

            - completed: The AQuA job was successfully executed.

            - error: The AQuA job was not processed because of validation errors.

            - aborted: The AQuA job execution failed because one or more queries of this job failed.

            - cancelled: The AQuA job was cancelled.

            '
          enum:
          - submitted
          - executing
          - completed
          - error
          - aborted
          - cancelled
          type: string
        useLastCompletedJobQueries:
          description: 'If this flag is set to `true`, then all the previous queries are merged with existing queries.


            If the flag is set to `false`, then the previous queries are ignored, and only the new query is executed.

            '
          type: boolean
        version:
          description: "The API version you want to use. \n\nThe supported versions are as follows:\n  - `1.1`. It supports both modes\n  - `1.0`. Default. It supports stateless modes only.\n\nSee <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/API/AB_Aggregate_Query_API/BA_Stateless_and_Stateful_Modes\" target=\"_blank\">Stateless and stateful modes</a> for more information.\n"
