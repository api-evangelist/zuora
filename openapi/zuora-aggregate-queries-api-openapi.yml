    BatchQuery:
      properties:
        apiVersion:
          description: 'The API version for the query. If an API version is not specified, the latest version is used by default. Using the latest WSDL version is most useful for reporting use cases. For integration purposes, specify the WSDL version to ensure consistent query behavior, that is, what is supported and included in the response returned by the API.


            **Note**: As of API version 69 and later, Zuora changed the format of certain fields. See <a href="https://knowledgecenter.zuora.com/Zuora_Central_Platform/API/G_SOAP_API/AB_Getting_started_with_the__SOAP_API/C_Date_Field_Changes_in_the_SOAP_API" target="_blank">Date Field Changes in the SOAP API</a> for more information and a list of affected fields.

            '
          type: string
        convertToCurrencies:
          description: 'The currencies that you want to convert transaction amounts into. You can specify any number of currencies. Specify the currencies using their <a href="https://knowledgecenter.zuora.com/Quick_References/Country%2C_State%2C_and_Province_Codes/D_Currencies_and_Their_3-Letter_Codes" target="_blank">ISO currency codes</a> and separate each currency with a comma, for example, "EUR,GBP,JPY".


            See <a href="https://knowledgecenter.zuora.com/Zuora_Collect/Zuora_Finance/D_Finance_Settings/F_Foreign_Currency_Conversion/Foreign_Currency_Conversion_for_Data_Source_Exports#Creating_the_Data_Source_Export_Using_the_AQuA_API" target="_blank">Convert Transaction Amounts Into Any Currency</a> for more information and examples.


            To use this field, you must have <a href="https://knowledgecenter.zuora.com/Zuora_Collect/Zuora_Finance/D_Finance_Settings/F_Foreign_Currency_Conversion" target="_blank">Foreign Currency Conversion</a> enabled and you must be using API version 78 or later.

            '
          type: string
        deleted:
          description: 'This field indicates that the AQuA incremental load will retrieve deleted records.


            If you want to export deleted data, this field is required.


            **Note**: AQuA API is subject to Zuora Data Retention Policy. The retention period of deleted data is 30 days. You can only retrieve deleted data for 30 days through AQuA.

            '
          items:
            properties:
              column:
                description: "Name of the Column in the extracted file that points to the deleted records. \n"
                type: string
              format:
                description: 'Can be set to either `Numeric` or `Boolean`. If set to `Numeric`, deleted records are marked as `1`. If set to `Boolean`, deleted records are marked as `true`.

                  '
                type: string
            title: deletedRecord
            type: object
          type: array
        name:
          description: 'The query name that can uniquely identify the query in this API request.

