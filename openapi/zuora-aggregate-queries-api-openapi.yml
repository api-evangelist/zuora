  contact:
    email: docs@zuora.com
host: rest.zuora.com
basePath: /
schemes:
- https
consumes:
- application/json
produces:
- application/json
tags:
- name: Aggregate Queries
  description: "The Aggregate Query API (AQuA) is a REST API that executes multiple <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Query/Export_ZOQL\" target=\"_blank\">Export ZOQL</a> or <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Query/ZOQL\" target=\"_blank\">ZOQL</a> queries. The queries are performed in a sequential order and in a single read-only database transaction. \n\nAQuA enforces the following limits:\n\n- The maximum processing time per query is 3 hours. If a query in an AQuA job is executed for longer than 3 hours, this job will be killed automatically. See the <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/API/AB_Aggregate_Query_API/Bulk_data__extraction_from_Zuora_using_AQuA\" target=\"_blank\">best practices for bulk data extraction with AQuA</a>.\n\n- AQuA enforces limits on both the stateful concurrent AQuA jobs and the stateless concurrent AQuA jobs per tenant:\n\n    - The maximum number of stateful concurrent AQuA jobs per tenant is 50.\n    - The maximum number of stateless concurrent AQuA jobs per tenant is 50.\n\n  AQuA jobs in the following status are counted towards your concurrent AQuA job limits:\n\n    - Submitted\n    - Executing\n\n  Zuora system will reject the subsequent stateful or stateless job requests once the corresponding concurrent job limit is reached.\n\nFor more information about the Aggregate Query API(AQuA), see <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/API/AB_Aggregate_Query_API\" target=\"_blank\">Aggregate Query</a>.      \n"
paths:
  /v1/batch-query/:
    post:
      operationId: POST_BatchQueryJob
      summary: Submit an aggregate query job
      description: 'Submits an AQuA job that contains an aggregated list of ZOQL and Export ZOQL queries.

        '
      tags:
      - Aggregate Queries
      parameters:
      - $ref: '#/parameters/GLOBAL_HEADER_Idempotency_Key'
      - $ref: '#/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/parameters/GLOBAL_HEADER_Authorization_OAuth'
      - $ref: '#/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - $ref: '#/parameters/GLOBAL_HEADER_Zuora_Org_Ids'
      - $ref: '#/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - name: body
        in: body
        required: true
        description: ''
        schema:
          $ref: '#/definitions/SubmitBatchQueryRequest'
      responses:
        '200':
          description: OK
          headers:
            Content-Encoding:
              type: string
              description: "This header is returned if you specify the `Accept-Encoding: gzip` request header and the response contains over 1000 bytes of data.\nNote that only the following MIME types support gzipped responses:\n  - `application/json`\n  - `application/xml`\n  - `text/html`\n  - `text/csv`\n  - `text/plain`\n"
            RateLimit-Limit:
              type: string
              description: 'The request limit quota for the time window closest to exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
            RateLimit-Remaining:
              type: number
              description: 'The number of requests remaining in the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
            RateLimit-Reset:
              type: number
              description: 'The number of seconds until the quota resets for the time window closest to quota exhaustion. See [rate limits](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Policies/Concurrent_Request_Limits#Rate_limits) for more information.

                '
            Zuora-Request-Id:
              type: string
              minLength: 36
              maxLength: 36
              description: 'The Zuora internal identifier of the API call. You cannot control the value of this header.

                '
            Zuora-Track-Id:
              type: string
              maxLength: 64
              description: 'A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.

                '
          schema:
            $ref: '#/definitions/SubmitBatchQueryResponse'
          examples:
            application/json:
              sourceData: LIVE
              encrypted: none
              partner: salesforce
              useLastCompletedJobQueries: false
              project: 00170000011k3ub
              batches:
              - localizedStatus: pending
                apiVersion: '91.0'
                full: false
                recordCount: 0
                batchId: 2c92c0f966cd4f580166ec0ac8a75bb8
                batchType: zoqlexport
                status: pending
                name: AccountingPeriod
                query: select Id,StartDate,EndDate,FiscalYear,Name,Status from AccountingPeriod
              status: submitted
              name: Example
              id: 2c92c0f966cd4f580166ec0ac89d5bb7
              version: '1.1'
              format: CSV
