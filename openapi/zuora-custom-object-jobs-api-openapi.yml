  CustomObjectBulkJobResponse:
    example:
      CreatedById: 7b39d73f-22e6-404a-b8e7-894f7620e91c
      CreatedDate: '2021-03-15T06:47:18Z'
      Id: ed4b9701-bafb-4976-8019-b08269430153
      UpdatedById: 7b39d73f-22e6-404a-b8e7-894f7620e91c
      UpdatedDate: '2021-03-15T06:47:18Z'
      error:
        code: 71012560
        message: Service limit reached, please retry later.
      namespace: default
      object: passenger
      operation: delete
      processingTime: 1882
      recordsProcessed: 500
      status: failed
    properties:
      CreatedById:
        description: The ID of the user who creates the job.
        format: uuid
        type: string
      CreatedDate:
        description: The time when the bulk job is created.
        format: date-time
        type: string
      Id:
        description: The custom object bulk job ID.
        format: uuid
        type: string
      UpdatedById:
        description: The ID of the user who updates the job.
        format: uuid
        type: string
      UpdatedDate:
        description: The time when the bulk job is updated.
        format: date-time
        type: string
      error:
        properties:
          code:
            description: The error code.
            example: 71012560
            format: Int32
            type: integer
          message:
            description: The error message.
            example: Service limit reached, please retry later.
            type: string
        type: object
      namespace:
        description: 'The namespace of the object. Custom objects belong to the `default` namespace. Zuora standard objects belong to the `com_zuora` namespace. Bulk job operations on the following Zuora standard objects are supported:

          * SavedQuery

          '
        enum:
        - default
        - com_zuora
        type: string
      object:
        description: The object to that the bulk operation performs on.
        example: passenger
        type: string
      operation:
        description: 'The operation that the bulk job performs. Only the users that have the "Delete Custom Objects" permission can submit a `delete` bulk job request. Only the users that have the "Edit Custom Objects" permission can submit a `create` or `update` bulk job request. See [Platform Permissions](https://knowledgecenter.zuora.com/Billing/Tenant_Management/A_Administrator_Settings/User_Roles/h_Platform_Roles#Platform_Permissions) for more information.

          '
        enum:
        - delete
        - create
        - update
        type: string
      processingTime:
        description: The amount of time elapsed, in milliseconds, from the submission to the completion of the bulk job.
        example: 550
        type: integer
      recordsProcessed:
        description: The number of object records processed by the bulk job.
        example: 1000
        type: integer
      status:
        description: 'The status of the bulk job:


          - `accepted` - The job has been accepted and is ready to process.

          - `pending` - The job is waiting for your input. You can use [Upload a file for a custom object bulk job](/api-references/api/operation/POST_UploadFileForCustomObjectBulkJob) to upload a file so that the job can start creating records.

          - `in_progress` - The job is processing.

          - `completed` - The job has completed.

          - `failed` - The job was unable to complete. You can use [List all errors for a custom object bulk job](/api-references/api/operation/GET_CustomObjectBulkJobErrors) to list the errors.

          - `cancelled` - The job was cancelled by the server.

          '
        enum:
        - accepted
        - pending
        - in_progress
        - completed
        - failed
        - cancelled
        example: failed
        type: string
    type: object
parameters:
  GLOBAL_HEADER_Idempotency_Key:
    name: Idempotency-Key
    in: header
    required: false
    type: string
    maxLength: 255
    description: "Specify a unique idempotency key if you want to perform an idempotent POST or PATCH request. Do not use this header in other request types. \n\nWith this header specified, the Zuora server can identify subsequent retries of the same request using this value, which prevents the same operation from being performed multiple times by accident. \n"
  GLOBAL_HEADER_Content_Encoding:
    name: Content-Encoding
    in: header
    required: false
    type: string
    description: 'Include the `Content-Encoding: gzip` header to compress a request. With this header specified, you should upload a gzipped file for the request payload instead of sending the JSON payload.

      '
  GLOBAL_HEADER_Accept_Encoding:
    name: Accept-Encoding
    in: header
    required: false
    type: string
    description: "Include the `Accept-Encoding: gzip` header to compress responses as a gzipped file. It can significantly reduce the bandwidth required for a response. \n\nIf specified, Zuora automatically compresses responses that contain over 1000 bytes of data, and the response contains a `Content-Encoding` header with the compression algorithm so that your client can decompress it.\n"
  GLOBAL_HEADER_Zuora_Org_Ids:
    name: Zuora-Org-Ids
    in: header
    required: false
    type: string
    description: "Comma separated IDs. If you have <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Multi-Org\" target=\"_blank\">Zuora Multi-Org</a> enabled, \nyou can use this header to specify which orgs to perform the operation in. If you do not have Zuora Multi-Org enabled, you should not set this header.\n\nThe IDs must be a sub-set of the user's accessible orgs. If you specify an org that the user does not have access to, the operation fails.\n\nIf the header is not set, the operation is performed in scope of the user's accessible orgs.\n"
  GLOBAL_HEADER_Zuora_Entity_Ids_Single:
    name: Zuora-Entity-Ids
    in: header
    required: false
    type: string
    description: 'An entity ID. If you have [Zuora Multi-entity](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Multi-entity) enabled and the OAuth token is valid for more than one entity, you must use this header to specify which entity to perform the operation in. If the OAuth token is only valid for a single entity, or you do not have Zuora Multi-entity enabled, you do not need to set this header.

      '
  GLOBAL_HEADER_Authorization_OAuth:
    name: Authorization
    in: header
    required: true
    type: string
    description: 'The value is in the `Bearer {token}` format where {token} is a valid OAuth token generated by calling [Create an OAuth token](/api-references/api/operation/createToken).

      '
  GLOBAL_HEADER_Zuora_Track_Id:
    name: Zuora-Track-Id
    in: header
    required: false
    type: string
    maxLength: 64
    description: 'A custom identifier for tracing the API call. If you set a value for this header, Zuora returns the same value in the response headers. This header enables you to associate your system process identifiers with Zuora API calls, to assist with troubleshooting in the event of an issue.


      The value of this field must use the US-ASCII character set and must not include any of the following characters: colon (`:`), semicolon (`;`), double quote (`"`), and quote (`''`).

      '
