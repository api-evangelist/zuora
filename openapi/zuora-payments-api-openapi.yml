components:
  parameters:
    GLOBAL_HEADER_Idempotency_Key:
      name: Idempotency-Key
      in: header
      required: false
      description: "Specify a unique idempotency key if you want to perform an idempotent POST or PATCH request. Do not use this header in other request types. \n\nWith this header specified, the Zuora server can identify subsequent retries of the same request using this value, which prevents the same operation from being performed multiple times by accident. \n"
      schema:
        type: string
        maxLength: 255
    GLOBAL_HEADER_Zuora_Track_Id:
      name: Zuora-Track-Id
      in: header
      required: false
      description: 'A custom identifier for tracing the API call. If you set a value for this header, Zuora returns the same value in the response headers. This header enables you to associate your system process identifiers with Zuora API calls, to assist with troubleshooting in the event of an issue.


        The value of this field must use the US-ASCII character set and must not include any of the following characters: colon (`:`), semicolon (`;`), double quote (`"`), and quote (`''`).

        '
      schema:
        type: string
        maxLength: 64
    GLOBAL_REQUEST_pageSize:
      name: pageSize
      in: query
      required: false
      description: 'The number of records returned per page in the response.

        '
      schema:
        type: integer
        default: 20
        maximum: 40
    GLOBAL_HEADER_Accept_Encoding:
      name: Accept-Encoding
      in: header
      required: false
      description: "Include the `Accept-Encoding: gzip` header to compress responses as a gzipped file. It can significantly reduce the bandwidth required for a response. \n\nIf specified, Zuora automatically compresses responses that contain over 1000 bytes of data, and the response contains a `Content-Encoding` header with the compression algorithm so that your client can decompress it.\n"
      schema:
        type: string
    GLOBAL_HEADER_Content_Encoding:
      name: Content-Encoding
      in: header
      required: false
      description: 'Include the `Content-Encoding: gzip` header to compress a request. With this header specified, you should upload a gzipped file for the request payload instead of sending the JSON payload.

        '
      schema:
        type: string
    GLOBAL_HEADER_Authorization_OAuth_optional:
      name: Authorization
      in: header
      required: false
      description: 'The value is in the `Bearer {token}` format where {token} is a valid OAuth token generated by calling [Create an OAuth token](/api-references/api/operation/createToken).

        '
      schema:
        type: string
    GLOBAL_HEADER_Zuora_Entity_Ids_Single:
      name: Zuora-Entity-Ids
      in: header
      required: false
      description: 'An entity ID. If you have [Zuora Multi-entity](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Multi-entity) enabled and the OAuth token is valid for more than one entity, you must use this header to specify which entity to perform the operation in. If the OAuth token is only valid for a single entity, or you do not have Zuora Multi-entity enabled, you do not need to set this header.

        '
      schema:
        type: string
    GLOBAL_HEADER_Zuora_Org_Ids:
      name: Zuora-Org-Ids
      in: header
      required: false
      description: "Comma separated IDs. If you have <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Multi-Org\" target=\"_blank\">Zuora Multi-Org</a> enabled, \nyou can use this header to specify which orgs to perform the operation in. If you do not have Zuora Multi-Org enabled, you should not set this header.\n\nThe IDs must be a sub-set of the user's accessible orgs. If you specify an org that the user does not have access to, the operation fails.\n\nIf the header is not set, the operation is performed in scope of the user's accessible orgs.\n"
      schema:
        type: string
    GLOBAL_REQUEST_page:
      name: page
      in: query
      required: false
      description: 'The index number of the page that you want to retrieve. This parameter is dependent on `pageSize`. You must set `pageSize` before specifying `page`. For example, if you set `pageSize` to `20` and `page` to `2`, the 21st to 40th records are returned in the response.

        '
      schema:
        type: integer
        default: 1
        minimum: 1
  schemas:
    CreatePaymentType:
      allOf:
      - properties:
          accountId:
            description: 'The ID of the customer account that the payment is created for.

              '
            type: string
          accountNumber:
            description: 'The number of the customer account that the payment is created for, such as `A00000001`.


              You can specify either `accountNumber` or `accountId` for a customer account. If both of them are specified, they must refer to the same customer account.

              '
            type: string
          amount:
            description: 'The total amount of the payment.

              '
            format: double
            type: number
          authTransactionId:
            description: "The authorization transaction ID from the payment gateway. Use this field for electronic payments, such as credit cards.\n\nWhen you create a payment for capturing the authorized funds, it is highly recommended to pass in the gatewayOrderId that you used when authorizing the funds by using the [Create authorization](/api-references/api/operation/POST_CreateAuthorization) operation, together with the `authTransactionId` field.\n\nThe following payment gateways support this field:\n  - Adyen Integration v2.0\n  - CyberSource 1.28\n  - CyberSource 1.97\n  - CyberSource 2.0\n  - Chase Paymentech Orbital\n  - Ingenico ePayments\n  - SlimPay\n  - Stripe v2\n  - Verifi Global Payment Gateway\n  - WePay Payment Gateway Integration\n"
            maxLength: 50
            type: string
          comment:
            description: 'Additional information related to the payment.

              '
            maxLength: 255
            minLength: 0
            type: string
          currency:
            description: 'When Standalone Payment is not enabled, the `currency` of the payment must be the same as the payment currency defined in the customer account settings through Zuora UI.


              When Standalone Payment is enabled and `standalone` is `true`, the `currency` of the standalone payment can be different from the payment currency defined in the customer account settings. The amount will not be summed up to the account balance or key metrics regardless of currency.

              '
            type: string
          customRates:
            description: 'It contains Home currency and Reporting currency custom rates currencies. The maximum number of items is 2 (you can pass the Home currency item or Reporting currency item or both).


              **Note**: The API custom rate feature is permission controlled.

              '
            items:
              $ref: '#/components/schemas/PaymentWithCustomRatesType'
            maxItems: 2
            type: array
          debitMemos:
            description: 'Container for debit memos. The maximum number of debit memos is 1,000.

              '
            items:
              $ref: '#/components/schemas/PaymentDebitMemoApplicationCreateRequestType'
            type: array
          effectiveDate:
            description: "The date when the payment takes effect, in `yyyy-mm-dd` format.\n\n**Note:**\n  - This field is required for only electronic payments. It's an optional field for external payments.\n  - When specified, this field must be set to the date of today.\n"
            format: date
            type: string
          financeInformation:
            description: 'Container for the finance information related to the payment.

              '
            properties:
              bankAccountAccountingCode:
                description: 'The accounting code that maps to a bank account in your accounting system.

                  '
                maxLength: 100
                minLength: 0
                type: string
              transferredToAccounting:
                description: "Whether the payment was transferred to an external accounting system. Use this field for integration with accounting systems, such as NetSuite. \n"
                enum:
                - Processing
                - 'Yes'
                - 'No'
                - Error
                - Ignore
                type: string
              unappliedPaymentAccountingCode:
                description: 'The accounting code for the unapplied payment.

                  '
                maxLength: 100
                minLength: 0
                type: string
            type: object
          gatewayId:
            description: "The ID of the gateway instance that processes the payment. The ID must be a valid gateway instance ID and this gateway must support the specific payment method. \n\n- When creating electronic payments, this field is required. \n- When creating external payments, this field is optional.\n\nUse the same gateway instance if both `paymentGatewayNumber` and `gatewayId` are sent in the request.\n"
            type: string
          gatewayOptions:
            description: 'The field used to pass gateway-specific parameters and parameter values. The fields supported by gateways vary. For more information, see the Overview topic of each gateway integration in [Zuora Knowledge Center](https://knowledgecenter.zuora.com/Zuora_Billing/Billing_and_Payments/M_Payment_Gateways/Supported_Payment_Gateways).


              Zuora sends all the information that you specified to the gateway. If you specify any unsupported gateway option parameters, they will be ignored without error prompts.

              '
            properties:
              key:
                description: 'The name of a gateway-specific parameter.

                  '
                maxLength: 255
                type: string
              value:
                description: 'The value of the gateway-specific parameter.

                  '
                maxLength: 255
                type: string
            type: object
          gatewayOrderId:
            description: 'A merchant-specified natural key value that can be passed to the electronic payment gateway when a payment is created. If not specified, the payment number will be passed in instead.


              Gateways check duplicates on the gateway order ID to ensure that the merchant do not accidentally enter the same transaction twice. This ID can also be used to do reconciliation and tie the payment to a natural key in external systems. The source of this ID varies by merchant. Some merchants use their shopping cart order IDs, and others use something different. Merchants use this ID to track transactions in their eCommerce systems.


              When you create a payment for capturing the authorized funds, it is highly recommended to pass in the gatewayOrderId that you used when authorizing the funds by using the [Create authorization](/api-references/api/operation/POST_CreateAuthorization) operation, together with the `authTransactionId` field.

              '
            maxLength: 50
            type: string
          invoices:
            description: 'Container for invoices. The maximum number of invoices is 1,000.

              '
            items:
              $ref: '#/components/schemas/PaymentInvoiceApplicationCreateRequestType'
            type: array
          mitTransactionSource:
            description: "Payment transaction source used to differentiate the transaction source in Stored Credential Transaction framework.\n  - `C_Unscheduled`: Cardholder-initiated transaction (CIT) that does not occur on scheduled or regularly occurring dates.\n  - `M_Recurring`: Merchant-initiated transaction (MIT) that occurs at regular intervals.\n  - `M_Unscheduled`: Merchant-initiated transaction (MIT) that does not occur on scheduled or regularly occurring dates.\n  - `M_MOTO`: Mail Order Telephone Order (MOTO) payment transaction. This option is only available for credit card payments on Stripe v2. See [Overview of Stripe payment gateway integration](https://knowledgecenter.zuora.com/Zuora_Collect/Payment_gateway_integrations/Supported_payment_gateways/Stripe_Payment_Gateway/A_Overview_of_Stripe_payment_gateway_integration) for more information.\n"
            enum:
            - C_Unscheduled
            - M_Recurring
            - M_Unscheduled
            - M_MOTO
            type: string
          paymentGatewayNumber:
            description: "The natural key for the payment gateway. \n\nUse the same gateway instance if both `paymentGatewayNumber` and `gatewayId` are sent in the request.\n"
            type: string
          paymentMethodId:
            description: "The unique ID of the payment method that the customer used to make the payment. \n\nIf no payment method ID is specified in the request body, the default payment method for the customer account is used automatically. If the default payment method is different from the type of payments that you want to create, an error occurs.\n"
            type: string
          paymentMethodType:
            default: null
            description: "The type of the payment method that the customer used to make the payment. \n\nSpecify this value when you are creating an external payment method. If both `paymentMethodType` and `paymentMethodId` are specified, only the `paymentMethodId` value is used to create the payment.\n"
            type: string
          paymentOption:
            description: "Container for the paymentOption items, which describe the transactional level rules for processing payments. Currently, only the Gateway Options type is supported.\n\nHere is an example:\n```\n\"paymentOption\": [\n  {\n    \"type\": \"GatewayOptions\",\n    \"detail\": {\n      \"SecCode\":\"WEB\"\n    }\n  }\n]\n```\n\n`paymentOption` of the payment schedule takes precedence over `paymentOption` of the payment schedule item.\n\nYou can use this field or the `gatewayOptions` field to pass the Gateway Options fields supported by a payment gateway. However, the Gateway Options fields passed through the `paymentOption` field will be stored in the Payment Option object and can be easily retrieved.\n"
            items:
              $ref: '#/components/schemas/PaymentSchedulePaymentOptionFields'
            type: array
          paymentScheduleKey:
            description: The unique ID or the number of the payment schedule to be linked with the payment. See [Link payments to payment schedules](https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Payment_Schedules/Link_payments_with_payment_schedules) for more information.
            type: string
          prepayment:
            description: 'Indicates whether the payment will be used as a reserved payment. See [Prepaid Cash with Drawdown](https://knowledgecenter.zuora.com/Zuora_Billing/Billing_and_Invoicing/JA_Advanced_Consumption_Billing/Prepaid_Cash_with_Drawdown) for more information.

              '
            type: boolean
          referenceId:
            description: 'The transaction ID returned by the payment gateway. Use this field to reconcile payments between your gateway and Zuora Payments.

              '
            maxLength: 100
            minLength: 0
            type: string
          softDescriptor:
            description: A payment gateway-specific field that maps to Zuora for the gateways, Orbital, Vantiv and Verifi.
            maxLength: 35
            type: string
          softDescriptorPhone:
            description: A payment gateway-specific field that maps to Zuora for the gateways, Orbital, Vantiv and Verifi.
            maxLength: 20
            type: string
          standalone:
            default: false
            description: "This field is only available if support for standalone payments is enabled.\n\nSpecify `true` to create a standalone payment that will be processed in Zuora through Zuora gateway integration but will be settled outside of Zuora.\n\nWhen `standalone` is set to `true`:\n  - `accountId`, `amount`, `currency`, and `type` are required. \n  - `type` must be `Electronic`.\n  - `currency` of the payment can be different from the payment currency in the customer account settings.\n  - The amount will not be summed up into the account balance and key metrics regardless of the payment currency.\n  - No settlement data will be created.\n  - Either the applied amount or the unapplied amount of the payment is zero.\n  - The standalone payment cannot be applied, unapplied, or transferred.\n\nSpecify `false` to create an ordinary payment that will be created, processed, and settled in Zuora. The `currency` of an ordinary payment must be the same as the currency in the customer account settings.\n"
            type: boolean
          type:
            description: 'The type of the payment.

              '
            enum:
            - External
            - Electronic
            type: string
        required:
        - amount
        - currency
        - type
        type: object
      - $ref: '#/components/schemas/PaymentObjectNSFields'
      - $ref: '#/components/schemas/PaymentObjectCustomFields'
      example:
        accountId: 4028905f5a87c0ff015a87d25ae90025
        amount: 44.1
        comment: normal payment
        currency: USD
        customRates:
        - currency: CAD
          customFxRate: 2.22
          rateDate: '2022-10-21'
        - currency: EUR
