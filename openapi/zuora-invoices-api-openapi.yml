        revenueRecognitionRuleName:
          description: 'The name of the revenue recognition rule governing the revenue schedule.

            **Note:** This field is only available if you have Zuora Finance enabled.

            '
          type: string
        sku:
          description: 'The SKU of the invoice item. The SKU of the discount item must be different from the SKU of any existing product.

            '
          type: string
        taxItems:
          description: 'Container for taxation items. The maximum number of taxation items is 5.


            **Note**: This field is only available only if you have Taxation enabled.

