openapi: 3.2.0
info:
  version: '2023-12-15'
  title: Reference Invoices API
  description: '# Introduction


    Welcome to the REST API reference for the Zuora Billing, Payments, and Central Platform!'
  contact:
    email: docs@zuora.com
servers:
- url: https://rest.zuora.com/
tags:
- name: Invoices
  description: 'Invoices provides information about customers'' accounts for invoices, for examples, dates, status, and amounts.


    For more information about invoices, see Invoice.'
paths:
  /v1/invoices/batch:
    post:
      description: 'Creates multiple standalone invoices for selling physical goods, services or other items on a non-recurring basis to your subscription customers.


        To use this operation, you must have the "Create Standalone Invoice" and "Modify Invoice" user permissions. See Billing Roles for more information. As of Zuora Release 2022.03.R5, newly created standard Billing users have the “Create Standalone Invoice” permission enabled by default.


        ### Limitations


        This operation has the following limitations:

        * You can create a maximum of 50 invoices in one request.

        * You can create a maximum of 1,000 invoice items in one request.'
      summary: Create standalone invoices
      operationId: POST_StandaloneInvoices
      tags:
      - Invoices
      parameters:
      - $ref: '#/components/parameters/GLOBAL_HEADER_Idempotency_Key'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Accept_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Content_Encoding'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Authorization_OAuth_optional'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Track_Id'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
      - $ref: '#/components/parameters/GLOBAL_HEADER_Zuora_Org_Ids'
