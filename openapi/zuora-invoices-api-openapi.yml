                maxLength: 64
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostBatchInvoiceResponse'
              example:
                invoices:
                - id: 4028818484f483d20184f5006b97003f
                  invoiceNumber: INV00000001
                  accountId: 4028818484f483d20184f4f7efc40001
                  amount: 700.0
