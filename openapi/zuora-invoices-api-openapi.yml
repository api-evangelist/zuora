components:
  parameters:
    GLOBAL_HEADER_Idempotency_Key:
      name: Idempotency-Key
      in: header
      required: false
      description: "Specify a unique idempotency key if you want to perform an idempotent POST or PATCH request. Do not use this header in other request types. \n\nWith this header specified, the Zuora server can identify subsequent retries of the same request using this value, which prevents the same operation from being performed multiple times by accident. \n"
      schema:
        type: string
        maxLength: 255
    GLOBAL_HEADER_Zuora_Track_Id:
      name: Zuora-Track-Id
      in: header
      required: false
      description: 'A custom identifier for tracing the API call. If you set a value for this header, Zuora returns the same value in the response headers. This header enables you to associate your system process identifiers with Zuora API calls, to assist with troubleshooting in the event of an issue.


        The value of this field must use the US-ASCII character set and must not include any of the following characters: colon (`:`), semicolon (`;`), double quote (`"`), and quote (`''`).

        '
      schema:
        type: string
        maxLength: 64
    GLOBAL_REQUEST_pageSize:
      name: pageSize
      in: query
      required: false
      description: 'The number of records returned per page in the response.

        '
      schema:
        type: integer
        default: 20
        maximum: 40
    GLOBAL_HEADER_Authorization_OAuth_optional:
      name: Authorization
      in: header
      required: false
      description: 'The value is in the `Bearer {token}` format where {token} is a valid OAuth token generated by calling [Create an OAuth token](/api-references/api/operation/createToken).

        '
      schema:
        type: string
    GLOBAL_HEADER_Accept_Encoding:
      name: Accept-Encoding
      in: header
      required: false
      description: "Include the `Accept-Encoding: gzip` header to compress responses as a gzipped file. It can significantly reduce the bandwidth required for a response. \n\nIf specified, Zuora automatically compresses responses that contain over 1000 bytes of data, and the response contains a `Content-Encoding` header with the compression algorithm so that your client can decompress it.\n"
      schema:
        type: string
    GLOBAL_HEADER_Content_Encoding:
      name: Content-Encoding
      in: header
      required: false
      description: 'Include the `Content-Encoding: gzip` header to compress a request. With this header specified, you should upload a gzipped file for the request payload instead of sending the JSON payload.

        '
      schema:
        type: string
    GLOBAL_HEADER_Zuora_Entity_Ids_Single:
      name: Zuora-Entity-Ids
      in: header
      required: false
      description: 'An entity ID. If you have [Zuora Multi-entity](https://knowledgecenter.zuora.com/BB_Introducing_Z_Business/Multi-entity) enabled and the OAuth token is valid for more than one entity, you must use this header to specify which entity to perform the operation in. If the OAuth token is only valid for a single entity, or you do not have Zuora Multi-entity enabled, you do not need to set this header.

        '
      schema:
        type: string
    GLOBAL_HEADER_Zuora_Org_Ids:
      name: Zuora-Org-Ids
      in: header
      required: false
      description: "Comma separated IDs. If you have <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Multi-Org\" target=\"_blank\">Zuora Multi-Org</a> enabled, \nyou can use this header to specify which orgs to perform the operation in. If you do not have Zuora Multi-Org enabled, you should not set this header.\n\nThe IDs must be a sub-set of the user's accessible orgs. If you specify an org that the user does not have access to, the operation fails.\n\nIf the header is not set, the operation is performed in scope of the user's accessible orgs.\n"
      schema:
        type: string
    GLOBAL_REQUEST_page:
      name: page
      in: query
      required: false
      description: 'The index number of the page that you want to retrieve. This parameter is dependent on `pageSize`. You must set `pageSize` before specifying `page`. For example, if you set `pageSize` to `20` and `page` to `2`, the 21st to 40th records are returned in the response.

        '
      schema:
        type: integer
        default: 1
        minimum: 1
  schemas:
    PostDiscountItemType:
      allOf:
      - properties:
          accountingCode:
            description: 'The accounting code associated with the discount item.

              '
            type: string
          accountsReceivableAccountingCode:
            description: 'The accounting code for accounts receivable.

              '
            type: string
          adjustmentLiabilityAccountingCode:
            description: 'The accounting code for adjustment liability.

              **Note**: This field is only available if you have the Billing - Revenue Integration feature enabled.

              '
            type: string
          adjustmentRevenueAccountingCode:
            description: 'The accounting code for adjustment revenue.

              **Note**: This field is only available if you have the Billing - Revenue Integration feature enabled.

              '
            type: string
          amount:
            description: 'The amount of the discount item.

              - Should be a negative number. For example, `-10`.

              - Always a fixed amount no matter whether the discount charge associated with the discount item uses the [fixed-amount model or percentage model](https://knowledgecenter.zuora.com/Billing/Subscriptions/Product_Catalog/B_Charge_Models/B_Discount_Charge_Models#Fixed_amount_model_and_percentage_model).

              - For tax-exclusive discount items, this amount indicates the discount item amount excluding tax.

              - For tax-inclusive discount items, this amount indicates the discount item amount including tax.

              '
            format: number
            type: string
          bookingReference:
            description: 'The booking reference of the discount item.

              '
            type: string
          chargeDate:
            description: 'The date when the discount item is charged, in `yyyy-mm-dd hh:mm:ss` format.

              '
            format: date-time
            type: string
          chargeName:
            description: 'The name of the charge associated with the discount item.

              This field is required if the `productRatePlanChargeId` field is not specified in the request body.

              '
            type: string
          contractAssetAccountingCode:
            description: 'The accounting code for contract asset.

              **Note**: This field is only available if you have the Billing - Revenue Integration feature enabled.

              '
            type: string
          contractLiabilityAccountingCode:
            description: 'The accounting code for contract liability.

              **Note**: This field is only available if you have the Billing - Revenue Integration feature enabled.

              '
            type: string
          contractRecognizedRevenueAccountingCode:
            description: 'The accounting code for contract recognized revenue.

              **Note**: This field is only available if you have the Billing - Revenue Integration feature enabled.

              '
            type: string
          deferredRevenueAccountingCode:
            description: 'The accounting code for the deferred revenue, such as Monthly Recurring Liability.

              **Note:** This field is only available if you have Zuora Finance enabled.

              '
            type: string
          description:
            description: 'The description of the discount item.

              '
            type: string
          itemType:
            description: 'The type of the discount item.

              '
            type: string
          productRatePlanChargeId:
            description: 'The ID of the product rate plan charge that the discount item is created from.


              If you specify a value for the `productRatePlanChargeId` field in the request, Zuora directly copies the values of the following fields from the corresponding product rate plan charge, regardless of the values specified in the request body:

              - `chargeName`

              - `sku`


              If you specify a value for the `productRatePlanChargeId` field in the request, Zuora directly copies the values of the following fields from the corresponding discount charge that [uses discount specific accounting codes, rule and segment to manage revenue](https://knowledgecenter.zuora.com/Billing/Subscriptions/Product_Catalog/B_Charge_Models/Manage_Discount_Charges#Use_discount_specific_accounting_codes.2C_rule_and_segment_to_manage_revenue), regardless of the values specified in the request body:

              - `accountingCode`

              - `deferredRevenueAccountingCode`

              - `recognizedRevenueAccountingCode`


              If you specify a value for the `productRatePlanChargeId` field in the request, Zuora directly copies the values of the following fields from the corresponding invoice item charge if the discount charge DOES NOT [use discount specific accounting codes, rule and segment to manage revenue](https://knowledgecenter.zuora.com/Billing/Subscriptions/Product_Catalog/B_Charge_Models/Manage_Discount_Charges#Use_discount_specific_accounting_codes.2C_rule_and_segment_to_manage_revenue), regardless of the values specified in the request body:

              - `accountingCode`

              - `deferredRevenueAccountingCode`

              - `recognizedRevenueAccountingCode`

              '
            type: string
          purchaseOrderNumber:
            description: 'The purchase order number associated with the discount item.

              '
            type: string
          recognizedRevenueAccountingCode:
            description: 'The accounting code for the recognized revenue, such as Monthly Recurring Charges or Overage Charges.

              **Note:** This field is only available if you have Zuora Finance enabled.

              '
            type: string
          revRecCode:
