- aid: zuora:zuora-debit-memos-api
  name: Zuora Debit Memos API
  description: >-
    Debit memos increase the amount a customer owes. It is a separate document from the invoice. Debit
    memos can be used to correct undercharging on an invoice or to levy ad hoc charges outside the context
    of a subscription. Just like an invoice, debit memo balances can be settled by applying either a payment
    or a credit memo.


    For more information about debit memos, see <a href="https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Invoice_Settlement/B_Credit_and_Debit_Memos"
    target="_blank">Credit and debit memos</a>.
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Debit Memos
