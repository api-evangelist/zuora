- aid: zuora:zuora-prepaid-with-drawdown-api
  name: Zuora Prepaid with Drawdown API
  description: >-
    The Prepaid with Drawdown feature is a pricing model for consumption-based services, such as data
    storage. Under this model, customers pay upfront to receive a number of units, usually for a period
    of time like a month or a year. Then they consume against that prepayment balance in a use-it-or-lose-it
    fashion, with a possibility of topping up more units or being charged for any overage. This model
    strikes a balance between upfront commitment and the pure pay-as-you-go pricing models. For more information,
    see <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Bill_your_customers/Bill_for_usage_or_prepaid_products/Advanced_Consumption_Billing/Prepaid_with_Drawdown"
    target="_blank">Prepaid with Drawdown</a>.
