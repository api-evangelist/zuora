- aid: zuora:zuora-accounts-api
  name: Zuora Accounts API
  description: >-
    Some operations in this section are similar to each other, but are provided for different use scenarios.
    You should choose the one that best suits your needs.


    For example, the [Create account](/v1-api-reference/api/accounts/post_account) operation is used to
    create an account with a credit card payment method, a bill-to contact, and optionally an sold-to
    contact or an associated subscription. If you want to create an account without creating any associated
    objects such as subscriptions, use [CRUD: Create Account](/api-references/api/operation/Object_POSTAccount)
    instead.


    If you want to create an account and the associated subscription at the same time without providing
    credit card information, use the [Subscribe](/api-references/api/operation/Action_POSTsubscribe) action.
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
