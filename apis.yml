  - type: OpenAPI
    url: openapi/zuora-accounts-api-openapi.yml
- aid: zuora:zuora-actions-api
  name: Zuora Actions API
  description: >-
    Actions are operations that are batch in nature. For example, the "create", "update", "delete", and
    other operations allow changes to up-to 50 objects at a time. The "query" operation will return up-to
    2000 result records back at a time, before requiring additional pages of data to be returned via a
    subsequent "queryMore" operation.


    The default WSDL version for Actions is 79. If you want to change the WSDL version, set the `X-Zuora-WSDL-Version`
    header. To find out in which WSDL version a particular object or field was introduced, see [Zuora
    SOAP API Version History](https://knowledgecenter.zuora.com/DC_Developers/G_SOAP_API/Zuora_SOAP_API_Version_History).


    **Note**: Actions do not support the Invoice Settlement feature. This feature includes Unapplied Payments,
    Credit and Debit Memo, and Invoice Item Settlement. Actions also do not support the Orders feature.
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Actions
  properties:
  - type: OpenAPI
    url: openapi/zuora-actions-api-openapi.yml
- aid: zuora:zuora-aggregate-queries-api
  name: Zuora Aggregate Queries API
  description: "The Aggregate Query API (AQuA) is a REST API that executes multiple <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Query/Export_ZOQL\"\
    \ target=\"_blank\">Export ZOQL</a> or <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/Query/ZOQL\"\
    \ target=\"_blank\">ZOQL</a> queries. The queries are performed in a sequential order and in a single\
    \ read-only database transaction. \n\nAQuA enforces the following limits:\n\n- The maximum processing\
    \ time per query is 3 hours. If a query in an AQuA job is executed for longer than 3 hours, this job\
    \ will be killed automatically. See the <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/API/AB_Aggregate_Query_API/Bulk_data__extraction_from_Zuora_using_AQuA\"\
    \ target=\"_blank\">best practices for bulk data extraction with AQuA</a>.\n\n- AQuA enforces limits\
    \ on both the stateful concurrent AQuA jobs and the stateless concurrent AQuA jobs per tenant:\n\n\
    \    - The maximum number of stateful concurrent AQuA jobs per tenant is 50.\n    - The maximum number\
    \ of stateless concurrent AQuA jobs per tenant is 50.\n\n  AQuA jobs in the following status are counted\
    \ towards your concurrent AQuA job limits:\n\n    - Submitted\n    - Executing\n\n  Zuora system will\
    \ reject the subsequent stateful or stateless job requests once the corresponding concurrent job limit\
    \ is reached.\n\nFor more information about the Aggregate Query API(AQuA), see <a href=\"https://knowledgecenter.zuora.com/Zuora_Central_Platform/API/AB_Aggregate_Query_API\"\
    \ target=\"_blank\">Aggregate Query</a>."
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Aggregate Queries
  properties:
  - type: OpenAPI
    url: openapi/zuora-aggregate-queries-api-openapi.yml
