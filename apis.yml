- aid: zuora:zuora-products-api
  name: Zuora Products API
  description: >-
    A product is an item or service that your company sells. In the subscription economy, a product is
    generally a service that your customers subscribe to rather than a physical item that they purchase
    one time. For example, customers subscribe to a service that provides them a car when and where they
    need a car rather than buying a car outright.


    A Product object contains all of the items in a specific product, especially product rate plans and
    product rate plan charges. Each Product object can have multiple rate plans, which in turn can each
    have multiple rate plan charges. Each rate plan charge can have multiple tiers. Taken together, all
    of these items create a single product.


    Customers subscribe to products that are in your product catalog. Product objects collectively compose
    your product catalog. You create your product catalog by creating products. As soon as you create
    your first product, you create your product catalog.
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Product
  tags_raw:
  - Products
  properties:
  - type: OpenAPI
    url: openapi/zuora-products-api-openapi.yml
- aid: zuora:zuora-ramps-api
  name: Zuora Ramps API
  description: >-
    A Ramp is a time container to associate with rate plan charges in your subscription. Inside the Ramp,
    you can further define a set of Ramp Intervals (time-based periods) where products or pricing can
    change. These periods are sub time containers to enable you to report out-of-the-box metrics based
    on Ramp Intervals.


    **Notes**: You must have both the Ramps feature and Orders feature enabled for your tenant to use
    the Ramps operations.


    For more information, see <a href="https://knowledgecenter.zuora.com/Billing/Subscriptions/Orders/Ramps_and_Ramp_Metrics"
    target="_blank">Ramps and Ramp Metrics</a>.
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Ramps
  properties:
  - type: OpenAPI
    url: openapi/zuora-ramps-api-openapi.yml
- aid: zuora:zuora-rate-plans-api
  name: Zuora Rate Plans API
  description: "A rate plan is part of a subscription or an amendment to a subscription, and it comes\
    \ from a product rate plan. Like a product and its product rate plans, a subscription can have one\
    \ or more rate plans. \nRate plans are sometimes called subscription rate plans. Rate plans that are\
    \ part of an amendment are sometimes called amendment rate plans.\n\nRate plans represent a price\
    \ or a collection of prices for a service you sell. An individual rate plan contains all charges specific\
    \ to a particular subscription."
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Rate Plans
  properties:
  - type: OpenAPI
    url: openapi/zuora-rate-plans-api-openapi.yml
- aid: zuora:zuora-refunds-api
  name: Zuora Refunds API
  description: "Zuora allows you to issue and track refunds on payments. Similar to external payments,\
    \ users can enter external refunds to track refunds that have been performed outside of Zuora Payments\
    \ (for example, by issuing a check). \nIn addition, you can make electronic refunds using our supported\
    \ payment gateways, which will automatically refund money to the customer."
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Refunds
  properties:
  - type: OpenAPI
    url: openapi/zuora-refunds-api-openapi.yml
- aid: zuora:zuora-regenerate-api
  name: Zuora Regenerate API
  description: >-
    If you are an <a href="https://knowledgecenter.zuora.com/Zuora_Billing/Enable_Order_to_Revenue" target="_blank">Order
    to Revenue</a> user, you can use the Regenerate operations to regenerate transactions objects.
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Regenerate
  properties:
  - type: OpenAPI
    url: openapi/zuora-regenerate-api-openapi.yml
- aid: zuora:zuora-rsa-signatures-api
  name: Zuora RSA Signatures API
  description: "The REST API used in Payment Pages 2.0 are CORS (Cross-Origin Resource Sharing) enabled\
    \ and therefore requires a digital signature. \n\nYou can use the [Generate an RSA signature](https://www.zuora.com/redocly-test/api-references/api/operation/POST_RSASignatures/)\
    \ operation to generate the required digital signature and token for a Payment Pages 2.0 form, then\
    \ use the [Decrypt an RSA signature](https://www.zuora.com/redocly-test/api-references/api/operation/POST_DecryptRSASignatures/)\
    \ operation to decrypt the signature to validate the signature and key.\""
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - RSA Signatures
  properties:
  - type: OpenAPI
    url: openapi/zuora-rsa-signatures-api-openapi.yml
- aid: zuora:zuora-sequence-sets-api
  name: Zuora Sequence Sets API
  description: "You can create billing document sequence sets through the REST API or the Zuora UI, allowing\
    \ distinct numbering sequences for billing documents, payments, and refunds. \n\nTo create a billing\
    \ document sequence set through the Zuora UI, see <a href=\"https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/Billing_Settings/Prefix_and_Numbering_Configuration_for_Billing_Documents/Create_Billing_Document_Sequence_Sets\"\
    \ target=\"_blank\">Create Billing Document Sequence Sets</a> for more information."
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Sequence Sets
  properties:
  - type: OpenAPI
    url: openapi/zuora-sequence-sets-api-openapi.yml
- aid: zuora:zuora-settings-api
  name: Zuora Settings API
  description: >-
    The Setting API provides a central API for managing settings in your Zuora tenant.


    If you use Postman, you can import the Settings API endpoints as a collection into your Postman app
    and try out different requests to learn how the API works. Click the following button to get started:


    [![Run in Postman](https://run.pstmn.io/button.svg)](https://www.getpostman.com/run-collection/1379901-d43e93a3-7d51-437c-b4cd-14163dd62fa2-SWLk4kiK)


    You can sign up for a free account on the [Postman website](https://identity.getpostman.com/signup)
    and download the app in case you do not use Postman yet.
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Settings
  properties:
  - type: OpenAPI
    url: openapi/zuora-settings-api-openapi.yml
- aid: zuora:zuora-sign-up-api
  name: Zuora Sign Up API
  description: "A light-weight API to sign up customers and subscribe. \n\nYou need to have the [Orders](https://knowledgecenter.zuora.com/Zuora_Billing/Subscriptions/Orders)\
    \ or [Orders Harmonization](https://knowledgecenter.zuora.com/Zuora_Billing/Subscriptions/Orders/Orders_Harmonization)\
    \ feature enabled to use this API."
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Sign Up
  properties:
  - type: OpenAPI
    url: openapi/zuora-sign-up-api-openapi.yml
- aid: zuora:zuora-subscriptions-api
  name: Zuora Subscriptions API
  description: >-
    A subscription is a product or service that has recurring charges, such as a monthly flat fee or charges
    based on usage. Subscriptions can also include one-time charges, such as activation fees. Every subscription
    must be associated with an account. At least one active account must exist before any subscriptions
    can be created.


    For more information, see <a href="https://knowledgecenter.zuora.com/Billing/Subscriptions/Subscriptions"
    target="_blank">Subscriptions</a>.
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Subscription
  tags_raw:
  - Subscriptions
  properties:
  - type: OpenAPI
    url: openapi/zuora-subscriptions-api-openapi.yml
- aid: zuora:zuora-summary-journal-entries-api
  name: Zuora Summary Journal Entries API
  description: "A summary journal entry is a summary of Zuora transaction amounts organized by accounting\
    \ code and general ledger segments. A segment adds more reporting granularity through business dimensions,\
    \ such as country or product. \n\nFor more information, see <a href=\"https://knowledgecenter.zuora.com/Billing/Finance/F_Summary_Journal_Entries/A_SJE_Introduction\"\
    \ target=\"_blank\">Summary Journal Entries Introduction</a>"
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Summary Journal Entries
  properties:
  - type: OpenAPI
    url: openapi/zuora-summary-journal-entries-api-openapi.yml
- aid: zuora:zuora-taxation-items-api
  name: Zuora Taxation Items API
  description: >-
    The TaxationItem object is used to add a tax amount to an invoice item. In the typical use case, the
    tax amount that you specify in the object is calculated by <a href="https://knowledgecenter.zuora.com/Billing/Taxes/A_Zuora_Tax"
    target="_blank">Z-Tax</a> or a third-party tax engine such as <a href="https://knowledgecenter.zuora.com/Billing/Taxes/Direct_Avalara_Integration"
    target="_blank">Avalara</a> or <a href="https://knowledgecenter.zuora.com/Billing/Taxes/Additional_resources_on_taxes/AA_Connect_Tax_Engines"
    target="_blank">Connect tax engine</a>.


    Changes that you make with this object affect the product charges in your product catalog, but not
    the charges in existing subscriptions.
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Taxation Items
  properties:
  - type: OpenAPI
    url: openapi/zuora-taxation-items-api-openapi.yml
- aid: zuora:zuora-usage-api
  name: Zuora Usage API
  description: "Consumption of a billable service or resource (such as database storage space or bundles\
    \ of emails sent) provides the basis for some charge models - simple usage, tiered pricing, or volume\
    \ pricing. \nTo make this work, usage must be tracked in the system and usage charges must be calculated\
    \ and invoiced. \nUsage is always billed in arrears - for example, you might bill customers in February\
    \ for their January usage. Usage can be billed on a recurring monthly, quarterly, semi-annual, or\
    \ annual basis.\n\nFor more information about working with usage data, see <a href=\"https://knowledgecenter.zuora.com/Billing/Billing_and_Payments/J_Billing_Operations/Usage\"\
    \ target=\"_blank\">Usage</a>."
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Usage
  properties:
  - type: OpenAPI
    url: openapi/zuora-usage-api-openapi.yml
- aid: zuora:zuora-workflows-api
  name: Zuora Workflows API
  description: >-
    A workflow is a sequence of tasks that are performed based on predefined logic. A workflow improves
    efficiency and reduces errors by automating a series of complex tasks that otherwise need to be performed
    manually and repetitively.


    For more information, see <a href="https://knowledgecenter.zuora.com/Central_Platform/Workflow" target="_blank">Workflow</a>.
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Workflows
  properties:
  - type: OpenAPI
    url: openapi/zuora-workflows-api-openapi.yml
- aid: zuora:zuora-zuora-revenue-integration-api
  name: Zuora Zuora Revenue Integration API
  description: >-
    **Note:** You can only use the operations in this section if you have the Billing - Revenue Integration
    feature enabled. See <a href="https://knowledgecenter.zuora.com/Zuora_Revenue/Billing_-_Revenue_Integration"
    target="_blank">Billing - Revenue Integration</a> for more information.
  humanURL: https://developer.zuora.com/v1-api-reference/introduction
  tags:
  - Zuora Revenue Integration
  properties:
  - type: OpenAPI
    url: openapi/zuora-zuora-revenue-integration-api-openapi.yml
